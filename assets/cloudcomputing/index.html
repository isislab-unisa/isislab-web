<script>
'use strict';
const byId=id=>document.getElementById(id);
const escapeHTML=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function safeURL(v){if(typeof v!=='string')return '#';if(v.startsWith('#'))return v;try{const u=new URL(v,location.href);return ['http:','https:'].includes(u.protocol)?u.href:'#';}catch{return '#';}}
function inline(v){const t=document.createElement('template');t.innerHTML=String(v??'');for(const e of [...t.content.querySelectorAll('*')]){if(!['BR','EM','STRONG','B','SPAN','A'].includes(e.tagName)){e.replaceWith(document.createTextNode(e.textContent));continue;}let href=e.getAttribute('href'),cls=e.getAttribute('class');for(const a of [...e.attributes])e.removeAttribute(a.name);if(e.tagName==='A'){e.href=safeURL(href);if(!String(href).startsWith('#')){e.target='_blank';e.rel='noopener noreferrer';}}else if(e.tagName==='SPAN'&&cls==='outline')e.className='outline';}return t.innerHTML;}
const E=escapeHTML;
const text=(id,v)=>{byId(id).textContent=v??''};
const aria=(el,v)=>el.setAttribute('aria-label',v??'');
function progress(n,msg){const p=byId('load-progress');p.value=n;text('load-percent',Math.round(n)+'%');if(msg!=null)text('load-stage',msg);}

const pills=a=>`<div class="pillrow">${a.map(x=>`<span class="pill">${E(x)}</span>`).join('')}</div>`;
const minis=a=>a.map(([n,d])=>`<div class="mini"><b>${E(n)}</b><p>${E(d)}</p></div>`).join('');

const note=(v,style='')=>`<p class="note"${style?` style="${style}"`:''}>${E(v)}</p>`;

function courseMeta(c,u){return `${c.cfu} ${u.credits_unit}${c.hours!=null?' · '+c.hours+' '+u.hours_unit:''} · ${c.semester}${u.semester_unit}`;}
function courseCard(c,u){return `<article class="course"><span class="id">${E(u.code_prefix+c.code+' · '+u.required_status)}</span><h3>${E(c.title)}</h3><span class="meta">${E(courseMeta(c,u))}</span><p>${E(c.description)}</p>${c.extra?note(c.extra):''}${link([u.link,c.reference_previous_year?u.previous_year:'',u.link_icon].filter(Boolean).join(' '),c.url)}</article>`;}
function renderCatalogFromConfig(cfg,filter){const u=cfg.ui.course,k=cfg.ui.catalog;byId('catalog').innerHTML=cfg.data.groups.filter(g=>filter==='all'||g.filter===filter||g.filter==='both').map((g,i)=>`<details${i===0?' open':''}><summary>${E(g.label)}<small>${E(g.credits+(g.courses.length?' · '+g.courses.length+' '+k.options:''))}</small></summary>${g.courses.length?`<ul>${g.courses.map(id=>{const c=cfg.data.electives.find(x=>x.code===id);if(!c)return '';return `<li><div>${E(c.title)}<small>${E(u.code_prefix+id+' · '+c.hours+' '+u.hours_unit+' · '+c.semester+k.semester_short+' — '+c.description)}</small>${c.requires_revision?`<small>${E(k.revision_note)}</small>`:''}</div><b>${E(c.cfu+' '+u.credits_unit)}</b></li>`}).join('')}</ul>`:''}${g.note?note(g.note):''}</details>`).join('');}
function renderContent(cfg){
 const s=cfg.sections,u=cfg.ui.course,labels=cfg.ui.labels;
 document.title=cfg.meta.title;document.documentElement.lang=cfg.meta.lang;

 for(const [id,key] of [['world-labels','annotations'],['scene-key','legend'],['annotation-close','close_annotation'],['nav','navigation']])aria(byId(id),labels[key]);

 const bodies={};
 bodies.start=pills(s.start.pills)+`<a class="cta" href="${E(safeURL(s.start.cta_url))}">${E(s.start.cta)} <span>${E(s.start.cta_icon)}</span></a>`;
 bodies.cloud=`<div class="panel stack">${minis(s.cloud.mini)}${note(s.cloud.note,'margin:0')}</div>`;
 bodies.science=`<div class="panel tiles">${tiles(s.science.tiles)}</div>${keyLegend(s.science.legend,s.science.legend_aria)}<p class="source">${E(s.science.source)}</p>`;
 bodies.ai=`<div class="panel"><div class="flow">${s.ai.flow.map((v,i)=>`${i?`<b>${E(s.ai.flow_separator)}</b>`:''}<span>${E(v)}</span>`).join('')}</div>${keyLegend(s.ai.legend,s.ai.legend_aria)}<div class="fl-note"><strong>${E(s.ai.fl_note_title)}</strong> ${E(s.ai.fl_note)}</div><div class="split">${s.ai.split.map(([n,d])=>`<div><h3>${E(n)}</h3><p class="muted">${E(d)}</p></div>`).join('')}</div>${note(s.ai.note,'margin:0')}</div>`;
 bodies.careers=`<div class="panel"><div class="tiles">${s.careers.metrics.map(([v,l])=>`<div class="metric"><strong>${E(v)}</strong><small>${E(l)}</small></div>`).join('')}</div>${note(s.careers.note)}<div class="tiles">${tiles(s.careers.tiles)}</div></div><p class="source">${inline(s.careers.source_html)}</p>`;
 bodies.courses=`${keyLegend(s.courses.legend)}<div class="year">${E(s.courses.year1)}</div><div class="coursegrid" id="year1">${cfg.data.courses_required.filter(c=>c.year===1).map(c=>courseCard(c,u)).join('')}</div><div class="year">${E(s.courses.year2)}</div><div class="coursegrid" id="year2">${cfg.data.courses_required.filter(c=>c.year===2).map(c=>courseCard(c,u)).join('')}</div>${note(s.courses.note,'margin-top:20px')}${link(s.courses.link_text,s.courses.link_url)}`;

 bodies.hpc=`<div class="course hpc" style="min-height:0"><span class="id">${E(u.code_prefix+hc.code+' · '+u.elective_status)}</span><h3>${E(hc.title)}</h3><span class="meta">${E(courseMeta(hc,u))}</span><p>${E(s.hpc.availability)}</p><p>${E(s.hpc.note)}</p>${link(s.hpc.link_text,s.hpc.link_url)}</div><div class="panel" style="margin-top:12px">${minis(s.hpc.mini)}</div>`;
 bodies.electives=`<div class="panel"><div class="filter" id="filters" aria-label="${E(s.electives.filters_aria)}">${s.electives.filters.map((f,i)=>`<button type="button" data-filter="${E(f.id)}" aria-pressed="${i===0}">${E(f.label)}</button>`).join('')}</div><div class="catalog" id="catalog"></div>${note(s.electives.note,'margin:18px 0 0')}</div><div class="split" style="margin-top:15px">${tiles(s.electives.tiles)}</div>${note(s.electives.examples_note,'margin-top:12px')}`;
 bodies.future=`${pills(s.future.pills)}${link(s.future.cta,s.future.cta_url,'cta')}<div class="footer">${note(s.future.footer_note)}<p class="source">${inline(s.future.footer_sources_html)}</p>${note(s.future.footer_note2)}${link(s.future.back_link.label,s.future.back_link.url)}</div>`;
