  title: '&#8220;Visualizzazione in Augmented Reality di simulazioni Agent-based&#8221; di G.Barone, L.Grimaldi e P.Russo'
  speakers:
  - '9'
  description: "Pagine web di Pietro Russo , Gerardo Barone e Lucio Grimaldi\n\nAbstract:\n\"Unire la ricchezza espressiva dell' Augmented Reality con la potenza delle simulazioni Agent-based al fine di realizzare un sistema mobile per il supporto di esperienze di Scientific/Data Visualization condivise ed interattive.\nIn questo seminario verranno descritte brevemente le motivazioni di questo lavoro di tesi, le tecnologie e le soluzioni adottate per il suo sviluppo e i risultati ottenuti finora.\n\nScaletta della presentazione:\n\nintroduzione al problema\n\nLa soluzione proposta\n\nMASON e il modello Agent-based\n\nIl core della simulazione\n\nIl problema e la gestione dei messaggi\n\nL'ambiente Unity3D e Google Cloud Anchor\n\nDemo\n\nSviluppi futuri\""
