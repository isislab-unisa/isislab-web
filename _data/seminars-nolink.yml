  venue: Laboratorio ISISLab, Dipartimento di Informatica, Università di Salerno (Edificio F, Stecca 7, Lab. 10, II piano) &#8211; Via Giovanni Paolo II, 132, 84084 Fisciano (SA).
  title: 'Seminario: &#8220;Le tecnologie usate dalle aziende&#8221; di Tianyu Su'
  speakers:
  - '9'
  description: "In questo seminario presenterò la mia esperienza di tirocinio, durante la quale ho approfondito tecnologie appartenenti a uno degli stack più popolari per lo sviluppo di applicazioni enterprise. Queste tecnologie sono state utilizzate anche in progetti formativi, con l'obiettivo di mettere in pratica quanto appreso."
  image: /assets/img/seminars/50275-c19e35f396.jpg
- date: 17/03/2025
  time: 14:00 - 15:00
  venue: Laboratorio ISISLab, Dipartimento di Informatica, Università di Salerno (Edificio F, Stecca 7, Lab. 10, II piano) &#8211; Via Giovanni Paolo II, 132, 84084 Fisciano (SA)
  title: Presentazioni Lavori tesi di Laurea di Vincenzo Offertucci e Francesco Pio Covino
  speakers:
  - '9'
  description: "SPEAKER : Vincenzo OFFERTUCCI\nTitolo : CrossWarp: un framework per l'integrazione tra mondi virtuali e realtà aumentata\n\nAbstract:\nNegli ultimi anni, la realtà virtuale (VR) e la realtà aumentata (AR) hanno visto un rapido sviluppo, ampliando gli scenari applicativi e offrendo nuovi modi di interagire con il mondo digitale. Tuttavia, sebbene abbiano raggiunto una maturità tecnologica significativa, le soluzioni esistenti tendono a essere vincolate a specifici dispositivi o casi d’uso, limitando le possibilità di collaborazione. In questo contesto, il paradigma della Cross-Reality (CR) si propone di superare tali barriere, offrendo un’integrazione fluida tra dispositivi desktop, mobile AR e visori immersivi.\nIn questo seminario introduciamo CrossWarp, un framework progettato per abilitare esperienze di collaborazione in tempo reale tra utenti con dispositivi diversi all’interno di uno spazio virtuale comune. Il sistema si distingue per tre aspetti chiave: (i) supporto alla transizione fluida di oggetti digitali tra diverse realtà, preservando stato e contesto; (ii) interoperabilità tra piattaforme eterogenee, consentendo interazioni ibride tra desktop e mobile AR; (iii) flessibilità ed estensibilità, adattandosi a diversi ambiti applicativi.\n\nSPEAKER: Francesco Pio COVINO\nTitolo: XR-PaestumGate:un Serious Game per la valutazione del coinvolgimento nelle ricostruzioni di siti archeologici\n\nAbstract:\nXR-PaestumGate esplora il potenziale delle tecnologie immersive quali la Realtà Virtuale (VR) nell’ambito della valorizzazione del patrimonio culturale. Il progetto, open source, estende la ricostruzione virtuale del sito archeologico di Paestum mediante la progettazione e l’implementazione di un serious game (SG) in VR integrando meccaniche di gioco progettate per aumentare il coinvolgimento e l’interesse dell’utente. Lo sviluppo ha integrato strumenti di modellazione 3D, il Game Engine Unity e tecnologie di Extended Reality (XR) per la creazione di un serious game immersivo. L’esperienza si compone di varie attività, dall’esplorazione dell’ambiente per scoprirne i luoghi chiave alla possibilità di condurre una biga romana. Il SG è stato sviluppato in due versioni: desktop e VR. L’intera esperienza è stata testata da 16 partecipanti divisi in due gruppi, ogni gruppo ha provato entrambe le versioni ma in ordine inverso. Per valutare il tutto è stato utilizzato un questionario diviso in diverse sezioni, somministrate in diversi momenti del test. Il questionario valutativo è basato su tre scale di valutazione: GUESS, EgameFlow, SUS. Il fine dell’esperimento è stato valutare l’impatto esperienziale su coinvolgimento, apprendimento e percezione del valore culturale che il serious game in virtual reality ha generato rispetto alla versione desktop. I risultati statistici dimostrano che la versione VR di XR PaestumGate aumenta il coinvolgimento ma crea anche una connessione emotiva con il passato portando gli utenti ad approfondire gli argomenti trattati in virtuale. Questo studio rappresenta un passo avanti nella connessione tra tecnologie immersive e beni culturali, sottolineando l’importante ruolo della XR nella promozione e tutela del nostro patrimonio comune."
