  title: 'Seminar: Beyond Moore’s Law: The Role of Hybrid Quantum-Classical Computing, Vincenzo De Maio'
  speakers:
  - '9'
  description: "With the increasing computational requirements of modern applications, the limitations of classical hardware, as theorized by Moore's law, are becoming increasingly prevalent. Therefore, the computing landscape is shifting toward novel architectures that extend beyond Moore’s Law. Among these, hybrid quantum-classical systems have emerged as a promising approach to further scale current capabilities of HPC systems. This talk explores the interplay between quantum and HPC, examining how quantum processors can be leveraged alongside classical HPC architectures to enhance computational efficiency of complex tasks, such as optimization, simulation, and machine learning. We will discuss current advancements in hybrid quantum-classical systems, such as variational algorithms, and the most prominent frameworks to enable hybrid quantum-classical computation. Afterward, we will provide an overview of the research in this area, including the experience with the HPQC project and some recent research achievements. Finally, we will provide an"
