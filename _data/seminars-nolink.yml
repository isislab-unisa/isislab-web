  title: 'Seminario: &#8220;Implementazione di un plugin per dati GIS in krABMaga&#8221; di Christian Mascolo'
  speakers:
  - '9'
  description: "In questo seminario andremo ad analizzare la struttura e funzionalità di un plugin sviluppato per il framework KrABMaga, un motore di simulazione basato su eventi discreti scritto in linguaggio Rust. Il plugin permette di caricare dati geospaziali (GIS) all’interno di una simulazione e visualizzarli all'interno della GUI. Attraverso l’uso di dati GIS è possibile creare scenari 2D, come mappe o strade, senza particolare sforzo. Il plugin dà la possibilità ai modellisti di analizzare la popolazione in situazioni reali, misurando l’impatto dei fattori geografici sulle dinamiche degli agenti."
  image: /assets/img/seminars/15668-502cf4e5ee.jpg
- date: 05/04/2024
  time: 14:00 - 15:00
  venue: ''
  title: 'Seminario: &#8220;Automatizzazione e monitoraggio del processo di deploy di un’immagine Docker&#8221; di Alessandro d&#8217;Esposito'
  speakers:
  - '9'
  description: "Si presenterà l'analisi svolta sulle tecnologie utili per automatizzare e monitorare il processo di rilascio di un applicativo containerizzato in ambiente Docker Swarm, prevedendo eventuali contromisure (attive e/o passive) in caso di errori. Tale analisi porterà alla definizione e all'implementazione di nuove funzionalità all'interno di una piattaforma middleware scritta in Java e basata su framework Spring.\nSi andranno a delineare, quindi, gli interventi di maggior rilievo implementati all'interno della soluzione in esercizio al fine di aumentare il livello di sicurezza e di affidabilità delle funzionalità offerte, in modo da ottimizzare i processi di rilascio dell'intero ciclo di sviluppo.\nInfine, si andranno ad orientare gli sviluppi futuri della soluzione e a delineare le sfide più interessanti ed innovative per la piattaforma, oltre a definire un benchmark per effettuare valutazioni comparative ed analitiche della soluzione automatizzata rispetto a quella manuale."
  image: /assets/img/seminars/14976-6e49653ca3.jpg
- date: 22/03/2024
  time: 14:00 - 15:00
  venue: ''
  title: 'Seminario: &#8220;Optimizing Urban Traffic Light Flow: A Julia-based Intelligent Control System&#8221; di Simone Giglio'
  speakers:
  - '9'
  description: "\"Il lavoro di tesi esplora l'integrazione della simulazione ad eventi discreti con la modellazione basata su agenti, con particolare attenzione alle dinamiche degli incroci stradali nelle intersezioni urbane. Attraverso l’uso del linguaggio di programmazione Julia, linguaggio particolarmente adatto al mondo della programmazione scientifica, l'obiettivo principale è quello di ottimizzare il flusso del traffico ed acquisire\nuna comprensione approfondita delle interazioni presenti nei sistemi urbani. Partendo da una revisione della letteratura, si delineerà una metodologia di simulazione chiara e accurata, seguita dall’ottimizzazione svolta tramite l’algoritmo di ottimizzazione stocastica adatto a risolvere problemi di fisica statistica che prende il nome di Simulated Annealing, per poi passare all’analisi esaustiva dei risultati raggiunti, in cui si è ottenuto un miglioramento rispetto alla soluzione di base dal 5 al 7,5% sui vari scenari studiati.\nIl contributo principale di questo lavoro sta nell'offrire nuove prospettive e approfondimenti significativi per la gestione degli incroci stradali e l'ottimizzazione del traffico urbano, arricchendo così il panorama della\nricerca in questo campo."
  image: /assets/img/seminars/14959-49c9587b70.jpg
- date: 15/03/2024
  time: 14:30 - 15:30
  venue: ''
  title: 'Seminario: &#8220;Entity Component System in krABMaga: approfondimenti su prestazioni e visualizzazione&#8221; di Francesco Foglia'
  speakers:
  - '9'
  description: "Le simulazioni agent-based sono uno strumento innovativo per lo studio del comportamento di sistemi complessi. L'esecuzione di queste simulazioni può richiedere un quantitativo significativo di risorse computazionali al crescere dei parametri della simulazione. Il framework krABMaga nasce per facilitare la realizzazione di simulazioni performanti e affidabili. Il lavoro svolto riassume i cambiamenti apportati a krABMaga. Viene analizzata la transizione da Amethyst a Bevy Engine come motore grafico per la visualizzazione delle simulazioni. L'utilizzo di Bevy Engine ha permesso di aggiungere il supporto all'esecuzione di simulazioni in ambiente WebAssembly tramite WebGL, all'interno di un browser web. La visualizzazione delle simulazioni è stata resa interattiva, permettendo di avviare, terminare e mettere in pausa una simulazione, oltre che di controllare il numero di step da eseguire per secondo. Lo sviluppo della visualizzazione per ambienti basati su grafi ha seguito questa transizione, permettendo l'implementazione della parte grafica della simulazione Virus on a Network. Questa transizione ha permesso anche di condurre un esperimento sull'integrazione dell'architettura Entity Component System, caratterizzante per Bevy Engine, anche nel motore di simulazioni di krABMaga, in modo da valutare un possibile beneficio in termini di prestazioni."
  image: /assets/img/seminars/14955-ad6ad33fd4.jpg
- date: 08/03/2024
  time: 15:00 - 16:00
  venue: ''
  title: 'Seminario: &#8220;krABMaga e MPI: implementazione di un campo distribuito per simulazioni basate su agenti&#8221; di Andrea Tranquillo'
  speakers:
  - '9'
  description: "Un Modello Basato su Agenti è un modello computazionale usato per simulare le azioni e le interazioni di agenti autonomi, in maniera da comprendere il comportamento di un sistema complesso e ciò che ne governa gli esiti. Le simulazioni che utilizzano tale modello sono generalmente molto costose in termini di potenza computazionale, quindi, per consentire la creazione di simulazioni molto più complesse, è necessario adottare il paradigma di programmazione distribuita, dividendo tale costo tra diverse macchine. Il problema principale nell'adozione di tale paradigma è trovare un modo per distribuire il campo di simulazione e far sì che gli agenti continuino ad interagire tra loro anche se rilocati su diverse macchine. In questo seminario, verrà presentata una struttura dati da utilizzare come campo di simulazione distribuito, il KdTree, e come i principali problemi di sincronizzazione che possono sorgere in questo tipo di applicazioni sono stati risolti utilizzando MPI. Verranno infine mostrati i risultati ottenuti confrontando il KdTree con la sua controparte sequenziale."
  image: /assets/img/seminars/14946-188da16872.png
- date: 01/03/2024
  time: 15:00 - 16:00
  venue: ''
  title: 'Seminario: &#8220;Automatizzazione e monitoraggio del processo di deploy di applicazioni containerizzateSeminario: &#8221; di Alessandro D&#8217;EspositoSeminario: &#8220;Automatizzazione e monitoraggio del processo di deploy di applicazioni containerizzateSeminario: &#8221; di'
  speakers:
  - '9'
  description: "Si condurrà un'analisi sulle tecnologie utili per automatizzare e storicizzare il processo di rilascio e il conseguente monitoraggio di un applicativo basato su un'immagine Docker in ambiente Docker Swarm, prevedendo eventuali contromisure (e.g., rollback) in caso di malfunzionamento e logiche di retention delle risorse presenti sullo specifico ambiente (i.e., immagini, container , volumi). Le immagini oggetto di rilascio verranno scaricate da registry privati (e.g., GitLab) o pubblici (e.g., Docker Hub). Tale analisi risulterà nell'estensione e nuova implementazione di servizi REST di una piattaforma middleware già sviluppata in Java 17 con il framework Spring e che ha il compito di effettuare il rilascio di una nuova immagine in uno stack Docker già in esercizio e gestito tramite Portainer su una macchina target."
  image: /assets/img/seminars/14943-42c1558385.jpg
- date: 23/02/2024
  time: 14:00 - 15:00
  venue: ''
  title: 'Seminar: &#8220;SYCL-Bench 2020: Benchmarking SYCL 2020 on AMD, Intel, and NVIDIA GPUs&#8221;, Luigi Crisci'
  speakers:
  - '9'
  description: "Today, the SYCL standard represents the most advanced programming model for heterogeneous computing, delivering both productivity, portability, and performance in pure C++17.\nSYCL 2020, in particular, represents a major enhancement that pushes the boundaries of heterogeneous programming by introducing a number of new features.\nAs the new features are implemented by existing compilers, it becomes critical to assess the maturity of the implementation through accurate and specific benchmarking.\nThis paper presents SYCL-Bench 2020, an extended benchmark suite specifically designed to evaluate six key features of SYCL 2020: unified shared memory, reduction kernel, specialization constants, group algorithms, in-order queue, and atomics.\nWe experimentally evaluate SYCL-Bench 2020 on GPUs from the three major vendors, i.e., AMD, Intel, and NVIDIA, and on two different SYCL implementations AdaptiveCPP and oneAPI DPC++."
  image: /assets/img/seminars/14938-11557443c7.jpg
- date: 16/02/2024
  time: 00:30 - 00:30
  venue: ''
  title: 'Seminario: &#8220;Improving cyber Threat Intelligence sharing platform with blockchain and decentralized autonomous organizations&#8221; di Antonio Donnarumma e Mario Offertucci'
  speakers:
  - '9'
  description: "\nIn un mondo dove internet e la connettività diventano sempre più parte integrante della nostra vita quotidiana, la sicurezza dei dati ditigali diventa sempre più centrale siccome le minacce sono in continua crescita, con avversari informatici che evolvono continuamente le loro tattiche per sfruttare vulnerabilità e compromettere la riservatezza, l'integrità e la disponibilità dei dati sensibili.\n\nI sistemi di intelligence sulle minacce informatiche svolgono un ruolo cruciale nel fronteggiare queste sfide facilitando lo scambio di informazioni tempestive e pertinenti tra diverse parti interessate. Questa condivisione collaborativa comprende indicatori di compromissione, tattiche, tecniche e procedure (TTP) e informazioni contestuali che migliorano significativamente la capacità di rilevare, mitigare e rispondere alle minacce informatiche.\n\nNonostante i vantaggi evidenti, le aziende spesso nutrono timori nel condividere informazioni sensibili, temendo che la divulgazione di dettagli sulle proprie vulnerabilità informatiche, incidenti o strategie difensive possa esporle a rischi aggiuntivi. Questo timore è radicato nella convinzione che adottare una posizione di sicurezza più trasparente le renderebbe bersagli attraenti. Inoltre, c'è il rischio che gli utenti possano passare alla concorrenza se scoprono che il loro fornitore di servizi è stato attaccato.\n\nPer affrontare questi problemi, questa iniziativa mira a sfruttare la blockchain per migliorare l'anonimato. La piattaforma proposta per la condivisione di informazioni sulle minacce informatiche è intesa come una Decentralized Autonomous Organization (DAO) e rappresenta una soluzione democratica e robusta basata sulla blockchain Ethereum."
  image: /assets/img/seminars/14934-828d9b6f8d.jpg
- date: 14/12/2023
  time: 15:00 - 16:00
  venue: ''
  title: 'Seminar: &#8220;Using blockchain and decentralized autonomous organizations (DAOs) to solve Cyber Threat Intelligence (CTI) sharingSeminar&#8221;, Antonio Donnarumma and Mario Offertucci'
  speakers:
  - '9'
  description: "Nowadays with the wide diffusion of the Internet of Things (IoT) the attack surface has also drastically increased. Attackers can find new zero-day vulnerabilities in such an easy way so it is important for defenders to find a proper way to share what is called cyber threat intelligence (CTI) to respond to these assaults quickly. Here's where Web3 finds another use case with the idea to create a fully decentralized platform able to solve the CTI sharing problems (such as anonymity of sharing company). There is a lot of discussion on how to use the disruptive technology of blockchain to achieve this. In our vision a solution can be found in a decentralized autonomous organization (DAO) where everyone can and should participate to reach a common goal: enforce our security perimeter. Furthermore, to enhance this solution we merged the advantages of using blockchain with the elasticity of serverless cloud computing"
  image: /assets/img/seminars/14794-63ae0d8af7.png
- date: 07/12/2023
  time: 09:00 - 11:00
  venue: Aula P20 Edificio F3, Dipartimento di Informatica – Università di Salerno
  title: Seminario:&#8221;Insegnare la Blockchain a Scuola. Come trasformare un tema complicato in un gioco e sviluppare una riflessione sulla sicurezza informatica&#8221; di Lorenzo Guasti, Alessandro Ferrini e Gabriele Pieraccini
  speakers:
  - '9'
  description: "E' possibile spiegare cos'è la blockchain a studenti delle scuole elementari e medie?\nSembra che non è facile rendere comprensibile un concetto tanto complesso ma un team di ricercatori di INDIRE sta sperimentando un modo innovativo per farlo: attraverso un gioco da tavolo.\n\nIl seminario universitario \"Insegnare la Blockchain a Scuola\" spiegherà la genesi del gioco e le fasi che hanno portato al test in diverse classi.\nI ragazzi, divisi in squadre, devono costruire una \"catena di blocchi\" calcolando codici crittografici, proprio come funziona la reale tecnologia blockchain.\nMa non è solo tecnologia: giocando, i bambini imparano anche valori importanti come il lavoro di squadra e la collaboration. Perchè la forza è nel gruppo, come nella rete blockchain decentrata.\nInoltre il gioco stimola una riflessione su temi attuali come la sicurezza informatica e le criptovalute.\n\nInterverranno gli ideatori del progetto, Lorenzo Guasti, Alessandro Ferrini e Gabriele Pieraccini che presenteranno i risultati della ricerca sull'impatto del gioco sull'apprendimento. Sarà l'occasione per discutere di didattica innovativa e di come usare giochi e gamification per introdurre studenti a concetti difficili in modo divertente e coinvolgente"
  image: /assets/img/seminars/14770-dde4d31c0d.png
- date: 30/11/2023
  time: 12:00 - 12:00
  venue: ''
  title: 'Seminario: &#8220;Web-Based Porting of VRKG-CollaborativeExploration: Adapting Virtual Reality Knowledge Graph Exploration to Browser Environments&#8221; di Gabriele Lodato'
  speakers:
  - '9'
  description: "\nThis project focuses on the transformation of VRKG-CollaborativeExploration, a Virtual Reality (VR) application designed for knowledge graph exploration, into a web-based platform accessible through standard web browsers. The original application, developed in the Unity environment, facilitated data-driven discussions using a 3D representation of a Knowledge Graph induced by SPARQL query results. The goal of the project was to ensure a seamless transition from the VR application to the web, maintaining user engagement and efficiency. The implementation involved leveraging Unity for VR functionalities and JavaScript for SPARQL query integration. Challenges included adapting VR features to a web context, synchronizing user actions, and addressing compatibility issues. The resultant web-based solution retained the original application's functionality, introducing enhancements for optimal web user experience.\nThe project concludes with a proposed direction for future developments, aiming to conduct a thorough analysis of user engagement, assess learning effectiveness, and explore additional features for collaborative knowledge exploration in both VR and web environments."
  image: /assets/img/seminars/14762-5fb7e7922c.png
- date: 23/11/2023
  time: 16:00 - 17:00
  venue: ''
  title: 'Seminario: &#8220;Un sistema IoT per la rilevazione e la segnalazione in tempo reale delle buche stradali&#8221; di  Michele Delli Paoli'
  speakers:
  - '9'
  description: "L'infrastruttura stradale è un elemento essenziale per la mobilità di un paese, in quanto consente il trasporto di merci e di persone.\nTuttavia, la presenza di irregolarità e di buche nel manto stradale può essere causa di problemi di sicurezza per i conducenti e di danneggiamento per i veicoli.\nA tal proposito, il monitoraggio costante delle condizioni del manto stradale è un aspetto fondamentale per la manutenzione preventiva e per la prevenzione di incidenti stradali.\nPertanto, urge la necessità di trovare una soluzione che automatizzi il processo di monitoraggio e di rilevazione di irregolarità del manto stradale.\nIl progetto in questione ha visto la realizzazione di un sistema IoT per la rilevazione e la segnalazione delle buche stradali in maniera automatizzata."
