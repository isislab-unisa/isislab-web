  speakers:
  - '9'
  description: "Per contact tracing si intende l'attività di tracciamento dei soggetti che potrebbero avere avuto contatti stretti con persone positive al Covid-19. Le tecnologie digitali rappresentano un valido supporto nella gestione della emergenza pandemica, pur presentando limiti e problematiche non solo in termini di violazione della privacy degli individui. Dopo aver discusso di contact tracing, dei diversi meccanismi di gestione delle notifiche e delle soluzioni proposte worldwide, presenterò Immuni, l'app di notifiche di esposizione del governo italiano, discutendo dei suoi pro e contro, attualmente temi caldi in vari ambiti, da quello tecnologico a quello giuridico.\n\nIl seminario si svolgerà in modalità telematica sul canale vocale #seminars di Discord .\n\nIl collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale # seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:\n\nISISLab Seminars in Discord"
