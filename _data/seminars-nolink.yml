  title: 'Seminario: &#8220;l Cloud Computing nelle Scienze Biomediche e nell&#8217;Assistenza Sanitaria&#8221; di Jacopo Troisi'
  speakers:
  - '9'
  description: "Il cloud computing rappresenta una forza trasformativa nelle scienze biomediche e nell’assistenza sanitaria, consentendo la gestione scalabile e sicura di enormi volumi di dati clinici e di ricerca. Questo seminario esplora le principali applicazioni del cloud computing nel settore sanitario, come la telemedicina, la gestione delle cartelle cliniche elettroniche (EHR) e l’assistenza personalizzata, evidenziando i benefici derivanti dalla collaborazione in tempo reale e dall'integrazione di dati complessi. Si esaminano inoltre le sue applicazioni nella ricerca biomedica, con particolare attenzione alle piattaforme per l’analisi multi-omica (genomica, proteomica, metabolomica), tra cui Galaxy, ProteoCloud e PhenoMeNal. Pur riconoscendo i vantaggi offerti da queste tecnologie, verranno approfondite le sfide legate alla sicurezza, alla sostenibilità e alla standardizzazione. Attraverso questa analisi, si delineano le opportunità e le criticità dell’adozione del cloud computing per migliorare la qualità delle cure e accelerare le scoperte scientifiche, promuovendo al contempo una maggiore collaborazione tra istituzioni e ricercatori a livello globale.\n\nBiosketch : Docente a contratto presso il Dipartimento di Chimica e Biologia ”A. Zambelli” dell’Università degli Studi di Salerno, dove insegna ”Metabolomica” e ”Igiene”. Nel 2015 ha fondato Theoreo Srl, uno spin-off universitario, che tuttora dirige, specializzato nel campo della metabolomica e dei servizi per la ricerca. Ha ottenuto numerosi brevetti\nsia nazionali sia internazionali per test di screening basati sul profiling metabolomico. La sua attività di ricerca è vasta e comprende oltre 150 pubblicazioni su riviste internazionali. Nel 2023 ha istituito la fondazione EIM ”European Institute of Metabolomics”, iscritta al RUNTS, che raccoglie eminenti ricercatori nel settore della metabolomica. Ha pubblicato\nper Elsevier il primo testo di metabolomica specificamente pensato per la didattica: ”Metabolomics Perspectives: From Theory to Practical Application”. Oltre a dirigere un nutrito gruppo di ricerca attivo in ambito metabolomico, è responsabile di diversi progetti di ricerca sia a livello nazionale che internazionale. Collabora con numerosi istituti e ricercatori in tutto il mondo e presta la sua opera come valutatore di progetti scientifici per la Commissione Europea."
