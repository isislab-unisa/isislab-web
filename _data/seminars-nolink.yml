  title: 'Seminario: SeMQuAK: Modellazione Semantica delle Metriche di Qualità dei Knowledge Graph di Valentina Ferrentino'
  speakers:
  - '9'
  description: "La valutazione automatica della qualità dei Knowledge Graph (KG) genera grandi quantità di dati, prodotti periodicamente dagli strumenti di analisi. Un esempio è KGHeartBeat, progetto open source dell’ISISLab che monitora oltre 1.600 dataset della LOD Cloud, rilasciando ogni settimana file CSV con i risultati delle metriche di qualità. Questi file, però, offrono una visione frammentata e poco interoperabile dei dati, rendendo difficile analizzare l’evoluzione della qualità nel tempo.\nPer superare questo limite, la mia tesi propone SeMQuAK (Semantic Modeling of Quality Assessment in Knowledge Graphs), un modulo software sviluppato in Python che trasforma i dati CSV in un modello semantico basato su RDF. Attraverso un processo di Estrazione, Trasformazione e Caricamento, SeMQuAK normalizza i valori e li rappresenta in un grafo unico e coerente, conforme ai principi dei Linked Data.\nQuesto approccio rende i dati di qualità interoperabili, tracciabili e riutilizzabili, facilitando analisi comparative e monitoraggi nel tempo."
  image: /assets/img/seminars/50595-a4808025f4.png
- date: 17/10/2025
  time: 12:00 - 13:00
  venue: Laboratorio ISISLab, Dipartimento di Informatica, Università di Salerno (Edificio F, Lab. 10, II piano), Via Giovanni Paolo II, 132, 84084 Fisciano SA, Fisciano
  title: 'Seminario: &#8220;Dall’identità al codice: avatar su misura tra MakeHuman e Unity nella pipeline 3Dify&#8221; di Anna Tagliamonte'
  speakers:
  - '9'
  description: "Il progetto “Dall’identità al codice: avatar su misura tra MakeHuman e Unity nella pipeline 3Dify” si inserisce nell’ambito dello sviluppo di sistemi tridimensionali interattivi e affronta il tema della generazione automatica di avatar digitali personalizzati.\nL’obiettivo è ottimizzare la pipeline 3Dify mediante l’integrazione del sistema UMA (Unity Multipurpose Avatar) all’interno di Unity, così da consentire la traduzione diretta dei parametri morfologici di MakeHuman in corrispondenti controlli UMA.\nL’analisi comparativa degli slider dei due ambienti ha permesso di definire una mappatura coerente dei parametri antropometrici e visivi, nonché un modello di normalizzazione funzionale alla compatibilità tra le due piattaforme.\nL’adozione del pacchetto UMA riduce significativamente il carico computazionale del sistema, eliminando la dipendenza dai container di MakeHuman e rendendo il processo di generazione più modulare, flessibile ed efficiente.\nIl progetto combina attività di ricerca, modellazione tridimensionale e sviluppo software, con particolare attenzione agli aspetti di interazione e user experience, e mira a migliorare l’adattabilità e l’efficacia della pipeline in prospettiva di futuri scenari applicativi nei campi della realtà virtuale, della formazione medica e della simulazione interattiva."
  image: /assets/img/seminars/50572-6a5f814abc.png
- date: 09/10/2025
  time: '13:00'
