  title: 'Seminario. &#8220;Rust AB: Graphics Update &#038; Distributed Flockers&#8221; di Francesco Foglia e Pasquale Caramante'
  speakers:
  - '9'
  description: "Rust-AB è un framework per lo sviluppo di simulazioni basate\n\nsu agenti scritto in Rust e sviluppato dal nostro laboratorio ISISLab.\n\nNelle ultime settimane, abbiamo apportato alcune migliorie e abbiamo\n\naggiunto alcune nuove funzionalità importanti. Al fine di sperimentare\n\nle prestazioni di Rust-AB in ambiente distribuito, il modello Flockers\n\nè stato re-implementato sfruttando rsmpi, una libreria che offre i\n\nbindings MPI in Rust. Per quanto riguarda la visualizzazione invece,\n\nla gran parte del lavoro si è concentrato su due punti principali: la\n\nmigrazione a Bevy 0.6 e l'aggiunta del controllo della velocità di una\n\nsimulazione. Questo seminario tratterà dei risultati ottenuti relativi\n\na questi punti, assieme alla descrizione dei prossimi punti in fase di\n\nsviluppo."
