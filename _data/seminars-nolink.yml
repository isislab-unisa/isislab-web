  title: 'Seminario: &#8220;Come controllare un&#8217;epidemia? Tecniche di immunizzazione basate su ipergrafi&#8221; di Antonio Addeo'
  speakers:
  - '9'
  description: "\"La disciplina epidemiologica si occupa dello studio e dell'analisi della distribuzione e dei pattern di contagio delle malattie infettive all'interno di una popolazione. I classici modelli matematici come quelli compartimentali sono in grado di fornire un dettagliato livello di comprensione e predizione riguardo le dinamiche di un'epidemia. Tuttavia si basano sull'assunto che gli individui interagiscano tra di loro in maniera casuale. Nella realtà ogni persona ha un insieme di contatti, ovvero altre persone che può infettare, che costituisce una rete. Il processo epidemico può essere plasmato attraverso una rete in cui una malattia si diffonde da un nodo all'altro. Sfruttando le proprietà topologiche della rete e i pattern di mobilità è possibile fare congetture sulla propagazione dell'infezione. A incentivare tale approccio c'è la disponibilità di una gran mole di dati riguardanti gli spostamenti delle persone, ricavabili da fonti quali i social network. Una rete del genere può essere astratta tramite un ipergrafo, una generalizzazione della classica struttura a grafo in cui le connessioni tra i vertici, gli iperarchi, possono comprendere un numero qualsiasi di vertici, non limitandosi a 2. Un ipergrafo può modellare una rete come quella sopracitata, in tal caso gli individui di una popolazione vengono associati ai nodi mentre gli iperarchi consistono nei luoghi da loro frequentati. Per controllare la diffusione di una malattia in una popolazione si può decidere di immunizzare una categoria di persone o di luoghi. Lo scopo di questo lavoro è quello di sviluppare e validare tecniche di immunizzazione per ipergrafi. Le strategie implementate mirano a selezionare un gruppo di nodi/individui o iperarchi/luoghi da immunizzare al fine di limitare la propagazione epidemica in una popolazione. Le tecniche sono state sperimentate su insieme di dati ricavato dal social network Foursquare e simulate mediante un approccio agent-based model che emula interazioni tra utenti. Il codice e i risultati, open-source e disponibili nella repository https://github.com/aleant93/TVHEpidemicDynamics.jl, forniscono una visione dell'efficacia di ogni strategia e un confronto tra esse. È stata simulata, inoltre, l'efficacia del concetto di contact tracing (ad esempio, tramite l'utilizzo da parte delle persone di un'applicazione di tracciamento come Immunti) per ridurre la diffusione di un'epidemia.\"\n\nIl seminario si svolgerà in modalità telematica sul canale vocale #seminars di Discord .\n\nIl collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale # seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:\n\nISISLab Seminars in Discord"
