  description: "I concetti di Web Semantico, Linked Open Data e Knowledge Graph sono stati ampiamente studiati per modellare qualsiasi tipo di informazione. L'accesso ai dati, però, viene ostacolato dai linguaggi di interrogazione, come SPARQL, che sono particolarmente complessi soprattutto per gli utenti senza competenze tecniche. Il mio progetto di tesi mira a verificare l'interoperabilità tra Knowledge Graph e chatbot. In particolare, si pone l'obiettivo di progettare e implementare un generatore di bot multipiattaforma configurabile per l'interrogazione in linguaggio naturale di SPARQL endpoint. Il focus di questo seminario sarà introdurre l'intero progetto ponendo l'accento su un primo step, cioè lo sviluppo del modulo per la gestione delle diverse piattaforme.\n\nSeminarioISISLab-21-7-2021 (3)\n\nIl collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale # seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:\n\nISISLab Seminars in Discord"
