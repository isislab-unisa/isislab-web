  title: 'Seminario: &#8220;Presentazione dei lavori di tesi&#8221; di Davide Numelli, Antonio Pappalardo e Domenico Di Caprio'
  speakers:
  - '9'
  description: "1) \"Digital Forensics e Threat Intelligence in ambienti cloud\" di Davide Numelli\n\nAbstract:\nLa memoria volatile di un sistema compromesso conserva i processi in esecuzione, le connessioni di rete aperte, le credenziali caricate e il codice che un attaccante ha iniettato senza mai scriverlo su disco: è l’evidenza più ricca di un’indagine e, insieme, la più fragile, perché ogni istante è di esecuzione ne modifica il contenuto e lo spegnimento della macchina lo distrugge. Negli ambienti cloud il problema cambia natura: la macchina da esaminare e una macchina virtuale che vive sull’ hypervisor di un provider, non esiste un reperto da sequestrare. Acquisire la memoria dall’interno del guest e una strada debole, perché l’agente di acquisizione altera lo stato che ´dovrebbe fotografare e dipende dagli strumenti di un sistema che, per ipotesi, e sotto il controllo dell’attaccante. Questa tesi presenta ForensicNova, un’estensione di OpenStack per l’acquisizione e l’analisi forense della RAM di macchine virtuali compromesse. La memoria del guest è letta a livello di hypervisor, out-of-band, tramite le primitive di dump di libvirt, senza installare ne eseguire alcunché nel guest: un write-blocker naturale. Le impronte crittografiche (MD5 e SHA-1) sono ´calcolate prima di ogni trasferimento, l’evidenza e archiviata in Swift con verifica end-to-end e ogni stadio alimenta una chain of custody legata all’identità dell’analista, fino a un report PDF `predisposto per la firma. Un backend dedicato esegue Volatility 3 secondo preset di profondità crescente, ne estrae gli indicatori di compromissione (IOC) filtrando il rumore, li correla con un’istanza MISP e sintetizza l’esito in un punteggio di rischio deterministico (verde, giallo, rosso), con l’attribuzione a strumenti, attori e tecniche MITRE ATT&CK. La pipeline soddisfa i principi di NIST SP 800-86, ISO/IEC 27037 e ISO/IEC 27042.\nIl sistema è validato sperimentalmente con una cyber kill chain realistica riprodotta in laboratorio su un guest Windows Server 2022, attraverso quattro scenari ottenuti da una macchina prima pulita e poi compromessa, con la stessa immagine infetta sottoposta ad analisi di profondità crescente. Gli esiti scalano dal verde della baseline al giallo di un triage fast con un feed pubblico, al rosso determinato dal solo segnale comportamentale e al rosso con attribuzione in presenza di un’intelligence più ricca. La campagna riscontra sul campo la soundness dell’acquisizione e la sensibilità del rilevamento, mostrando come, a parità di dump, il giudizio segua la profondità dell’analisi e la qualità dell’intelligence disponibile.\n\n2) \"Architettura a Microfrontend per lo sviluppo di una Web Application basata sui servizi di Google Cloud\" di Antonio Pappalardo\n\nAbstract:\nIl successo dell’architettura a microservizi e i numerosi vantaggi ad essa associati hanno favorito la nascita di nuovi paradigmi architetturali ispirati agli stessi principi, estendendone l’applicazione anche al livello frontend. Tra questi, uno dei più rilevanti è rappresentato dai Micro Frontend, approccio che consente di suddividere un’applicazione in moduli indipendenti, migliorandone la scalabilità, la manutenibilità e l’organizzazione dello sviluppo. L’obiettivo di questo lavoro è la progettazione e la realizzazione di un’applicazione web per la gestione di un istituto scolastico basata su un’architettura a Micro Frontend. Il sistema è stato sviluppato all’interno di una monorepository gestita mediante Nx e Webpack Module Federation, adottando Angular come framework per la realizzazione dei singoli Micro Frontend. Per la gestione dei servizi cloud sono state impiegate le tecnologie offerte da Google Cloud, in particolare Firebase Authentication per l’autenticazione degli utenti, Cloud Firestore per la persistenza dei dati e Firebase Hosting per il deployment dell’applicazione. L’architettura realizzata soddisfa i principali requisiti di modularità, disaccoppiamento e distribuibilità, consentendo lo sviluppo e il rilascio indipendente dei diversi moduli applicativi. Tra i possibili sviluppi futuri si prevede l’introduzione di un ulteriore MicroFrontend dedicato alla gestione e alla fruizione di videolezioni erogate dai docenti, ampliando così le funzionalità offerte dalla piattaforma.\n\n3) \"Affective Computing: Video-feature-extraction\" di Domenico Di Caprio\nAbstract:\nIl presente lavoro descrive la progettazione e lo sviluppo di una pipeline software per l'Affective Computing, orientata all'estrazione quantitativa e all'analisi automatizzata delle espressioni facciali a partire da flussi video grezzi. L'architettura si articola su un flusso sequenziale a quattro stadi che integra modelli di Deep Learning (RetinaFace, MobileFaceNet e XGBoost) ed ecosistemi open-sourcecome Py-Feat per eseguire Face Detection, Landmark Tracking e calcolo delle Action Units (AU) in conformità al Facial Action Coding System (FACS). L'elaborato approfondisce in particolare la fase di ingegneria del dato visivo e stabilizzazione del segnale, implementando tecniche di smoothing tramite medie mobili e meccanismi di memoria di stato per mitigare il rumore algoritmico e l'instabilità temporale dei micro-movimenti facciali. Il sistema elabora infine le dinamiche di attivazione per classificare sette emozioni discrete, restituendo i risultati in formati strutturati e interoperabili (JSONed Excel) pronti per analisi statistiche avanzate. Il lavoro evidenzia come questo approccio multi-task superi in accuratezza le tradizionali soluzioni di sola detection, offrendo una base sperimentale robusta e scalabile che apre la strada a futuri sviluppi nell'analisi comportamentale multimodale in tempo reale."
