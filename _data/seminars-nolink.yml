  title: '&#8220;Progettazione di un ambiente collaborativo cross-device: integrazione tra mondi virtuali e realtà aumentata&#8221; di Vincenzo Offertucci'
  speakers:
  - '9'
  description: "\nNegli ultimi anni, la realtà virtuale (VR) e la realtà aumentata (AR) hanno visto un rapido sviluppo, ampliando gli scenari applicativi e offrendo nuovi modi di interagire con il mondo digitale. Questo progetto mira a fornire strumenti per la creazione di ambienti in cui utenti VR, AR e desktop possano collaborare all'interno dello stesso spazio virtuale.\nDurante il seminario, esamineremo brevemente i sistemi già presenti in letteratura, analizzando le esigenze che questi hanno cercato di soddisfare. Successivamente, approfondiremo le tecnologie impiegate nel progetto, illustrandone l'integrazione nell'architettura del sistema. Il seminario includerà una dimostrazione pratica della piattaforma attualmente sviluppata e si concluderà con una discussione sui passi futuri per il miglioramento e l'espansione del progetto."
