  title: 'Seminario: &#8221; La comunicazione pubblica della scienza&#8221; di Giancarlo Sturloni'
  speakers:
  - '9'
  description: "Il seminario si propone di offrire ai partecipanti un’introduzione alla comunicazione della scienza, illustrando modelli teorici, obiettivi e pratiche di questa disciplina. Saranno discusse le problematiche della comunicazione scientifica a pubblici di non esperti e il ruolo dei mass media e dei social media. Verranno infine forniti ai partecipanti gli elementi basilari per pianificare una comunicazione in grado di informare e coinvolgere efficacemente differenti pubblici e stakeholder.\n\nBio : Giancarlo Sturloni è un comunicatore della scienza e svolge attività di formazione e consulenza in ambito scientifico, sanitario e ambientale. È laureato in Fisica dei biosistemi, ha conseguito un master in Comunicazione della scienza e un dottorato in Scienza e società. Organizza corsi di formazione rivolti a ricercatori e professionisti interessati a migliorare le proprie abilità di comunicazione. È specializzato in comunicazione del rischio, materia che insegna presso la Scuola Internazionale di Studi Superiori Avanzati (SISSA) di Trieste, l’Università di Udine e l’Università dell’Insubria. Di recente ha svolto attività di consulenza per la redazione delle linee guida sulla comunicazione del rischio alluvionale della Provincia di Trento, per la campagna sugli screening oncologici della Regione Friuli-Venezia Giulia e per la comunicazione del rischio sismico presso l’Università dell’Aquila. È attualmente responsabile della comunicazione di Greenpeace Italia. Ha collaborato come giornalista scientifico con diverse testate nazionali, tra cui Wired, Focus, L’Espresso, La Stampa e Il Tascabile. È autore di diversi saggi, tra cui La comunicazione del rischio per la salute e per l’ambiente (Mondadori Università, 2018), Il pianeta tossico (Piano B, 2014) e Le mele di Chernobyl sono buone. Mezzo secolo di rischio tecnologico (Sironi, 2006). Con Daniela Minerva ha curato il volume Di cosa parliamo quando parliamo di medicina (Codice, 2007)."
