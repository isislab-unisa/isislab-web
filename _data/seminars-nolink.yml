  title: '&#8220;Il Web e l&#8217;accesso ai dati personali: Solid&#8221; di Vittorio Scarano'
  speakers:
  - '9'
  description: "Il problema di chi possiede i nostri dati è sempre più sentito nel Web di oggi. Esaminiamo la proposta di Solid che proviene da Tim Berners Lee, presentandone i principi progettuali, esempi di uso e user stories, e sviluppi futuri.\n\nLe slides presentate al seminario sono disponibili qui ."
