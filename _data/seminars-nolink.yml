  title: 'Seminari: Presentazioni per la seduta di Laurea'
  speakers:
  - '9'
  description: "Attenzione : I seminari si svolgeranno con modalità telematica. A breve, seguiranno altre indicazioni per la videoconferenza.\n\nI laureandi presenteranno, in modalità telematica, un seminario finale del proprio lavoro di tesi Laurea:\n\n\" La Sicurezza delle Reti Grandi e Distribuite \" di Fabrizio Cocco\n\n\" L'uso della realtà aumentata per applicazioni collaborative \" di Vincenzo Mario Conte\n\n\" Studio dei pattern comportamentali dei visitatori di un museo e loro implementazione in Unity \" di Domenco Esposito\n\n\" Strumenti per i game developers: Generazione procedurale di contenuti \" di Gerardo Megaro\n\n\" About mood: How a negative mood in a videogame can influence our behavior \" di Simone Petrosino\n\n\" WMYSIR: gestione e monitoraggiodei materiali di scarto allo scopo di creare strumenti per la riduzionedei rifiuti \" di Diego Varriale"
  image: /assets/img/seminars/default.png
- date: 04/03/2020
