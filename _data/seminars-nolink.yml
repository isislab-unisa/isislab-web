  title: 'Seminario: &#8220;Classificazione e Profilazione Automatica di Knowledge Graph&#8221; di Mario Cosenza'
  speakers:
  - '9'
  description: "\nL’estrazione e la classificazione automatizzata di topic da Knowledge Graph rappresentano una sfida complessa a causa della natura eterogenea e distribuita di questi dati strutturati che descrivono entità reali e le loro relazioni. Viene illustrato un approccio che combina tecniche di machine learning tradizionale e modelli di linguaggio avanzati per generare profili dettagliati e interpretabili di Knowledge Graph. Durante il seminario saranno presentati i metodi di raccolta dati da fonti diverse, insieme ai processi di pulizia, filtraggio e classificazione basati su feature semantiche. Infine, verranno discussi i risultati ottenuti con diversi classificatori, analizzandone limiti e potenziali sviluppi futuri."
