  title: 'Seminario: VM Lab: un sistema per la gestione di connessioni a macchine virtuali di Alfredo Jeshoua Spera'
  speakers:
  - '9'
  description: "\nQuesta tesi descrive la progettazione e lo sviluppo di VM Lab, un sistema web-based per la gestione centralizzata delle connessioni SSH e SFTP a macchine virtuali. L'obiettivo è fornire una piattaforma sicura, modulare e multiutente, che superi le limitazioni degli strumenti tradizionali, spesso frammentati e privi di gestione strutturata degli accessi. La soluzione implementa un'interfaccia interattiva tramite Streamlit, supporta l'autenticazione con ruoli differenziati, e consente l'accesso remoto a terminali e file system direttamente via browser. L'architettura è composta da moduli separati per SSH, SFTP e gestione dei dati, integrati tramite API sicure. Particolare attenzione è stata posta alla sicurezza delle credenziali, alla gestione dei permessi e alla semplicità di deploy in ambienti containerizzati."
