  title: 'Seminario:&#8221;Orchestrazione di flussi dati distribuiti: analisi e implementazione di un sistema ETL resiliente basato su Apache Camel&#8221; di Valeria Argenziano'
  speakers:
  - '9'
  description: "Il presente lavoro affronta le problematiche legate all’integrazione di flussi dati ad alto volume nel settore finanziario e assicurativo. Il focus principale riguarda la progettazione di un sistema di elaborazione, trasformazione e caricamento (ETL) basato sull’impiego del framework Apache Camel. Attraverso l’analisi dell’architettura Flodex, viene esaminata l’adozione di pattern di integrazione volti a garantire L’affidabilità e consistenza dei dati in ambienti distribuiti. Lo studio dimostra come l’integrazione tra logiche asincrone e un’interfaccia utente dedicata permetta un’ottimizzazione dei processi operativi e una gestione resiliente dei fallimenti."
