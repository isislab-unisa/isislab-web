  title: 'Seminario: &#8220;The road to our KDD&#8217;25 paper &#8220;Hypergraph Motifs Representation Learning&#8221;Seminario: &#8220;&#8221; di Valerio Di Pasquale'
  speakers:
  - '9'
  description: "\nGli ipergrafi ampliano le capacità dei modelli basati sui grafi nella rappresentazione di reti complesse, consentendo di modellare in modo semplice ed efficace relazioni molti-a-molti.\nLo studio delle reti sociali si basa sull'identificazione e comprensione di specifiche caratteristiche strutturali, tra cui i motif (ad esempio, formazioni a stella, clique, ecc.). Analogamente ai grafi, i pattern strutturali locali negli ipergrafi, noti come higher-order motif (h-motif), giocano un ruolo chiave nelle dinamiche di rete e costituiscono i mattoni fondamentali delle reti complesse.\n\nNel nostro lavoro abbiamo definito formalmente il problema della previsione della formazione di particolari h-motif, analizzato lo stato dell’arte per affrontarlo e progettato una nuova architettura end-to-end basata sul deep learning per la loro previsione.\n\nIn questo seminario presenteremo brevemente i risultati del nostro articolo \"Hypergraph Motifs Representation Learning\", che sarà presentato alla 2025 ACM SIGKDD International Conference on Knowledge Discovery and Data Mining. Inoltre, esploreremo il percorso di revisione della conferenza e le sfide affrontate"
  image: /assets/img/seminars/50280-d0e1936e36.jpg
- date: 24/03/2025
