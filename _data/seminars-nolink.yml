  title: Generazione di Ipergrafi del Mondo Reale Mediante Modelli di Deep Learning di Valerio Di Pasquale
  speakers:
  - '9'
  description: "Abstract\nNegli ultimi anni, i modelli generativi hanno destato l'interesse del pubblico grazie alla crescente disponibilità di servizi web, che permettono di scrivere, disegnare e assemblare video in maniera automatica. Inoltre, le innovazioni tecnologiche relative alle tecnologie basate su Deep Learning hanno aperto le porte all'esplorazione del problema, applicato a strutture irregolari, quali grafi o ipergrafi. Durante questo seminario seminario: si descriverà problema della generazione di ipergrafi del mondo reale e si analizzeranno tre approcci, basati su algoritmi tradizionali, e un recentissimo approccio, basato su Deep Learning; infine, si valuterà una possibile variante di quest'ultimo, cogliendo l’opportunità di sfruttare il calcolo parallelo, con lo scopo di aumentarne le prestazioni."
