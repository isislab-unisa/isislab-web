  title: Introduction to Blogging with Jekyll di Tanveer Jan
  speakers:
  - '9'
  description: "\"Jekyll is a simple, extendable, static site generator. You give it text written in your favorite markup language and it churns through layouts to create a static website. Throughout that process, you can tweak how you want the site URLs to look, what data gets displayed in the layout, and more.\n\nIt's one of the favorite tools nowadays for all developers who wish to develop a blog or personal portfolio and that all with free hosting thanks to Github Pages along with several other benefits like SSL security and SEO, which is also taken care of for you by GitHub. In short, it's just a complete package to publish your personal portfolio or blog.\n\nI will be presenting a few slides on how the Jekyll works and what you need to build a cool portfolio/blog for yourself, and will also be giving a simple demo.\""
