  title: 'Seminari: 1. &#8220;CompanyAssistant&#8221; di Lorenzo Fasolino e Mario Egidio 2. &#8220;Sviluppo del supporto tramite IDE di FLY&#8221; di De Caro Antonio'
  speakers:
  - '9'
  description: "Web Page:\n\nLorenzo Fasolino\n\nMario Egidio\n\n\" CompanyAssistant \" di Lorenzo Fasolino, Mario Egidio\n\nAbstract : Il cloud computing è un modello per la distribuzione di servizi tramite Internet basato su un modello di costo in base all'utilizzo. Scalabilità, sicurezza, affidabilità e riduzione dei costi sono alcuni dei vantaggi che spingono verso l'adozione del cloud computing. Uno dei modelli di servizi offerti dal cloud computing è il modello Infrastructure as a Service(IaaS), nel quale il provider mette a disposizione una macchina virtuale che può essere utilizzata come una vera macchina fisica, senza la necessità di gestire l'infrastruttura hardware sottostante. Il modello IaaS può essere sfruttato per fornire macchine di calcolo a vari utenti senza la necessità di possedere l'infrastruttura fisica richiesta. Ciò risulta particolarmente vantaggioso nell'ambito dello smart working evitando che gli utenti di una organizzazione debbano possedere computer potenti per poter lavorare da casa. In questo seminario verrà presentato uno strumento che permette di sfruttare il modello IaaS in maniera ottimale, garantendo facilità di utilizzo e l'integrazione di molteplici cloud providers sfruttando il paradigma del multi-cloud.\n\n\" Sviluppo del supporto tramite IDE di FLY \" di De Caro Antonio\n\nAbstract: FLY è un Domain-Specific Language per il calcolo scientifico su multi-cloud con l'obiettivo di permettere all'utente di sfruttare le risorse del cloud computing in modo semplice ed efficiente. Uno dei principali obiettivi di FLY è la facilità d'uso soprattutto per utenti con poca esperienza nell'ambito della programmazione software. Uno strumento cruciale per garantire ciò è mettere a disposizione un ambiente di sviluppo che supporti lo sviluppatore durante l'implementazione di un applicazione FLY. L'obiettivo di questo seminario è presentare l'introduzione della componente di validazione all'interno del linguaggio FLY che consente di identificare e correggere immediatamente eventuali errori, o ancora, di fornire suggerimenti agli utenti durante lo sviluppo di un applicazione FLY.\n\nSeminarioISISLab-30-6-2021\n\nIl collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale # seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:\n\nISISLab Seminars in Discord"
