- date: 11/09/2025
  time: 12:00 - 13:00
  venue: ''
  title: 'Seminario: &#8220;KgSum: profilazione e classificazione automatica di Knowledge Graph&#8221;  di Mario Cosenza'
  speakers:
  - '9'
  description: "\nI Knowledge Graph (KG) permettono di rappresentare entità e relazioni in forma di grafo, facilitando l’organizzazione di dati complessi e collegati tra loro. La loro caratterizzazione manuale, però, è un processo oneroso e poco scalabile. In questo seminario presento KgSum, un progetto per automatizzare l’estrazione dei temi principali e la creazione di profili descrittivi di KG a partire da endpoint SPARQL e dump RDF. Il dataset è stato costruito raccogliendo Knowledge Graph da fonti come LOD Cloud, Zenodo e GitHub, ed estraendo da essi informazioni quali vocabolari, classi, proprietà ed etichette. Per la classificazione sono stati sperimentati sia algoritmi di machine learning tradizionali sia approcci più recenti, tra cui autoencoder e l’adattamento del modello Mistral 7B tramite QLoRA. L’applicazione, dotata di interfaccia web sviluppata in Next.js e distribuita con Docker, è stata valutata su dataset reali raggiungendo fino al 79% di accuratezza; nella presentazione verranno inoltre discusse le principali limitazioni e prospettive di sviluppo future."
