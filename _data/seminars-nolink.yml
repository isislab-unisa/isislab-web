  title: I processi ETL e la loro applicazione di Simone Civale
  speakers:
  - '9'
  description: "Il seminario tratta del lavoro di tirocinio da me svolto presso l’azienda EMM. Nel seminario si\nanalizzano i processi ETL con la loro definizione e i vari tool che permettono di realizzare i processi\nETL. Il seminario, inoltre, chiarisce il motivo per cui è stato scelto il tool Talend. Infine, viene\nesposto come si passa da Talend al microservizio e vengono definiti i microservizi stessi. L’ultimo\nargomento affronta JUnit e Docker."
