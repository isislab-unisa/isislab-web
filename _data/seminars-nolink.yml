  description: "Il Dipartimento di Informatica dell’Università di Salerno ospita il #Geckode26 Hackathon, dedicato allo sviluppo di soluzioni innovative nell’ambito della Realtà Estesa (XR), in collaborazione con @Youbiquo. 📍 Campus di Fisciano – Edificio F4\n\n🗓 16–17 aprile 2026\n\n🎯Focus NEOLAiA\n\nUna sezione dell’hackathon è dedicata allo sviluppo del metaverso NEOLAiA, nell’ambito dell’Alleanza Universitaria Europea. 👉 A partire da sfide progettuali concrete, i partecipanti saranno coinvolti nello sviluppo di ambienti virtuali e funzionalità collaborative. Opportunità Le migliori soluzioni potranno accedere a percorsi di valorizzazione, tra cui la pubblicazione nello store europeo delle applicazioni XR. 🔗 Iscrizioni https://www.youbiquo.eu/geckode/\n\n⏰ Scadenza: 12 aprile 2026\n\n#DInfUNISA #DipartimentodiInformatica #unisa #GeckodeUNISA26 #Geckode #NEOLAiA #XR #Hackathon @associazione_coscienze @associazione_libera_mente_ @ass1972.unisa"
