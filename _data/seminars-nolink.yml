  title: Seminari di Lucio Grimaldi  e Christian Gambadella
  speakers:
  - '9'
  description: "\" Simulazioni ABM in Unity3D: l’architettura del client e la gestione dei messaggi \" di Lucio Grimaldi\n\nAbstract : Il panorama delle simulazioni è in grado di dare un grande apporto allo studio dei fenomeni reali. I modelli computazionali studiati per simularli, sono in grado di aumentare la conoscenza che abbiamo del mondo che ci circonda. I software sviluppati ad hoc per questi obiettivi sono creati per riprodurre il fenomeno che deve essere modellato, osservato e analizzato con il fine di imparare qualcosa di nuovo. La natura articolata e complessa dei fenomeni e dei modelli, fa si che lo sforzo si è concentrato sempre sulla tecnica di implementazione, sull’ottimizzazione e raramente sulla loro rappresentazione grafica e sulla capacità che essi hanno di trasmettere le informazioni a chi non è un esperto del settore. Il progetto sviluppato è diviso in tre macro aree che corrispondono alla creazione di una metodologia di astrazione e prototipazione dei modelli di simulazione su motore di simulazione MASON per la prima parte, ad un middleware in grado di far comunicare MASON e il motore grafico Unity 3D sviluppato da me ed infine un’ultima parte riguardante l’implementazione grafica in Unity3D.\n\n2. \" Knowledge Graph e IoT: una revisione sistematica della letteratura \" di Christian Gambardella\n\nUn Knowledge Graph rappresenta una rete di entità del mondo reale, come oggetti, eventi, situazioni o concetti, e illustra le relazioni tra di esse. Queste informazioni vengono di solito immagazzinate, come suggerisce il nome, in una base di dati a grafo e poi visualizzate nella medesima forma. Questa tecnologia, annoverata tra le cosiddette Semantic Web Technology, continua a diffondersi a macchia d’olio, aumentando in numero (ad esempio il Google Knowledge Graph supera le 500 milioni di entità) ma anche e sopratutto nelle possibili applicazioni: proprio tenendo a mente questo ci siamo chiesti quale\nfosse lo stato dell’arte in ambito Internet of Things, perno fondamentale della quarta rivoluzione industriale e delle “città del futuro”. L’obiettivo della nostra ricerca, effettuata su 1733 articoli prelevati da Scopus e pubblicati in lingua inglese tra il 2013 e il 2022, è definire una fotografia quanto più\nampia e dettagliata del connubio tra i due mondi.\nScopo di questo breve seminario sarà riassumere le metodologie usate in fase di revisione ed illustrare i principali risultati del nostro lavoro."
  image: /assets/img/seminars/13214-cd8e3a82cf.png
- date: 10/03/2023
  time: 12:00 - 12:00
  venue: ''
  title: 'Seminario: &#8220;Asynchronous Computational Workflows on a Volunteer-Computing Decentralized Architecture&#8221; di Luigi Serra'
  speakers:
  - '9'
  description: "\nThe amount of accessible computational devices over the Internet offers an enormous but latent computational power. Nonetheless, the complexity of orchestrating and managing such devices\nrequires dedicated architectures and tools and hinders the exploitation of this vast processing capacity. Over the last years, the paradigm of (Browser-based) Volunteer Computing emerged as a unique approach to harnessing such computational capabilities, leveraging the idea of voluntarily offering resources. This seminar introduces VFuse, a groundbreaking architecture to exploit the Browser-based Volunteer Computing paradigm via a ready-to-access volunteer network. VFuse offers a modern multi-language programming environment for developing scientific workflows using WebAssembly technology without requiring the user any local installation or configuration. We equipped our architecture with a secure and transparent rewarding mechanism based on blockchain technology (Ethereum) and distributed P2P file system (IPFS). Further, the use of Non-Fungible Tokens provides a unique, secure, and transparent methodology for recognizing the\nusers’ participation in the network."
  image: /assets/img/seminars/13204-404e9bab5e.png
- date: 03/03/2023
  time: 16:00 - 17:00
  venue: ''
  title: 'Seminario: &#8220;The Impact of COVID-19 on Authoring Open Data in High School&#8221; di Maria Angela Pellegrino'
  speakers:
  - '9'
  description: "\"Open Data are data that can be freely used, created and shared by anyone. Initiatives to let K-12 learners exploit Open Data are rare in literature, and the situation is even worse if we look for opportunities to move them in the position of Open Data publishers. To advance the dialogue around Open Data, HETOR regularly organises workshops with secondary school learners to let them create, publish, and exploit Open Data by SPOD since 2016. While workshops were organised as physical meetings, during the COVID-19 pandemic, HETOR required to revise the performed protocol. This talk reports changes applied to the workshops proposed by HETOR and compares workshops' results before and after the COVID-19. While the quantity and quality of the workshops outcome increased during the workshops that took place after the COVID-19 pandemic demonstrating that Open Data based initiatives can successfully survive in remote settings, quality scores are more heterogeneous during after-COVID workshops demonstrating that remote settings make educational inequalities worse.\""
  image: /assets/img/seminars/13197-a2bbfd764a.png
- date: 24/02/2023
  time: 13:00 - 14:00
  venue: ''
  title: 'Seminario: &#8220;Cyber Threat Intelligence e Blockchain: studio, analisi e possibili sviluppi&#8221; di Antonio Donnarumma e Mario Offertucci'
  speakers:
  - '9'
  description: "\nCon il progredire dell'industria 4.0, l'utilizzo di dispositivi intelligenti è diventato sempre più frequente. Nonostante i numerosi vantaggi derivanti da essi, questi costituiscono, spesso, un nuovo vettore d'attacco per gruppi organizzati.\nNascono quindi le prime piattaforme di condivisione degli attacchi subiti, con lo scopo di creare un database distribuito che permette di sopperire alle vulnerabilità a cui si è esposti, in maniera tempestiva. STIX e TAXII sono due dei protocolli più utilizzati per formattare e distribuire le informazioni che fanno parte di quella che viene definita come Cyber Threat Intelligence (CTI). Tra le tecnologie emergenti in questo settore c'è la blockchain, che, grazie alla sua trasparenza, immutabilità e tracciabilità si presta bene alla realizzazione di questo tipo di applicazioni, semplificando ed automatizzando alcune delle operazioni necessarie alla gestione di queste piattaforme."
  image: /assets/img/seminars/13191-caa93d7f76.png
- date: 17/02/2023
  time: 13:00 - 14:00
  venue: ''
  title: 'Seminario: &#8220;Knowledge Graph e IoT: una revisione sistematica della letteratura&#8221; di Christian Gambardella'
  speakers:
  - '9'
  description: "\"Un Knowledge Graph rappresenta una rete di entità del mondo reale, come oggetti, eventi, situazioni o concetti, e illustra le relazioni tra di esse.\nQueste informazioni vengono di solito immagazzinate, come suggerisce il nome, in una base di dati a grafo e poi visualizzate nella medesima forma.\nQuesta tecnologia, annoverata tra le cosiddette Semantic Web Technology, continua a diffondersi a macchia d'olio, aumentando in numero (ad esempio\nil Google Knowledge Graph supera le 500 milioni di entità) ma anche e soprattutto nelle possibili applicazioni: proprio tenendo a mente questo ci siamo chiesti\nquale fosse lo stato dell'arte in ambito IoT, perno fondamentale della quarta rivoluzione industriale e delle \"città del futuro\"; da qui il motivo della nostra\nricerca effettuata su 1733 articoli prelevati da Scopus e pubblicati in lingua inglese tra il 2013 e il 2022.\nObiettivo di questo seminario sarà fornire una fotografia quanto più ampia e dettagliata del connubio tra i due mondi, analizzando trend di ricerca e tecnologie usate così da comprendere il presente di queste tecnologie e provare ad immaginarne il futuro.\""
