  description: "\nIl presente lavoro descrive la progettazione e lo sviluppo di una pipeline software per l'Affective Computing, orientata all'estrazione quantitativa e all'analisi automatizzata delle espressioni facciali a partire da flussi video grezzi. L'architettura si articola su un flusso sequenziale a quattro stadi che integra modelli di Deep Learning (RetinaFace, MobileFaceNet e XGBoost) ed ecosistemi open-source come Py-Feat per eseguire Face Detection, Landmark Tracking e calcolo delle Action Units (AU) in conformità al Facial Action Coding System (FACS). L'elaborato approfondisce in particolare la fase di ingegneria del dato visivo e stabilizzazione del segnale, implementando tecniche di smoothing tramite medie mobili e meccanismi di memoria di stato per mitigare il rumore algoritmico e l'instabilità temporale dei micro-movimenti facciali. Il sistema elabora infine le dinamiche di attivazione per classificare sette emozioni discrete, restituendo i risultati in formati strutturati e interoperabili (JSON ed Excel) pronti per analisi statistiche avanzate. Il lavoro evidenzia come questo approccio multi-task superi in accuratezza le tradizionali soluzioni di sola detection, offrendo una base sperimentale robusta e scalabile che apre la strada a futuri sviluppi nell'analisi comportamentale multimodale in tempo reale."
