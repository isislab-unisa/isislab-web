  description: "Abbiamo avuto accesso alla preview del nuovo tool GitHub Copilot e passeremo un'oretta a provarlo e testarlo. Chiunque è interessato può aggiungersi anche solo per dare un'occhiata!\n\nGitHub Copilot is an AI pair programmer that helps you write code faster and with less work. GitHub Copilot draws context from comments and code, and suggests individual lines and whole functions instantly. GitHub Copilot is powered by OpenAI Codex, a new AI system created by OpenAI. The GitHub Copilot technical preview is available as a Visual Studio Code extension. https://copilot.github.com/\n\nSeminarioISISLab-16-7-2021\n\nIl collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale # seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:\n\nISISLab Seminars in Discord"
