  title: Presentazioni dei lavori di tesi
  speakers:
  - '9'
  description: "I neolaureandi presenteranno il proprio lavoro di tesi:\n\n\" Generazione di Ipergrafi del Mondo Reale Mediante Modelli di Deep Learning \" di Valerio Di Pasquale \" Generazione di Ipergrafi del Mondo Reale Mediante Modelli di Deep Learning di Valerio Di Pasquale\n\n\" Valutazione di MPPCO (Medieval Philosophy works Publishing And Commenting Ontology) un'Ontologia basata su Screenia \" di Francesco Monzillo\n\n\" Dr. Bot: A chatbot for medical self-diagnosis \" di Lukasz Gajewski\n\n\" Sviluppo di un microservizio per la gestione delle performance di applicazioni cloud-native \" di Francesco Scala"
