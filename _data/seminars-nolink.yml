  title: 'Seminario: &#8220;Hypernegative: una libreria in Python per la valutazione di algoritmi di Hyperlink Prediction&#8221; di Giovanni Semioli'
  speakers:
  - '9'
  description: "\nGli ipergrafi modellano in modo naturale sistemi reali con relazioni di ordine superiore. Un problema centrale è l’Hyperlink Prediction (HLP): stimare collegamenti futuri tra insiemi di nodi. L’HLP è difficile: le relazioni di arità variabile ampliano lo spazio di ricerca, il forte sbilanciamento tra positivi e negativi distorce l’addestramento, e la scalabilità complica sia training sia valutazione. Il Negative Sampling (NS) è cruciale, ma scelte eterogenee rendono i risultati poco comparabili e spesso non riproducibili.\n\nIn questo seminario presentiamo Hypernegative, una libreria Python che fornisce un’interfaccia unificata per costruire pipeline di Machine Learning per HLP con NS. La libreria standardizza il flusso di lavoro, offre strategie di NS configurabili e protocolli di valutazione coerenti, migliorando riproducibilità e confronto tra metodi. Obiettivo: ridurre la varianza indotta dal NS, stabilizzare i benchmark e accelerare lo sviluppo di soluzioni HLP applicabili su ipergrafi reali e di grandi dimensioni."
