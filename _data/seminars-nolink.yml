  description: "L'epidemia di Covid-19 ha contribuito alla realizzazione di una vasta serie di studi sulla diffusione di epidemie e sulla modellazione di interventi non farmaceutici per limitare l'impatto di queste. In questo contesto, prendere in considerazione gli effetti causati da contatti indiretti possono avvenire tra persone che frequentano gli stessi luoghi si è rivelato fondamentale per modellare correttamente la diffusione non solo del Covid-19 stesso, ma di qualsiasi patogeno che infetti solo tramite contatti diretti. Tali informazioni possono essere formalmente modellate tramite ipergrafi temporali, che permettono di legare insieme persone in un determinato luogo in un tempo specifico. Obiettivo del mio lavoro di tesi è sperimentare tecniche di immunizzazione per tali strutture, sfruttando le informazioni derivanti da tali relazioni di alto ordine. In questo seminario, ci concentreremo sulla generazione di data set di mobilità sui quali sperimentare tramite un modello ad agenti le strategie definite\n\nIl collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale # seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:\n\nISISLab Seminars in Discord"
