  title: 'Seminario: &#8220;Make it faster : come scrivere codice parallelo e distribuito in linguaggio Julia&#8221; di Luigi Gallo'
  speakers:
  - '9'
  description: "\nLa programmazione distribuita/parallela ha rappresentato una vera e propria svolta nel mondo dell'informatica,permettendoci non solo di risparmiare tempo e soldi, ma anche di risolvere problemi più grandi e complessi, come la modellazione climatica, la gestione del rischio finanziario, e l'imaging medico (solo per nominare alcuni esempi).\nIn questo seminario, vi presenterò come sfruttare la potenza della computazione distribuita e parallela in Julia, un giovane linguaggio di programmazione nato principalmente per il calcolo scientifico. In particolare, mostrerò le peculiarità del linguaggio tramite l'ottimizzazione della libreria HGEpidemics.jl, un modulo Julia per simulare dinamiche epidemiche nel framework di simulazioni ad agenti. Ci soffermeremo su come sia possibile parallelizzare una simulazione e su come si possa distribuire l'esecuzione di diversi esperimenti in un cluster. Per entrambi i task, vedremo poi la validazione dei risultati per verificarne la corretta computazione e la valutazione, in termini di performance, delle ottimizzazioni effettuate.\n\nIl collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale # seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:"
