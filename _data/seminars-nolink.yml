  title: 'Seminario: &#8220;Let&#8217;s discover Knowledge Graphs&#8221; di Antonio Giulio'
  speakers:
  - '9'
  description: "Pagina web di Antonio Giulio\n\nSeminarioISISLab-14-10-2021\n\nAbstract: Negli ultimi anni abbiamo assistito ad una massiccia diffusione dei Linked Data che rispettano standard per la pubblicazione e la condivisione della conoscenza utili per realizzare l’idea del Semantic Web definita da Tim Berners Lee. Come qualsiasi altro tipo di informazione, i linked data soffrono dal punto di vista della qualità in termini di inconsistenza, inaccuratezza, out-of-dateness, e incompletezza. I problemi di qualità pongono serie limitazioni all'impiego dei dati. Uno dei punti critici, quando si parla di qualità, è la discoverability, ossia una metrica che ci indica quanto facilmente riusciamo a reperire un dato. Prodotti e servizi non possono essere utilizzati se gli utenti non riescono a trovarli o non capiscono a cosa servono. Il mio lavoro di tesi si propone di migliorare la discoverability dei Linked Open Data in modo tale da supportare e guidare gli utenti inesperti nel reperire questi knowledge graph. Per risolvere questo problema, ho progettato e implementato un motore di ricerca keyword-based per knowledge graph capace di interrogare sorgenti di dati eterogenee al fine di fornire un approccio standard di accessibilità. Il sistema proposto si presenta come una API utile all’interrogazione e all’integrazione di sorgenti dati e come web application come punto di accesso dei servizi offerti. Il collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale # seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:"
  image: /assets/img/seminars/default.png
- date: 07/10/2021
  time: 15:30 - 15:30
  venue: ''
  title: Seminari di Luigi Gallo e Simone Auriemma
  speakers:
  - '9'
  description: "SeminarioISISLab-7-10-2021 (1)\n\nSeminario \" Make it faster: come scrivere codice parallelo e distribuito in Julia \" di Luigi Gallo\n\nAbstract : \"Makeit faster: come scrivere codice parallelo e distribuito in Julia\" Abstract :La crescita esponenziale delle potenzialità di processing a livello hardware si è tradotta in svariati strumenti a livello software per sfruttarle al meglio. In questo contesto, scrivere codice parallelo e/o distribuito è diventato un must per poter non solo eseguire programmi in modo più efficiente, che può far risparmiare tempo e denaro investito (e.g., cloud), ma anche per poter risolvere problemi più complessi. In questo seminario, vi presenterò come poter sfruttare la potenza della computazione parallela e distribuita in Julia, un giovane linguaggio di programmazione nato per il calcolo scientifico, tramite due casi d'uso. Nello specifico, descriverò gli strumenti messi a disposizione dal linguaggio e le performance ottenute grazie alla loro applicazione.\n\nSeminario \" Excel Add-in for Knowledge Graph querying\" di Simone Auriemma\n\nAbstract : \"l Knowledge Graph (KG) modellano informazioni a forma di grafo. Nonostante il loro ampio utilizzo nei settori più disparati, il linguaggio considerato lo standard per interrogare i KG, SPARQL, risulta ostico per utenti senza competenze tecniche in linguaggi di interrogazione. Risulta cruciale progettare e implementare strumenti di interrogazione dei KG che permettano di utilizzare al meglio i KG senza richiedere specifiche competenze tecniche. In questo seminario descriverò come rendere i KG interrogabili e sfruttabili mediante uno degli strumenti di calcolo più famosi al mondo: Excel.\" Il collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale # seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:"
  image: /assets/img/seminars/default.png
- date: 23/09/2021
  time: 14:30 - 15:30
  venue: ''
  title: Seminari di  Luca Postiglione, Antonio Cirillo e Andrea Di Pierno
  speakers:
  - '9'
  description: "SeminarioISISLab-23-09-2021\n\nSeguono gli abstracts dei seminari:\n\n1) Seminario di Luca Postiglione\n\nTitolo : Model-Exploration in Rust-AB: Esplorazione dello spazio dei parametri di una simulazione\n\nAbstract : Le simulazioni di modelli basati su agenti permettono di studiare le dinamiche e i comportamenti di sistemi complessi. Il framework Rust-AB permette di implementare simulazioni sicure ed efficienti tramite il linguaggio di programmazione Rust. Per ottenere una simulazione efficace bisogna mettere a punto i suoi parametri. L’obiettivo di questo lavoro di tesi è integrare uno strumento di model-exploration all’interno di Rust-AB che permetta al modellista di effettuare in maniera semplice l’esplorazione dei parametri senza rinunciare alle prestazioni garantite dal framework. Per offrire uno strumento con funzionalità in grado di essere usate indipendentemente dal modello su cui si lavora, la model-exploration è stata implementata usando la meta-programmazione, una tecnica di programmazione con cui del codice produce altro codice.\n\n2) Seminario di Antonio Cirillo\n\nTitolo : Implementazione NoSQL in FLY\n\nAbstract : Il multi-cloud prevede l'utilizzo all'interno di una singola architettura di molteplici Cloud provider garantendo una maggiore affidabilità, un costo più vantaggioso e servizi più eterogenei. Tuttavia, utilizzare il multi-cloud è complesso in quanto ogni provider mette a disposizione strumenti anche molto diversi. Per questo motivo nasce FLY, un Domain-Specific-Language per il Calcolo Scientifico sul multi-cloud che ha l’obiettivo di semplificare lo sviluppo di applicazioni su multi-cloud. Qualsiasi tipo di applicazione necessita di lavorare con i dati e negli ultimi anni la mole di dati da gestire e la velocità con cui vengono prodotti è aumentata sempre di più. La nascita dei database NoSQL viene incontro a questo tipo di necessità fornendo schemi flessibili per la memorizzazione dei dati e alta scalabilità. Le caratteristiche dei database NoSQL li rendono particolarmente adatti al Cloud Computing, e per questo motivo è risultato necessario implementare un supporto per i database NoSQL all’interno di FLY.\n\n3) Seminario di Andrea Di Pierno\n\nTitolo : Implementazione di algoritmi genetici in linguaggio FLY\n\nAbstract: Il Cloud Computing è considerato fondamentale per la creazione di infrastrutture di calcolo grazie alle risorse messe a disposizione sotto forma di servizi. L’alto numero di Cloud Provider presenti sul mercato ha dato origine al paradigma del multi-cloud, che prevede l’integrazione all’interno della stessa architettura di più ambienti Cloud garantendo vantaggi in termini di dipendenza dal provider e flessibilità. L’introduzione del multi-cloud aumenta però la complessità di utilizzo creando la necessità di strumenti che facilitino il suo impiego. FLY è un Domain-Specific Language per il calcolo scientifico su multi-cloud che ha come obiettivo la semplificazione dello sviluppo di applicazioni che sfruttino tale paradigma. Per semplificare l'adozione del linguaggio FLY a nuovi sviluppatori è necessario che vengano messi a disposizione degli esempi concreti di applicazioni reali. Questo lavoro di tesi ha come obiettivo l’implementazione di una serie di algoritmi genetici scritti in FLY. Gli algoritmi genetici sono utilizzati per la risoluzione di problemi di ottimizzazione. Tali algoritmi risultano semplici da comprendere nel concetto ma non banali da implementare. Per questo motivo, fornire degli esempi di programmi FLY che impiegano algoritmi genetici consente di dimostrare le funzionalità e le potenzialità del linguaggio oltre a risultare un buon punto di partenza per gli utenti che si approcciano a FLY per la prima volta.\n\nAbstract : Il Cloud Computing è considerato fondamentale per la creazione di infrastrutture di calcolo grazie alle risorse messe a disposizione sotto forma di servizi. L’alto numero di Cloud Provider presenti sul mercato ha dato origine al paradigma del multi-cloud, che prevede l’integrazione all’interno della stessa architettura di più ambienti Cloud. I vantaggi che fornisce comprendono la possibilità di ridurre la dipendenza dal singolo provider, avere una maggiore scelta di servizi e tolleranza ai guasti. L’eterogeneità del mercato, tuttavia, implica forti differenze anche negli strumenti di accesso dei vari provider per usufruire dei loro servizi. Ciò rende l’utilizzo del multi-cloud un processo complesso per i meno esperti, creando la necessità di strumenti che facilitino il suo impiego. FLY è un Domain-Specific Language per il calcolo scientifico su multi-cloud che ha come obiettivo la semplificazione dello sviluppo di applicazioni che sfruttino tale paradigma. Il linguaggio FLY mette a disposizione una serie di costrutti che astraggono all’utente l’interazione con il provider, permettendogli di utilizzare servizi di diversi ambienti Cloud senza dover conoscere librerie e strumenti proprietari. Essendo FLY ancora in fase di sviluppo, i programmi di esempio scritti in FLY sono ancora pochi e poco complessi, rendendo necessaria l’introduzione di nuovi che fungano da guida ai nuovi sviluppatori. Questo lavoro di tesi ha come obiettivo l’implementazione di una serie di algoritmi genetici scritti in FLY, presentandone la progettazione e lo sviluppo. Gli algoritmi genetici sono algoritmi ispirati ai processi biochimici descritti nella Teoria dell’Evoluzione di Charles Darwin, per la risoluzione di problemi di ottimizzazione per cui non esistono soluzioni di complessità polinomiale o che sono particolarmente esosi in termini di risorse. Il successo degli algoritmi genetici deriva dalla loro relativa semplicità concettuale, pur essendo non banali da implementare. Per questo motivo, fornire degli esempi di programmi FLY che impiegano algoritmi genetici consente di dimostrare le funzionalità e le potenzialità del linguaggio oltre a risultare un buon punto di partenza per gli utenti che si approcciano a FLY per 