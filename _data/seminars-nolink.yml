  speakers:
  - '9'
  description: "Pagina web di Gaetano Casillo\n\nAbstract : Quante volte avete sprecato più energia per trovare un dataset di mobilità su kaggle più che a lavorarci sopra? Quante volte siete rimasti delusi perché vi sembrava di aver trovato il dataset che dalla descrizione sembrava perfetto, ma aprendolo avete notato che era troppo piccolo o impreciso? Il mio seminario tratterà di dataset sintetici sulla mobilità: cosa sono, pro e contro di usare un dataset sintentico. Parleremo di come si crea un dataset sintetico di mobilità e delle scelte che ho fatto per trovare il modello che, secondo me, più rappresenta la realtà cittadina.\n\nIl seminario si svolgerà in modalità telematica sul canale vocale #seminars di Discord .\n\nIl collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale # seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:\n\nISISLab Seminars in Discord"
