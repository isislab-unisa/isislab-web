  title: 'Seminario: &#8220;Estensione delle primitive di Kubernetes tramite Operator Pattern: Sviluppo di un controller custom e dashboard di gestione integrata&#8221; di Gianluigi Romano'
  speakers:
  - '9'
  description: "\nLa crescente adozione di Kubernetes come standard de facto per l'orchestrazione dei container ha introdotto una significativa complessità operativa, caratterizzata dalla gestione manuale di risorse eterogenee e dalla difficoltà di garantire portabilità tra infrastrutture diverse. In questo contesto, l'Operator Pattern rappresenta uno strumento fondamentale per codificare la conoscenza operativa in software, estendendo le primitive del cluster per automatizzare il ciclo di vita delle applicazioni e superare la rigidità delle configurazioni statiche.\nQuesta tesi presenta la progettazione e lo sviluppo di \"SimpleApp Operator\", un controller nativo implementato in linguaggio Go tramite il framework Kubebuilder.\nLa metodologia adottata sfrutta una logica di controllo Level-Triggered, che abilita meccanismi avanzati di Self-Healing e idempontenza: il sistema monitora costantemente lo stato del cluster, rilevando e correggendo autonomamente le discrepanze rispetto allo stato desiderato (Desired State), garantendo così resilienza e continuità operativa.\nL'architettura proposta affronta in modo specifico la sfida dell'interoperabilità del networking. Attraverso un approccio modulare basato su Kustomize e sul pattern Base+Variants, il sistema inietta configurazioni dinamiche che rendono l'Operator Infrastructure-Agnostic, assicurando il supporto nativo e trasparente per diversi Ingress Controller senza modifiche al codice sorgente. Il lavoro è completato dall'integrazione di una Dashboard Web che astrae la complessità dei manifest YAML, offrendo un'interfaccia di gestione intuitiva e validando un modello di orchestrazione pienamente dichiarativo e portabile."
