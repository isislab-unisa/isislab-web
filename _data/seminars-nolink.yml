  speakers:
  - '9'
  description: "Website di Andrea Di Pierno\n\nAbstract: FLY è un Domain-Specific Language per il calcolo scientifico su multi-cloud che ha l'obiettivo di semplificare lo sviluppo di applicazioni astraendo l’utente dall’interazione con il Cloud. Uno dei principali ambiti trattati dal calcolo scientifico sono i problemi di ottimizzazione che vengono principalmente affrontati utilizzando algoritmi genetici. Lo scopo di questo seminario è di dimostrare l'usabilità e l'efficienza di FLY tramite un caso d'uso reale, mostrando nel dettaglio le fasi di progettazione e di implementazione di un algoritmo genetico in FLY.\n\nIl collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale # seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:\n\nISISLab Seminars in Discord"
