  title: 'Seminario: &#8220;Simulazione Agent-Based in ambiente di ristorazione con simulazione di contagio&#8221; di Andrea Amorosini'
  speakers:
  - '9'
  description: "Abstract di Andrea Amorosini : \"Al giorno d’oggi, come ben tutti abbiamo potuto constatare negli ultimi due anni, il Covid-19 è ancora una grossa preoccupazione per il mondo. Gli ambienti commerciali al chiuso devono sottostare a svariate normative per assicurare la sicurezza dei propri clienti, ma nonostante tutto svariate persone ancora non sono a conoscenza della gravità della situazione corrente. Lo scopo di questa simulazione è mostrare l'andamento del contagio all'interno di un luogo chiuso che possa risultare familiare alla maggioranza, come per l'appunto un ristorante.\"\n\nIl collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale # seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:"
