  title: Seminari di Roberto Cito e Anna Chiara Esposito
  speakers:
  - '9'
  description: "1) \"Benchmarking Small Language Models for Edge-Based Robotic Control on Raspberry Pi\" di Roberto Cito\n\nAbstract:\nQuesto seminario presenta uno studio sull'impiego di Small Language Model (SLM) per il controllo di piattaforme robotiche in scenari di edge computing. L'obiettivo è valutare la possibilità di eseguire modelli di piccole dimensioni direttamente su hardware a basso costo, utilizzando un Raspberry Pi 5, riducendo la dipendenza da servizi cloud e i tempi di risposta associati.\n\nPer favorire un utilizzo efficiente delle risorse computazionali, è stato sviluppato un linguaggio di comando compatto basato su coppie carattere-valore, che consente al modello di rappresentare sequenze di azioni mediante output di dimensioni ridotte. Le stringhe generate vengono successivamente interpretate e validate da un modulo di parsing prima di essere inviate alla piattaforma robotica per l'esecuzione.\n\nIl seminario illustrerà l'architettura del sistema, le principali scelte progettuali e lo stato di avanzamento del lavoro. In particolare, saranno presentate le attività di benchmarking dei diversi modelli, sia in termini di prestazioni su dispositivo sia attraverso una valutazione qualitativa delle risposte generate, basata su prompt forniti da un gruppo eterogeneo di utenti. Il confronto tra le valutazioni di 10 utenti rappresenta uno degli strumenti adottati per analizzare accuratezza e robustezza del sistema nell'interazione con persone reali.\n\n2) \"Monitoring Chatbot: Infrastructure as Code e GitOps per il Deployment di una Piattaforma Agentica Cloud-Native in Ambienti Enterprise\" di Anna Chiara Esposito\n\nAbstract: Questo lavoro descrive gli aspetti infrastrutturali e DevOps di Monitoring Chatbot, una piattaforma cloud-native a microservizi orientata al troubleshooting, monitoring e gestione operativa in contesti IT complessi. L’architettura adotta Kubernetes come orchestratore e integra connettori disaccoppiati per l’estensione a nuove sorgenti dati, pipeline di ingestion distribuite su Apache Kafka e un layer RAG per la knowledge integration. L’elaborato approfondisce in particolare l’adozione di Infrastructure as Code con Terraform e paradigmi GitOps per automatizzare provisioning, deployment e observability, garantendo riproducibilità e tracciabilità dell’intera infrastruttura. Il sistema è progettato per supportare deployment sia cloud sia on-premise, assicurando cloud agnosticism e data sovereignty. Il lavoro evidenzia come l’integrazione di architetture cloud-native, IaC e modelli agentici basati su LangChain possa abilitare piattaforme AI enterprise scalabili, osservabili e indipendenti dal provider infrastrutturale."
  image: /assets/img/seminars/51179-aa1710a61b.png
