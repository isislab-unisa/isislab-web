  title: 'Hyperlinking Object-Oriented Discussion: A New Approach To Collaboration di Tiziano Citro'
  speakers:
  - '9'
  description: "\nModern collaboration platforms have familiarized users with the benefits and capabilities of real-time communication. However, real-time communication can also introduce challenges in the form of a lack of context and limited control over discussed data. To address these issues, this work proposes a new collaborative approach called Hyperlinking Object-Oriented Discussion (HOOD), where discussed data is modeled with hyperlinkable objects. HOOD aims to balance the importance of communication and data by providing an intuitive way to seamlessly navigate between them via auto-generated hyperlinks, enabling users to easily access and reference the relevant information at any time."
