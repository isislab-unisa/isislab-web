  title: 'Seminario: &#8220;Trace Me Now: an open-source framework for indoor localization and tracking&#8221; di Mauro Borrazzo'
  speakers:
  - '9'
  description: "Il seminario è relativo al lavoro di tesi Trace Me Now in vista della seduta di laurea. Trace Me Now è un framework open-source che ha come obiettivo quello di facilitare lo sviluppo di sistemi di localizzazione e tracciamento indoor. La localizzazione indoor è tutt'ora una sfida aperta, in quanto diverse tecnologie, tecniche e approcci sono presenti nella letteratura recente, senza però portare ad un unico standard per attuare la localizzazione indoor. Trace Me Now vuole unificare, con un unico framework, lo sviluppo di applicazioni di tracciamento indoor, non solo fornendo tecniche e tecnologie, ma anche supportando i programmatori nello sviluppo vero è proprio. Verranno quindi introdotte le motivazioni che hanno portato alla realizzazione di questo strumento, gli obiettivi proposti e quelli raggiunti, così come le sfide aperte e gli sviluppi futuri.\n\nIl collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale # seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:\n\nISISLab Seminars in Discord"
