  description: "Studio inerente al Geographic information System(GIS), un sistema che integra operazioni DBMS ad operazioni cartografiche, mediante l'utilizzo di sistemi di disegno computerizzato, permettendo l'analisi completa di un'entità geografica. Verrà analizzato un plugin sviluppato in Rust, con analisi di alcune problematiche, e la sua potenziale integrazione con l'engine krABMaga"
