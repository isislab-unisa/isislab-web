  title: 'Seminario: &#8220;Offloading computation to the edge&#8221; di Vittorio Scarano'
  speakers:
  - '9'
  description: "\n\nAll'aumentare della complessità delle applicazioni, il Cloud offre un ecosistema naturale dove una applicazione complessa può crescere e scalare. Con le applicazioni cloud basate su terminali mobili (Mobile Cloud Computing) questo pone dei problemi per la latenza e la bassa qualità del servizio percepita dall'utente. La tecnica di spostare la computazione sull'Edge della rete, vicino agli utenti, è la strada principale per mantenere i vantaggi del Cloud e preservare la qualità percepita. In questo seminario presentiamo una review dell'architettura e delle soluzioni presenti in letteratura.\n\nLe slides del seminario:\n\nOffloading Computation to the Edge from Vittorio Scarano\n\nIl collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale # seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:\n\nISISLab Seminars in Discord"
