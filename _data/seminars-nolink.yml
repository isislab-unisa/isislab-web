  title: 'Seminar: &#8220;Denoising Diffusion for Hypergraph Generation&#8221; by Valerio Di Pasquale'
  speakers:
  - '9'
  description: "\nHypergraphs make it possible to model higher-order relationships that standard graphs are unable to express. However, producing realistic hypergraphs is still difficult, since current approaches often depend on predefined structural constraints or fail to capture the intertwined dependencies between nodes and hyperedges. We present Janus, a latent diffusion-based framework that partitions an observed hypergraph into sub-hypergraphs, learns joint latent representations of nodes and hyperedges using a dual-view β-VAE, and synthesizes new hypergraph structures through paired latent diffusion guided by cross-view conditioning. The framework can perform both unconstrained generation and generation conditioned on a given node set. We further propose an evaluation protocol that assesses interactions at micro, meso, and macro levels, together with structural reconstruction and higher-order similarity metrics. Experiments on five real-world datasets against nine baselines show that Janus delivers the most consistent performance across structural scales, achieving notable improvements in meso-scale and higher-order fidelity. Under node-set constraints, it also consistently attains the strongest reconstruction performance."
