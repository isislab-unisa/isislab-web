  title: 'Seminario in ISISLab:  &#8220;A Web Analysis Tool for an Hypergraphs Repository: https://hypergraph-repository.github.io&#8221; di Muhammad Tanveer Jan'
  speakers:
  - '9'
  description: "\"A Web Analysis Tool for an Hypergraphs Repository: hypergraph-repository.github.io\" di Muhammad Tanveer Jan\n\nAbstract : Web application developed in jekyll to collect and analyze hypergrpahs in a responsive way. Multiple libraries are used to develop the site and make is responsive which can be viewed on any device desktop or mobile. This seminar will gave you a broad idea on how you can make use of jeykll to develop cool and amazing web application. It will also gave you exposure into several other libraries like ChartJS, Grid Flexbox v2, Material Design Bootstrap, datatables, fontAwsome Icons and MichealSnik Animation library."
