  speakers:
  - '9'
  description: "Il seminario : \" Introducing healthy/infected environments in propagation model diseases, exploiting time-varying hypergraph \" di Vittorio Scarano, Gennaro Cordasco, Carmine Spagnuolo, Alessia Antelmi , sarà presentato da Carmine Spagnuolo nella Terza Edizione \" Big Data in Health, BDH2019 “ dal 2 al 4 ottobre presso il Centro Nazionale delle Ricerche in Via dei Marrucini (Roma).\n\nIl programma dettagliato disponibile qui .\n\nBig Data in Health,\nI dati a servizio della salute Download"
