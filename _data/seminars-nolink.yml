  title: 'Seminario: &#8220;Migliorando Knoxly, un tool per privacy awareness nella divulgazione di dati sensibili e personali&#8221; di Francesco Vicidomini'
  speakers:
  - '9'
  description: "\n\nI\ncittadini sono ogni giorno esposti a una serie di minacce online, in\nparticolare per quanto riguarda la privacy e la sicurezza.\n\nI\nsiti Web e le applicazioni fanno uso sempre più spesso e sempre più largamente\ndi servizi forniti per tracciare gli utenti e offrire esperienze\npersonalizzate.\n\nTuttavia,\nquesta pratica minaccia la privacy delle persone attraverso l'uso di\ninformazioni sensibili atte a \"ricreare\" un profilo personale\ndigitale.\n\nI\nmeccanismi convenzionali di protezione della privacy si concentrano\nprincipalmente\n\nsulla\nprotezione delle identità o degli \"attributi privati\" degli\nindividui. Ma i cittadini sono minacciati anche dai contenuti sensibili o\ninappropriati che loro stessi, inconsapevolmente o involontariamente, divulgano\ndurante l'utilizzo dei social o altri servizi (es. e-mail).\n\nKnoxly\nè un plug-in per Google Chrome che ha come obiettivo l'enhancement della\nprivacy awareness negli utenti, spostando quindi il concetto di privacy verso \"privacy\nas having the ability to control the dissemination of sensitive\ninformation\" .\n\nIn\nuna prima versione, Knoxly fa affidamento sulle regular expression per\nidentificare dati sensibili o personali all'interno dei messaggi di testo che\nl'utente sta per condividere online.\n\nIn\nquesto seminario parleremo nel dettaglio del problema della privacy leakage, di\ncome altri lavori in letteratura si siano avvicinati allo stesso tema, di come\nsuperare i limiti delle regular expression creando moduli semantici tracciando\ncosì la linea per gli sviluppi prossimi del plug-in Knoxly.\n\n\""
  image: /assets/img/seminars/default.png
- date: 03/04/2020
  time: 15:00 - 16:00
  venue: ''
  title: 'Seminario: &#8220;Nuovi rischi per la privacy su dispositivi mobile&#8221; di Antonio Junior Citarella'
  speakers:
  - '9'
  description: "\nGrazie alla popolarità sempre crescente di smartphone di ultima generazione e di app mobile sempre più interessanti ed utili per ogni aspetto della nostra vita quotidiana, la profilazione atta a monitorare le nostre azioni diventa sempre più importante (e redditizia) per le compagnie pubblicitarie, interessate a fornire contenuti sempre più ritagliati sulle nostre necessità.\n\nRecentemente, un ulteriore minaccia per la nostra privacy è rappresentata dalla possibile “intercettazione” delle nostre conversazioni, realizzata ad esempio attraverso il monitoring del microfono dei cellulari. Varie fonti danno per concreta questa minaccia, i grandi dell’ecosistema IT negano. In questo lavoro di tesi, si tenterà di verificare, attraverso uno studio sperimentale, se i sensori degli smartphone possono essere controllati, ed in che modo le nostre conversazioni monitorate e utilizzate per realizzare quello che può essere definito come behavioral advertising avanzato."
  image: /assets/img/seminars/default.png
- date: 27/03/2020
  time: 03:00 - 04:00
  venue: ''
  title: 'Seminario: &#8220;Generalizzazione di quasi-identifier negli Open Data. Approccio locale operando sui singleton &#8221; di Matteo Pastore'
  speakers:
  - '9'
  description: "Il seminario si svolgerà in modalità telematica.\n\nAbstract : \" Il governo è spronato a pubblicare Open Data per garantire trasparenza, ma deve assicurarsi che la privacy degli individui non venga compromessa. Analizzando open dataset contenenti informazioni relative alle patenti e pubblicati dal governo italiano, il ben noto quasi-identifier (data di nascita, sesso, comune di residenza) espone fino al 2% di singleton, cioè tuple univocamente determinate, in dataset già anonimizzati. Per proteggere ulteriormente questi dataset, ho analizzato quale attributo (o combinazione di attributi) deve essere generalizzato per raggiungere il minor numero di singleton, minimizzando il numero di righe modificate e / o rimosse. I test effettuati dimostrano che generalizzando solo le righe corrispondenti ai singleton, si ottengono quasi 0 singleton modificando solo il 2% di righe.\""
