  description: "In questo seminario approfondiremo i principali modelli numerici meteorologici utilizzati per la previsione del tempo, con un focus particolare sul modello WRF. Verrà presentata una simulazione di previsione relativa al Golfo di Salerno, realizzata utilizzando il modello WRF.\nL'obiettivo è sviluppare una piattaforma cloud-native che consenta di ottenere previsioni meteorologiche per aree geografiche specifiche e per orari definiti, offrendo inoltre una visualizzazione interattiva dei risultati."
