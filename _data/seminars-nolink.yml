  title: 'Seminario: &#8220;Optimizing Data Communication on Large-Scale GPU Cluster&#8221; di Francesco De Simone'
  speakers:
  - '9'
  description: "\"Recent years have witnessed an increasing growth in the usage of GPUs in large-scale compute clusters. GPU clusters can reach a high computational power, but their performance is limited by data communication: host CPU-to-GPU communication, as well as inter-node data movement. In this presentation, I will show how those bottlenecks are relevant in the Marconi100 cluster at CINECA, and how we can improve scalability by minimizing the data communication through better data partitioning.\"\n\nIl collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale # seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:\n\nISISLab Seminars in Discord"
