  speakers:
  - '9'
  description: "La creazione di app mobile compatibili con più piattaforme è un compito noioso e pone sfide importanti davanti a uno sviluppatore in quanto deve avere le conoscenze specifiche di due o più piattaforme native. Esistono alcuni framework per facilitare questo compito ma pongono delle limitazioni. React Native è un framework che permette di costruire applicazioni per iOS ed Android utilizzando i componenti che realmente vengono messi a disposizione da essi ma usando JavaScript e React per posizionarli e per definire la logica. In questo seminario condividerò le mie conoscenze su questo framework.\n\nIl seminario si svolgerà in modalità telematica sul canale vocale #seminars di Discord .\n\nIl collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale # seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:\n\nISISLab Seminars in Discord"
