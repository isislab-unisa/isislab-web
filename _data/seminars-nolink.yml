  title: 'Seminario: &#8220;FLY Graph API&#8221; di Simone Bisogno'
  speakers:
  - '9'
  description: "\"FLY è un linguaggio domain specific (DSL) per il calcolo scientifico in ambiente multi-cloud basato sui linguaggi Java per l'esecuzione in ambiente locale e su Python e JavaScript per l'esecuzione sugli ambienti cloud più noti come AWS di Amazon, Azure di Microsoft e GCP di Google. L'integrazione dell'ADT grafo è stata realizzata integrando librerie preesistenti già affermate nei su citati linguaggi (JGraphT per Java e NetworkX per Python) definendo un'interfaccia pubblica comune da utilizzare in FLY in maniera trasparente in ambiente locale o remoto.\n\nIn questo seminario illustrerò come ho realizzato l'implementazione dell'ADT grafo in FLY definendo delle classi basate su librerie di manipolazione di grafi preesistenti che definiscono un'API comune per la creazione e manipolazione di grafi in FLY.\""
  image: /assets/img/seminars/10735-e2a9ca1ad6.png
- date: 22/05/2020
  time: 16:00 - 17:00
  venue: ''
  title: 'Seminario: &#8220;Parallel Heterogenous Programming at Scale&#8221; di Biagio Cosenza'
  speakers:
  - '9'
  description: "\"The pursuit of high performance and energy efficiency led to the emergence of heterogeneous computing, where different parts of an application benefit from specialized hardware better suited for the problem. Hardware accelerators such as GPUs, FPGAs, and many-core CPUs are used as co-processors resulting in heterogeneous architectures.\n\nThis talk introduces SYCL, a royalty-free open standard published by the Khronos Group intended for programming a wide range of heterogeneous architectures. Its high-level single-source programming model combines the portability of OpenCL with modern C++ constructs and idioms. In SYCL, scheduling, data management, and synchronization are handled implicitly by the SYCL runtime, increasing programmer productivity.\n\nThis talk will also present the Celerity programming environment, which builds on the top of SYCL and allow C++ applications to target cluster of accelerators. By having users provide minimal information about how data is accessed within compute kernels, Celerity automatically distributes work and data. The Celerity prototype runtime implementation is shown to have comparable performance to more traditional approaches to distributed memory accelerator programming, such as MPI+OpenCL, with significantly lower implementation overhead.\""
  image: /assets/img/seminars/10682-6365f7f569.png
- date: 21/05/2020
