  title: Presentazioni dei lavori di tesi di A. Ambrosio, G. Forlenza e G. Gurrali
  speakers:
  - '9'
  description: "I nostri laureandi terranno brevi presentazioni del loro lavoro di tesi in occasione della prossima seduta di laurea.\n\n\" Studio ed analisi del modello entity component system per la realizzazione di simulazioni basate su agenti\" di Antonio Ambrosio\n\nAbstract : Le simulazioni basate su agenti vengono utilizzate per studiare fenomeni reali in diversi ambiti. Tuttavia le simulazioni si traducono spesso in problemi difficili da trattare dal punto di vista computazionale. Al crescere della taglia, i tempi della simulazione e le risorse hardware necessarie aumentano proporzionalmente.\nPer questo ed altri motivi ‘e necessario lo sviluppo di framework che consentano di effettuare le simulazioni in maniera efficiente. La seguente tesi esplora la possibilit‘a di impiegare il calcolo parallelo e l’utilizzo dell’architettura EntityComponent-System all’interno di krABMaga, una libreria efficiente per modelli basati su agenti, sviluppata con il linguaggio di programmazione Rust.\n\n\" Sviluppo di una libreria per la manipolazione di Ipergrafi: Integrazione di un backend in Rust con un’interfaccia in Python\" di Giovanni Forlenza\n\nAbstract : L’obiettivo di questa tesi è analizzare e implementare una libreria per la gestione degli ipergrafi, con un backend in Rust e un’interfaccia in Python. La scelta di combinare questi due linguaggi nasce dalla necessità di ottenere alte prestazioni nell’esecuzione di operazioni complesse sugli ipergrafi, sfruttando la velocità di Rust e la versatilità di Python per l’interfaccia utente. L’implementazione ha incluso lo sviluppo di funzionalità avanzate per la manipolazione degli ipergrafi, tra cui algoritmi di gestione dei nodi, degli archi e calcoli di centralità con un’attenzione specifica all’architettura e al flusso di dati tra i due linguaggi.\nA seguito dell’implementazione, sono stati condotti test di performance per confrontare la libreria RustHypergraph con la libreria HypergraphX in Python. I risultati hanno mostrato che, sebbene le prestazioni siano simili per le operazioni più semplici, la libreria RustHypergraph ha un vantaggio significativo con l’aumentare delle dimensioni dell’ipergrafo e nelle funzioni che implementano algoritmi complessi.\n\n\" Gestione sismica intelligente: Monitoraggio e manutenzione predittiva\" di Giovanni Gurrali\n\nAbstract : Realizzazione di un sistema intelligente di gestione sismica per il monitoraggio strutturale in tempo reale. Utilizzando una rete di sensori IoT (Raspberry Pi Zero 2 W, accelerometro, GPS ed un modulo camera) e servizi Cloud AWS (Amazon IoT Core, DynamoDB, Amplify, S3), il progetto mira a raccogliere e analizzare dati relativi a vibrazioni, deformazioni e crepe negli edifici. Partendo da una fase iniziale di studio della sensoristica e delle soluzioni già esistenti sono stati implementati moduli di acquisizione dati e un'applicazione web in Next.js per visualizzare ed interrogare le informazioni raccolte."
