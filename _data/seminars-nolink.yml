  title: Seminari di Giuseppe d&#8217; Ambrosio e Domenico Esposito
  speakers:
  - '9'
  description: "\"SailWatcher, un tool dinamico per l'analisi delle prestazioni delle vele di un'imbarcazione\" di Domenico Esposito\n\nAbstract\n\nSeminario breve su \"SailWatcher\": tool per smartphone, che senza l'ausilio di sensori esterni, permette in maniera automatica di recuperare i parametri sulle forme delle vele delle imbarcazioni. Durante il seminario verranno presentate le caratteristiche dell'algoritmo di computer vision progettato, per la fase di detect e calcolo parametri, e dell'applicazione iOS che lo utilizza.\n\n2 . Hybrid Agent-Based and Discrete Event Simulation in MASON di Giuseppe D'Ambrosio\n\nAbstract\nRecently, modelers have started combining Agent-Based Modeling and Discrete Event Simulation approaches to better simulate real-world situations. However, hybrid ABM and DES simulation has a lack of supporting software, especially open source. This seminar introduces a new DES extension to MASON to implement both DES and hybrid ABM-DES models. The goal of the system is to help researchers realize hybrid simulations while exploiting the same characteristics that led to MASON’s success, notably its efficiency, extensibility, and ease of integration with other tools."
