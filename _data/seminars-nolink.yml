  title: 'Seminario: &#8220;DICEGAME: un’esperienza di apprendimento in realtà aumentata attraverso un gioco multiutente per il patrimonio culturale&#8221; di Alessandro Basso'
  speakers:
  - '9'
  description: "Questa tesi descrive la progettazione e lo sviluppo di un gioco multiutente in realtà aumentata per dispositivi mobili. L’applicazione permette a più utenti di condividere lo stesso spazio di gioco virtuale, ancorato all’ambiente reale, e di interagire tra loro attraverso meccaniche di gioco a turni. Il lavoro analizza le principali scelte progettuali adottate per la gestione dello stato di gioco e dell’interfaccia utente adattiva, con particolare attenzione alla separazione tra la logica di gioco e la componente di rete, così da rendere il sistema facilmente estendibile a una modalità multiplayer. Vengono inoltre affrontate le principali problematiche legate alla sincronizzazione dei giocatori, alla gestione dei turni e all’esperienza utente in un contesto di realtà aumentata condivisa."
