  speakers:
  - '9'
  description: "\nI modelli di Hyperlink Prediction si basano sul concetto di Ipergrafo, dove quest'ultimo soffre del problema di sbilanciamento delle classi (positive e negative);\nIn questo seminario si esporranno i primi passi nella realizzazione di una Python per la valutazione di algoritmi di hyperlink prediction, fornendo una interfaccia comune a tutte le componenti di un intera pipeline di valutazione."
