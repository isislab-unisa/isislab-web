  title: '&#8220;Developing Educational Games via a Cloud Solution&#8221; di Antonio De Caro'
  speakers:
  - '9'
  description: "Cloud computing is a current trend in information technology and has become an important part of many industries. In the educational games field, cloud computing has the potential to revolutionize how educational games are created, delivered, and consumed.\nThis research aims to contribute to a better understanding of how cloud computing can be integrated into the development of educational games and how developers can utilize its powerful tools to create games that are not only more engaging but also more effective in terms of learning outcomes and deployment speed.\nTo address this issue, this thesis investigates the practicalities of integrating cloud computing with educational games using the fundamentals of \"Educational Serious Games as a Service\" (ESGaaS) which highlight a set of characteristics that enable the execution of educational games in a cloud environment.\nBy applying a design science research method, we developed a prototype that addresses the needs of an ESGaaS-compliant architecture, and we evaluated it by highlighting the sensitivity points, risks, non-risks, and tradeoffs of such an architecture."
