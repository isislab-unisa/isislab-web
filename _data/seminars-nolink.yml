  speakers:
  - '9'
  description: "SeminarioISISLab-17-09-2021\n\nAbstract : Conviviamo col Covid da più un anno e mezzo e ora in Italia le restrizioni sono sempre minori,ma su rischi e benefici di rimuovere tali restrizioni ci sono numerosissimi studi,tra cui il nostro. Il seminario parla del nostro lavoro nella realizzazione di una simulazione ad agenti che permetta di avere un'idea dei possibili contagi su mezzi di trasporto, i quali sono identificati dagli enti pubblici di tutto il mondo come principali luoghi in cui il virus si diffonde a causa delle difficoltà che spesso bisogna affrontare per rispettare le misure di sicurezza. Mostreremo nel dettaglio la simulazione, le tecnologie utilizzate per la sua realizzazione e come modificarla per futuri utilizzi.\n\nIl collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale # seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:"
