  speakers:
  - '9'
  description: "Da pochi anni a questa parte ci troviamo spesso ad interagire con i Bot online, dei veri e propri assistenti virtuali in grado di aiutarci a svolgere velocemente e in maniera molto semplice compiti più o meno complessi. Nel corso degli anni, sono stati sviluppati una quantità incredibilmente ampia di assistenti virtuali che consentono di eseguire efficacemente operazioni ricorrenti tramite conversazioni naturali che permettono di capire il linguaggio umano così da comprendere le loro esigenze ed esporre loro delle soluzioni che si adattano al contesto nel quale il Bot lavora. Un notevole aiuto allo sviluppo di questo genere di software è fornito dall'avvento del Cloud Computing e dalla sempre più rapida espansione e miglioramento degli algoritmi di Intelligenza Artificiale.\nDa queste premesse nasce ISISLab HelpDesk , un assistente virtuale in grado di offrire supporto al laboratorio di ricerca ISISLab . ISISLab HelpDesk permette di sollevare gli amministratori del laboratorio da una serie di compiti che sono automatizzati grazie all'aiuto di tale assistente virtuale. Qualsiasi utente può facilmente utilizzare ISISLab HelpDesk grazie agli algoritmi di Intelligenza Artificiale che sono stati implementati. Tali algoritmi permettono all'utente di comunicare con il bot mediante linguaggio naturale. In aggiunta, ISISLab HelpDesk continua ad apprendere e a migliorare nel tempo in modo autonomo. L'architettura del bot sfrutta la tecnologia dei container per ottimizzare le fasi di installazione e di esecuzione, realizzando un'architettura snella e facile da manutenere."
