  title: 'Seminario ISISLab: Conference Report @CSCWD&#038;ESWC 2019: Quality Assessment &#038; Enrichmnet Ontologies Knowledge Graphs &#038; ML di Maria Angela Pellegrino'
  speakers:
  - '9'
  description: "In questo conference report vorrei fornire un insight delle conference CSCWD e ESWC, le relative comunità e la mia percezione di queste due realtà.\nRiporterò i lavori che mi hanno colpito e incuriosito relativi alla definizione di ontologie, gestione del problema della qualità e come gestire il connubio tra Knowledge Graph e Machine Learning.\nSpero che sia un'opportunità per ragionare su direzioni future e possibili collaborazioni.\nLet's see if we will get inspired!!! 😀"
