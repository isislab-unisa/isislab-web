  description: "I Termini di servizio sono molto spesso documenti lunghi e difficili da comprendere, infatti, è noto che raramente vengono letti dagli utenti che fruiscono di un determinato servizio. È tuttavia importante comprenderli perché essi contengono informazioni sull’utilizzo di un servizio o di un software ed in più includono le policy privacy che ci informano su come utilizzano i nostri dati. L’obiettivo del mio lavoro di tesi è quello di sviluppare un sistema di supporto agli utenti nella comprensione di tali documenti. In questo seminario presenterò la problematica e come è stata finora affrontata, inclusi i dettagli relativi alla metodologia da me applicata per lo sviluppo di tale sistema.\n\nIl seminario si svolgerà in modalità telematica sul canale vocale #seminars di Discord .\n\nIl collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale ? seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:\n\nISISLab Seminars in Discord"
