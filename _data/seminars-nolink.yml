  description: "Webpage di Luca Postiglione\n\nAbstract : Agent-based models are computer simulations used to study the interactions between people, things, places, and time. So, for developers it's crucial using a framework to be focused only on agents and system behaviour. I'll show you features of several frameworks and which one we want to integrate in Rust-AB, the one implemented by ISISLab. Then I'll explain you how Rust-AB team is organized, what we are doing and which features the team and I wonna include.\n\nIl collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale # seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:\n\nISISLab Seminars in Discord"
