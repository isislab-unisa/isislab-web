  title: 'Seminario: &#8220;Cody dietro le quinte: un&#8217;introduzione per sviluppatori a Spark AR Studio&#8221; di Daniele Monaco'
  speakers:
  - '9'
  description: "In un mondo sempre più connesso, la realtà aumentata sta ridefinendo l'esperienza sociale online, consentendo agli utenti di interagire in modi innovativi e coinvolgenti. Questo seminario offre uno sguardo approfondito su Spark AR Studio, la piattaforma che permette agli sviluppatori di creare esperienze AR coinvolgenti per Facebook e Instagram. Spark AR ha reso possibile la creazione dell'effetto AR con Cody, la nuova mascotte del Dipartimento di Informatica. Attraverso una panoramica del lavoro di sviluppo, esploreremo le fasi di progettazione e implementazione dell'effetto, svelando il processo dietro il tracciamento ambientale, la modellazione 3D e l'aggiunta di interazioni dinamiche. Scopriremo il linguaggio di scripting di Spark AR e come è stato utilizzato per dare vita a Cody."
