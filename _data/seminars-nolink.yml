  title: 'Seminario: &#8220;ISISLabHelpDesk: un bot Azure a supporto di tutti i membri dell&#8217;ISISLab&#8221; di Matteo D&#8217;Auria e Giuseppe D&#8217;Ambrosio'
  speakers:
  - '9'
  description: "Il Bot Framework insieme con il servizio Azure Bot Service fornisce gli strumenti necessari per creare e mandare in esecuzione bot intelligenti integrandoli con vari servizi in Cloud offerti da azure che permettono di ampliarne le funzionalità, il tutto integrato in un singolo ambiente. Un bot fornisce un'esperienza simile a quella che si avrebbe con una persona reale, potendo delegare ad esso compiti semplici e ripetitivi come prenotazioni o ottenimento di informazioni che in questo modo possono essere automatizzati senza l'intervento umano. In questo seminario verrà descritta l’architettura e le tecnologie coinvolte nello sviluppo di un assistente virtuale utilizzando le tecnologie offerte da Microsoft Azure, inoltre verrà presentato l’ISISLabHelpDesk, un bot di support alle attività del laboratorio ISISLab ideato per facilitare il lavoro dei suoi membri, siano essi ricercatori o studenti.\n\nIl collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale # seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:\n\nISISLab Seminars in Discord"
