  title: 'Seminario: &#8220;Twitter data analysis: dal download dei dati alla analisi e visualizzazione&#8221; di Lucreazia Robustelli e Gaetano Iuliano'
  speakers:
  - '9'
  description: "\"Negli ultimi anni l'uso dei social media è cresciuto in modo esponenziale e le persone attraverso questi mezzi esprimono, a volte anche involontariamente, le proprie opinioni e preferenze, senza preoccuparsi o rendersi conto delle possibili conseguenze.\nIl nostro lavoro di tesi si concentra principalmente sull'elaborazione del linguaggio naturale - NLP (Natural Language Processing) - , nello specifico come dai dati Twitter si possa estrarre un' opinione automaticamente (discussione e relativo sentimento), tramite l'utilizzo di tools specifici che sfruttano le API di Twitter. Illustreremo, in questo primo seminario, lo stato dell'arte relativamente alla Sentiment Analysis e al Topic Modeling introducendone i tools più usati per la loro analisi, e mostrandone delle semplici applicazioni.\"\n\nIl collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale # seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:"
