  title: 'Open Data per i Beni Culturali: evento finale ASL'
  speakers:
  - '8'
  description: "Le scuole coinvolte nelle attività di Alternanza Scuola – Lavoro con il Progetto Hetor nell'anno 2018/2019 presenteranno i risultati del lavoro svolto durante il loro percorso.\n\nGli studenti hanno lavorato nell’ambito della valorizzazione del patrimonio culturale della Regione Campania. Come risultato gli alunni hanno contribuito alla creazione di dataset pubblicati con licenza open.\n\nLe scuole che hanno partecipato sono:\n\nProfAgri di Castel San Giorgio\n\nLiceo scientifico \"P.S. Mancini\" di Avellino\n\nIstituto \"Besta-Gloriosi\" di Battipaglia.\n\nL'incontro si terrà nella aula P1 del Dipartimento di Informatica dell'Università di Salerno\n\nAgenda:\n\nSaluti del prof. Vittorio Scarano\n\nPresentazione della dott.ssa Angela Cocchiarella, del Team Open Data della Regione Campania\n\nPresentazioni del lavoro fatto, da parte degli studenti"
