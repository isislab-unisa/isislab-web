  title: 'Seminario: &#8220;Sviluppo di un&#8217;Ontologia basata su Screenia e sul dominio della Filosofia Medievale (Medieval Philosophy works Publishing And Commenting Ontology)&#8221; di Francesco Monzillo'
  speakers:
  - '9'
  description: "Uno studio inerente alle Ontologie Standard presenti allo stato dell'arte basate sulla pubblicazione e commentazione di opere e, più in generale, sui concetti riguardanti la digitalizzazione del patrimonio culturale;\nl'obiettivo dello studio effettuato è stato lo sviluppo di un Ontologia che tiene conto sia dei requisiti della piattaforma Screenia (ancora in via di sviluppo), sia degli altri aspetti che caratterizzano il dominio della filosofia medievale.\nIn questo seminario ci concentreremo sull'esposizione delle Sotto-Ontologie individuate che vanno a comporre lo schema finale ed evidenzieremo i principali requisiti della piattaforma Screenia che si è cercato di soddisfare."
