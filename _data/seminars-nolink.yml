  title: 'Seminario: &#8220;Cross Reality in ambiente industriale 4.0&#8221;  di CHOAIB GOUMRI'
  speakers:
  - '9'
  description: "Negli ultimi anni, l’integrazione tra ambienti virtuali e tecnologie di realtà aumentata ha assunto un ruolo sempre più centrale nei contesti industriali, favorendo l’emergere di soluzioni che combinano visualizzazione immersiva e interazione avanzata. La presente tesi presenta un caso d’uso del framework CrossWarp, progettato per abilitare esperienze collaborative ibride e transizioni fluide tra differenti livelli di realtà, applicato alla simulazione di un impianto industriale automatizzato.\n\nIl progetto sviluppato consiste in un sistema interattivo in cui oggetti digitali come pacchi che vengono trasportati da macchinari simulati (nastri, rulli) e interagiscono con un portale digitale, rappresentato da un monitor, che consente la visualizzazione aumentata dello stato interno o alternativo dell’oggetto stesso. Attraverso l’utilizzo combinato di Unity e Photon Fusion, l’applicazione supporta interazioni multiutente in tempo reale.\n\nLo scenario proposto dimostra come CrossWarp possa essere impiegato efficacemente per arricchire processi produttivi simulati, supportando attività di formazione tecnica, testing di linea e collaborazione remota tra utenti dotati di dispositivi eterogenei. L’approccio si distingue per la modularità, l’interoperabilità tra ambienti desktop e in realtà aumentata, e per l’attenzione posta all’interazione contestuale in spazi ibridi.\n\nI risultati ottenuti evidenziano il potenziale della Cross Reality come strumento innovativo nella progettazione, simulazione e visualizzazione di sistemi industriali intelligenti."
