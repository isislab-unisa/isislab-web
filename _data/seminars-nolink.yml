  description: "\"Le simulazioni Agent-based rappresentano uno strumento per la risoluzione di problemi in svariati contesti, dal design alla pianificazione e progettazione. In un contesto simile, la condivisione di queste simulazioni, in un ambiente collaborativo e interattivo, risulta essere particolarmente interessante. Il progetto consiste nel realizzare una ambiente con queste caratteristiche, sfruttando la libreria MASON e l'engine grafico Unity3D. In questo seminario verranno descritte brevemente le motivazioni di questo lavoro di tesi, motivate e discusse le soluzioni adottate per il suo sviluppo e i risultati ottenuti finora.\" Il collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale # seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:\n\nISISLab Seminars in Discord"
