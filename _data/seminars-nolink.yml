  speakers:
  - '9'
  description: "Nella tesi descrivo il sistema MySir, di Microanbiente srl (dove ho svolto il tirocinio esterno), che si caratterizza per avere un elevato vantaggio sia per i cittadini che per le amministrazioni, poiché i primi possono monitorare gratuitamente e in tempo reale l’operato dell’ente che li amministra nell’ottica della trasparenza e i secondi, accedendo alle aree riservate attinenti, possono svolgere l’importante attività di archiviazione e gestione della documentazione relativa ai rifiuti, con la possibilità di confrontare il proprio operato con quello di altri. L’obbiettivo di questo studio è, dunque, mettere in rilievo le tecnologie utilizzate per la realizzazione del sistema MySir e evidenziarne i dettagli implementativi.\n\nIl collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale # seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:\n\nISISLab Seminars in Discord"
