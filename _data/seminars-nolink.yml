- date: 18/10/2019
  time: 16:00 - 17:00
  venue: ''
  title: 'Seminario: Presentazioni tesi di laurea di Ottobre 2019'
  speakers:
  - '9'
  description: "I laureandi, Salvatore Santelia , Massimo Giordano , Luca Postiglione , Vittorio Baldi e Nicola Amoriello , discuteranno la presentazione del loro lavoro di tesi:\n\nFuzzy techniques for automatic outlier detection in open data di Salvatore Santelia\n\nTesting ed integrazione nel linguaggio Julia di una libreria JavaScript per la visualizzazione di ipergrafi di Massimo Giordano\n\nSyntactical Errors Detection: individuazione e correzione di errori sintattici usando tecniche di clustering di Luca Postiglione\n\nHypergraph Plot di Vittorio Baldi\n\nSimulazione basata su agenti con JULIA di Nicola Amoriello"
