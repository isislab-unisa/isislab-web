  title: 'Seminar by STEFANO MARSEGLIA and PIERLUCA NARDONE :&#8221;AWS frameworks for a more efficient serverless application development: AWS SAM and AWS Amplify&#8221;'
  speakers:
  - '9'
  description: "Speaker : STEFANO MARSEGLIA\n• BIO\nStefano Marseglia is an AWS Solutions Architect and head of the\ndevelopment department at Epsilon s.r.l. He’s got 9 years of experience\nin full stack web applications development, software systems integration\nand AWS cloud services.\n\n• Speaker : PIERLUCA NARDONE\n• BIO\nPierluca Nardone is a Software Engineer at Epsilon s.r.l. He is involved in the design, development, and deployment of applications, web services, and mobile apps, adopting DevOps AWS solutions.\n\n• Abstract :\nOver the years we’ve become more and more familiar with the term “serverless application” and its main benefits such as cutting down costs and reducing infrastructure management overhead. But the implications of this new paradigm on the daily job of a developer are often somewhat overlooked. What does it really mean for a developer to work with serverless applications? In this talk we will give an answer to this question by presenting two AWS frameworks which support serverless application development on AWS: AWS SAM and AWS Amplify. During the discussion we will focus on what kind of issues these two frameworks try to resolve and will show their main features by means of some practical examples.\n\nAgenda\n\n• Greetings, Company and speaker presentation\n• What does \"serverless\" mean and which responsibilities are delegated to the cloud provider?\n• Main advantages of serverless applications\no Reduction of management complexity\no Cost reduction\n• Main challenges in adopting the serverless paradigm and introduction to AWS serverless frameworks\n• SAM\n• SAM practical example\n• Amplify\n• Amplify practical example"
