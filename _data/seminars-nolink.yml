  title: Seminari di Ciro Maiorino e Antonio Renato Montefusco
  speakers:
  - '9'
  description: "SeminarioISISLab-28-10-2021 (1)\n\nTitolo : Simulazione ad agenti nei trasporti: movimenti e comportamenti dei mezzi di trasporto di Ciro Maiorino\n\nAbstract: Data la pandemia di Covid-19 si sono dovuti effettuare vari studi e ricerche sull’argomento in ogni ambito. Lo scopo di questa tesi è la realizzazione di una simulazione basata su agenti che utilizzano un mezzo di trasporto pubblico in periodo di pandemia. Tramite questa simulazione è possibile ottenere dati statistici sui contagi che avvengono in una giornata sulla tratta del mezzo di trasporto. La simulazione è stata realizzata in Unity 3D. Per la simulazione sono stati utilizzati dati reali ottenuti da un articolo scientifico riguardante i trasporti nella città giapponese di Obuse pubblicato da Elsevier LTD. nel 2020. In questa tesi oltre ad una osservazione generale sul lavoro di simulazione svolto sarà analizzato nel dettaglio la parte di quest’ultimo che riguarda i mezzi di trasporto e le strade, dalla loro modellazione, all’utilizzo fatto e le difficoltà incontrate nel loro utilizzo.\n\nTitolo : Simulazione ad Agenti nei Trasporti: Modellazione dei Comportamenti degli Utenti e Simulazione dei Contagi di Antonio Renato Montefusco\n\nAbstract : Data la pandemia da Covid-19, si sono dovuti effettuare vari studi e ricerche sull'argomento in ogni ambito. Lo scopo di questa tesi è la realizzazione di una simulazione basata su agenti che utilizzano un mezzo di trasporto pubblico in periodo di pandemia. Tramite questa simulazione è possibile ottenere dati statistici sui contagi che avvengono in una giornata sulla tratta del mezzo di trasporto. La simulazione è stata realizzata completamente in Unity 3D. Per la simulazione sono stati utilizzati dati reali ottenuti da un articolo scientifico riguardante i trasporti nella città giapponese di Obuse pubblicato da Elsevier LTD nel 2020, il quale studio ha riportato il numero di passeggeri medi durante la tratta di autobus tracciati tramite Wi-Fi scanner. Gli agenti utilizzati per la simulazione sono dei modelli poligonali di persona e sono animati per tutte le loro azioni le quali rispettano un diagramma a stati che indica il loro comportamento, il passaggio da uno stato all'altro è definito da dei trigger, come ad esempio, il bus che si ferma fa andare l'agente nello stato di camminata. I contagi sono stati gestiti tramite il Particle System Shuriken, il quale permette di catturare le collisioni delle particelle, quindi sono stati definiti tre tipologie di agenti, Sano, Infetto e Contagioso. L'agente Contagioso emette delle particelle di CoViD-19, le quali entrando in contatto con un agente Sano possono infettarlo. Inoltre la simulazione permette di fare statistiche sui dati scrivendo i risultati dell'esecuzione su file di formato csv, i quali sono di facile gestione. Il collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale # seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:"
