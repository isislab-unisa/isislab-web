  title: 'Seminario: &#8220;I committed Cloud keys on GitHub! What now?&#8221; di Giuseppe D&#8217;Ambrosio'
  speakers:
  - '9'
  description: "Developers routinely use GitHub to back up, share, and manage changes to code. GitHub code repositories are usually public. Anyone can find and access code. Working with cloud resources means using secret keys and tokens to access and interact with services. Malicious hackers know that developers often forget to remove sensitive data before pushing on GitHub, so they scan and scrape repositories for this data.\nThis seminar will talk about protecting sensitive data when working with cloud as developers, going through some real experiences, and providing some best practices.\n\nIl collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale # seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:\n\nISISLab Seminars in Discord"
