  title: 'Seminario: Presentazione dei lavori di tesi'
  speakers:
  - '9'
  description: "Speaker : Gabriele Tuozzo\nTitolo : Automatic Knowledge Graph Quality assessment Over the Time\nAbstract : In questo seminario si illustrerà lo stato della qualità della Linked Open Data Cloud, utilizzando i dati di qualità raccolti da KGHeartBeat da novembre 2023 ad oggi. KGHeartBeat è un progetto realizzato e manutenuto nell'ambito del laboratorio di ricerca ISISLab, si propone come un strumento condiviso ed open-source che esegue periodicamente l'analisi di qualità su circa 1882 Knowledge Graph che sono liberamente accessibili e registrati sulla Linked Open Data Cloud e DataHub. Come vedremo, analizzando i dati di qualità prodotti possiamo intuire importanti tendenze nei KG. Inoltre, seguendo i suggerimenti della comunità del Web Semantico che suggerisce di rilasciare i dati in formato compatibile con gli standard della comunità, saranno illustrate alcune metodologie esplorate per sfruttare gli LLM per trasformare i dati di qualità tabellari restituiti da KGHeartBeat, in un Knowledge Graph. Sarà mostrato inoltre come questa metodologia è stata poi implementata nel workflow di misurazione di qualità di KGHeartBeat.\n\nSpeaker : Christian Mascolo\nTitolo : Integrazione di dati GIS in krABMaga\nAbstract : Lo scopo del progetto é l'implementazione di un plugin per integrare dati geospaziali all'interno di krABMaga, un motore di simulazione basato su eventi discreti scritto in linguaggio Rust. Vista la complessità di questo tipo di dati, è necessario sviluppare un'architettura modulare e facile da usare per il modellatore. Il plugin permette di caricare i dati all’interno di una simulazione e visualizzarli all'interno dell'interfaccia, senza particolare sforzo da parte del modellatore. Attraverso l’uso di questo tipo di dati è possibile creare scenari 2D, come mappe o strade. Il plugin dà la possibilità ai modellisti di analizzare la popolazione in situazioni reali, misurando l’impatto dei fattori geografici sulle dinamiche degli agenti.\n\nSpeaker : Alessandro d'Esposito\nTitolo : Automatizzazione e monitoraggio del processo di deploy di applicazioni containerizzate\nAbstract : In questo seminario verrà presentato il lavoro svolto per sviluppare una piattaforma software con l’obiettivo di ottimizzare il ciclo di vita delle applicazioni e migliorare la sicurezza e l’affidabilità delle applicazioni containerizzate. Verrà presentata un’analisi dello stato dell’arte delle piattaforme che offrono funzionalità di deploy e monitoraggio per applicazioni containerizzate, con l'intento di identificare le funzionalità principali e le best practice del settore. Verrà illustrato lo studio condotto sulle tecnologie utili per lo sviluppo della piattaforma, mostrando le funzionalità che sono state integrate e focalizzandosi in particolare sull’analisi delle vulnerabilità di un’immagine tramite il tool Docker Scout. Infine, verranno delineati gli sviluppi futuri della soluzione e evidenziate le sfide più interessanti e innovative per la piattaforma."
