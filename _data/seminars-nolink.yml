  title: 'Seminario ISISlab: &#8220;Tecniche di intelligenza artificiale per il riconoscimento di utenti in ambiente mobile&#8221;. Carmine Capo'
  speakers:
  - '1'
  description: "Al giorno d'oggi viviamo in una società dove tutto è connesso. L'utilizzo massiccio della tecnologia, ed in particolar modo i dispositivi mobile, ha portato inevitabilmente ad un cambiamento della vita delle persone, semplificandone molte delle attività quotidiane. L'altra faccia della medaglia riguarda invece i rischi derivanti da un uso poco regolato di queste tecnologie, quali ad esempio il tracciamento degli utenti e la loro identificazione. In questo seminario presento il mio lavoro di tesi che consiste nello studio e nell'applicazione di tecniche di IA (single-view e multi-view learning) per studiare le interazioni dell'utente con i dispositivi mobile, distinguendo tra adulto e minore"
