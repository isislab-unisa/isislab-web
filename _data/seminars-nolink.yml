  title: Seminari di Antonio Giulio e Gerardo Donnarumma
  speakers:
  - '9'
  description: "1) \"Keyword-based search engine for Knowledge Graphs - a discoverability enhancement system\" di Antonio Giulio Abstract : Negli ultimi anni abbiamo assistito ad una massiccia diffusione dei Knowledge Graph, una rappresentazione della conoscenza sotto forma di grafo. Come qualsiasi altro tipo di informazione, i Knowledge Graph soffrono dal punto di vista della qualità in termini di inconsistenza, inaccuratezza, obsolescenza e incompletezza. Tra le problematiche, il mio lavoro di tesi si concentra sulla discoverability dei Knowledge Graph, una metrica di qualità che indica quanto facilmente riusciamo a reperire un dato. Le piattaforme di data management come LOD Cloud e DataHub, consentono di cercare i Knowledge Graphs, tuttavia non forniscono un approccio standard per l’interrogazione. Per questo motivo gli utenti si trovano spesso a confrontare i risultati ottenuti da diverse sorgenti per scegliere quelli che più si avvicinano ad un topic di interesse, questo richiede un ingente sforzo e conoscenze riguardanti l’integrazione e la standardizzazione dei dati. Questa tesi propone un approccio per l’accesso unificato a sorgenti di dati eterogenee al fine di supportare utenti inesperti e sviluppatori nel processo di scoperta e ricerca keyword-based dei Knowledge Graph. Per raggiungere l’obiettivo è stato progettato ed implementato un motore di ricerca keyword-based per Knowledge Graph che sfrutta LOD Cloud e DataHub come sorgenti di dati, a cui fornisce un accesso standard ed unificato. Il sistema è disponibile online con licenza open source ed è costituito da un insieme di API che danno la possibilità agli sviluppatori di integrare ed utilizzare facilmente i servizi offerti. Gli utenti inesperti possono invece utilizzare una comoda interfaccia grafica che presenta due diverse modalità di rappresentazione dei risultati, quattro modalità di ordinamento e la verifica on-demand dell’accessibilità dei Knowledge Graph. A supporto dello strumento realizzato viene effettuata una analisi dei risultati volta a dimostrare: l’efficacia dello stesso, rispetto alle sorgenti di dati considerate, e la pertinenza dei Knowledge Graph risultanti rispetto alle keyword indicate dagli utenti. 2) \" CMVO - Piattaforma per la creazione, manipolazione e visualizzazione di ontologie\" di Gerardo Donnarumma ABSTRACT: L’obiettivo del nostro percorso di tesi è stato lo sviluppo di una piattaforma per la creazione, manipolazione e visualizzazione di ontologie senza alcun vincolo sul dominio di applicazione. CMVO (Creation Manipulation Visualization Ontology) è un’applicazione user-friendly pensata non solo per gli esperti delle ontologie, ma per chiunque voglia facilmente implementare o integrare ontologie senza conoscerne i dettagli implementativi. L’applicativo è stato pensato per essere sia una Web Application che un plugin per la piattaforma Social Platform for Open Data (SPOD).\n\nIl collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale # seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:"
