  title: 'Seminario: &#8220;Skill di Alexa per l&#8217;interrogazione di Knowledge Base&#8221; di Mario Santoro'
  speakers:
  - '9'
  description: "Pagina web di Mario Santoro\n\nAbstract .: Una Knowledge Base è una tecnologia usata per memorizzare informazioni complesse in modo strutturato o non strutturato. In questa presentazione verrà mostrato come interrogare una Knowledge Base, in particolare Wikidata, tramite il meccanismo di interazione vocale di Alexa. Affronteremo i principali passi per la creazione di una skill e una lambda function su AWS.\nPresenterò una skill in grado di rispondere a domande come \"what is the wife of Lincoln\" oppure \"who is Turing\" attraverso il riconoscimento di pattern predefiniti che permettono la creazione automatica di query SPARQL eseguite su Wikidata."
