  title: 'Seminario: &#8220;Implementazione pattern di movimento automatico in ambiente Unity 3D&#8221; di Domenico Esposito'
  speakers:
  - '9'
  description: "Pagina web di Domenico Esposito\n\nAbstract : In questa presentazione verrà illustrata l'implementazione in ambiente Unity 3D di quattro modelli comportamentali che solitamente gli utenti tendono a seguire durante le visite all'interno di musei o mostre d'arte. I pattern di movimento presi in considerazioni, ovvero Poisson, Fourmi, Papillon e Sauterelle sono stati definiti all'interno del paper \"Etnografia di una mostra. Storia dell’expo. Persone e culture.\" pubblicato nel 1983 da Martine Levasseur e Eliseo Veron.\n\nScaletta della presentazione:\n\nIntroduzione ai 4 pattern\n\nPanoramica della struttura del museo di riferimento in ambiente Unity\n\nCome vengono generati e gestiti i percorsi e movimenti dei bot nel museo\n\nImplementazione del pattern Poisson\n\nImplementazione del pattern Fourmi\n\nImplementazione del pattern Papillon\n\nImplementazione del pattern Sauterelle"
