  title: 'Seminario: &#8220;Implementazione NoSQL in FLY&#8221; di Antonio Cirillo'
  speakers:
  - '9'
  description: "Lavorare con i dati è una necessità per la maggior parte delle applicazioni che sfruttano i database per la loro gestione. Negli ultimi anni, la mole di dati da gestire e la velocità con cui vengono prodotti è aumentata sempre di più, insieme con la diversità con cui si presentano, richiedendo requisiti come prestazioni elevate, bassa latenza e flessibilità. La nascita dei database NoSQL viene incontro a questo tipo di necessità fornendo schemi flessibili per la memorizzazione e la gestione dei dati e capacità di scalare velocemente sfruttando cluster e sistemi distribuiti. Le caratteristiche dei database NoSQL li rendono quindi particolarmente adatti ad applicazioni che richiedono alta potenza di calcolo e ad essere implementati sfruttando il Cloud Computing. In questo seminario verrà descritta l'introduzione del supporto ai database NoSQL all'interno del linguaggio FLY, un Domain Specific Language per il calcolo scientifico su multi-cloud.\n\nIl collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale # seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:\n\nISISLab Seminars in Discord"
