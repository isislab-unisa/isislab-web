  venue: Laboratorio ISISLab, Dipartimento di Informatica, Università di Salerno (Edificio F, Lab. 10, II piano), Via Giovanni Paolo II, 132, 84084 Fisciano SA, Fisciano
  title: 'Seminario: &#8220;Generazione procedurale di contenuti&#8221; di Gerardo Megaro'
  speakers:
  - '9'
  description: "Pagina di Gerardo Megaro\n\nAbstract : \"Nel mondo dei videogiochi sempre più spesso si sente parlare di giochi randomici o procedurali. Le branche di giochi procedurali utilizza algoritmi per generare contenuti per l'utente sempre diversi in modo che più iterazioni di questo vengano percepiti come nuovi e/o unici, gli algoritmi più utilizzati per questa tipologia di videogiochi sono le Noise. In questo seminario darò un esempio di generazione procedurale tramite Perlin noise e Voronoi tessellation.\""
