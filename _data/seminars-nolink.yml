  title: 'Seminario: M²CS: Una libreria per lo storage multi/hybrid-cloud con funzionalità di replica trasparente di Luca Del Bue'
  speakers:
  - '9'
  description: "Con la crescente diffusione delle architetture cloud-native, emerge la necessità di gestire in modo efficiente e uniforme i dati distribuiti su diversi servizi di storage. M²CS (Multi-Cloud Multi-Storage), una libreria sviluppata in Go, si propone come livello di astrazione tra le applicazioni e i provider di storage, siano essi cloud o on-premise. La tesi illustra la progettazione e l’implementazione di questa libreria, con particolare attenzione alle operazioni CRUD e alla gestione, sia sincrona che asincrona, dei dati in modo trasparente, efficiente (compressione) e sicuro (cifratura) verso servizi eterogenei quali AWS S3, Azure Blob Storage e MinIO. La caratteristica distintiva di M²CS è la capacità di replicare automaticamente i file su più provider, garantendo alta disponibilità, affidabilità e indipendenza dal vendor."
