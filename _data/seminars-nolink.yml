  description: "\" Human mobility models: an overview \" di Luigi Crisci\n\nAbstract : In questo seminario verrà data una visione dello stato dell'arte\nnel campo dello human mobility modelling, analizzando le principali metriche utilizzate nella definizione e validazione dei modelli e mostrandone una tassonomia per la loro classificazione. A tali dati seguirà la descrizione di due human mobility model da me sviluppati.\n\n\" Supporto all'esecuzione su Virtual Machine in FLY \" di Nicola De Cristoforo\n\nAbstract : FLY, un Domain-Specific-Language per il calcolo scientifico sul multi-cloud il cui obiettivo è quello di semplificare lo sviluppo di applicazioni che sfruttino la potenza computazionale offerta dai cloud provider e dai loro servizi. L’interazione con il cloud viene astratta all’utente finale che non necessita di conoscere le specifiche API del provider che vuole utilizzare.\nQuesto seminario ha lo scopo di presentare la possibilità introdotta in FLY di poter eseguire il programma su una Virtual Machine su ambiente AWS mediante un’apposita istruzione FLY che permette di creare, lanciare comandi e gestire un’istanza di una Virtual Machine sul Cloud.\n\nIl collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale # seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:\n\nISISLab Seminars in Discord"
