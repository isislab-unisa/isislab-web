  title: 'Seminario: &#8220;Flutter &#038; Dart: le nuove frontiere delle app cross-platform&#8221; di Diego Varriale'
  speakers:
  - '9'
  description: "\"Flutter è un framework per lo sviluppo cross-platform di app per dispositivi mobili. Con Flutter, è quindi possibile, a partire da un unico codice sorgente, effettuare il deploy dell’applicazione risultante sia su iOS che su Android. In questa piccola lezione vedremo tutte le principali caratteristiche di questo framework, a partire da come installarlo, fino ad arrivare a comprendere l’approccio migliore per sviluppare in modo abbastanza completo un’applicazione mobile moderna ed accattivante. Flutter è un progetto open source totalmente gratuito per la creazione di app native di alta qualità in tempi rapidi e con il supporto alle interfacce native. Il progetto è stato sviluppato da Google e mantenuto da quest’ultimo e dalla community; è utilizzato da moltissimi sviluppatori e grandi aziende, tra cui Alibaba, Google stesso e molti altri ancora. Flutter si compone di due macro strati: 1. strato scritto in C/C++; 2. strato scritto in Dart, un nuovo e moderno linguaggio orientato agli oggetti che definisce la maggior parte del suo sistema (gesture, animazioni, framework, widget, ecc.) ed offre agli sviluppatori un grande controllo sul sistema stesso. Dart è un linguaggio di programmazione orientato agli oggetti per il web, completamente open source e sviluppato da Google. Presentato per la prima volta nel 2011, Dart è stato rilasciato in versione stabile (v1.0.0) solo qualche anno dopo, e a Novembre del 2018 è stata annunciata la versione 2.1. Lo scopo di Dart è quello di aiutare lo sviluppatore a costruire moderne applicazioni web, server e mobile cross-platform con Flutter. Per fare ciò, Dart offre tutti gli attributi necessari per un linguaggio moderno e generico, una Virtual Machine per la compilazione del codice Dart, librerie di base e repository di gestione dei pacchetti per l’aggiunta di funzionalità. L’obiettivo finale di questa lezione sarà fornire un feedback generale su Flutter e Dart, e cioè: descrizione della struttura di Flutter e spiegazione del perché utilizzarlo; descrizione del linguaggio Dart con analisi delle sue fondamenta e cenni su alcune differenze con altri linguaggi. \""
  image: /assets/img/seminars/default.png
- date: 19/12/2019
  time: 01:00
  venue: Laboratorio ISISLab, Via Giovanni Paolo II, 132, Fisciano (Salerno), 84084
  title: 'Seminario: Implementazione pattern di movimento automatico in ambiente Unity 3D &#8211; Parte II di Domenico Esposito'
  speakers:
  - '9'
  description: "In questa presentazione verranno illustrati gli aggiornamenti e le novità del progetto relativo all'implementazione in ambiente Unity 3D di quattro modelli comportamentali che solitamente gli utenti tendono a seguire durante le visite all'interno di musei o mostre d'arte. È possibile recuperare i dettagli relativi alla prima parte della presentazione del progetto attraverso i link presenti in questa pagina . In questa seconda parte verranno esposti i dettagli relativi al coordinamento dei movimenti dei vari agenti e all'incremento della realisticità della simulazione, nonché al calcolo e al salvataggio delle informazioni di ogni agente al termine della sua visita.Scaletta della presentazione:\n\nBreve recap della prima release del progetto\n\nPanoramica delle nuove funzionalità\n\nImplementazioni e nuove caratteristiche del progetto:\nNuovi personaggi e HUD\n\nGestione percorsi dinamici\n\nQuadri con diverse priorità\n\nComportamenti diversi di attesa in base all'importanza del quadro\n\nGestione di gruppi di agenti\n\nSistema di configurazioni per le simulazioni\n\nMisurazione e salvataggio della soddisfazione degli agenti"
  image: /assets/img/seminars/default.png
- date: 10/12/2019
  time: 16:30 - 17:30
  venue: Laboratorio ISISLab, Dipartimento di Informatica, Università di Salerno (Edificio F, Lab. 10, II piano), Via Giovanni Paolo II, 132, 84084 Fisciano SA, Fisciano
  title: 'Seminari:&#8221;Twitter e la Social Media Analysis: Sanremo, moralità e ufficialità&#8221; di C.Signore, Automazione del processo di data scraping di  A. Naghamouchi, Opinion Mining e Sentiment Analysis'
  speakers:
  - '9'
  description: "\" Twitter e la Social Media Analysis: Sanremo, moralità e ufficialità \" di Chiara Signore\nAbstract : L'analisi dei social media è diventata negli anni uno strumento fondamentale per monitorare comunità, preferenze degli utenti e per fare previsioni.\nTra i social media spicca Twitter, uno dei più estesi microblogs che conta 330 milioni di utenti attivi nel mondo.\n\nGrazie alla mole di dati scambiati, tale piattaforma viene adoperata allo scopo di prevedere e spiegare una grande varietà di fenomeni del mondo reale negli ambiti più disparati: politico, economico, sanitario, sociale etc.\n\nLo scopo di questo lavoro di tesi è di prevedere per il Festival di Sanremo in base ai dati estrapolati da Twitter, se le persone che hanno interagito attivamente menzionando gli artisti in gara, sono riusciti ad influenzare il vincitore del festival di Sanremo e quindi, tramite l'analisi dei dati raccolti predire quest'ultimo.\n\nLaboratorio ISISLab, Dipartimento di Informatica, Università di Salerno (Edificio F, Stecca 7, Lab. 10, II piano) - Via Giovanni Paolo II, 132, 84084 Fisciano (SA)\n\nAutomazione del processo di data scraping di Aymen Naghamouchi\n\nAbstract : Data la grande quantità di contenuti presenti sul web risulta molto complicato verificare nuovi contenuti e ottenerli manualmente in maniera efficiente. Il mio obiettivo è stato quello di sviluppare un sistema efficiente che permetta di verificare e ottenere nuovi contenuti sul web, attraverso il data scraping. Il sistema sviluppato deve essere in grado di verificare tali contenuti, ottenere i dati e filtrarli, creare un checksum dei dati ottenuti e notificare la presenza di nuovi dati.\n\n\" Opinion Mining e Sentiment Analysis\"\n\nAbstract : Qual è l'opinione pubblica su Twitter circa alcuni eventi di interesse che avvengono nel quotidiano?\n\nProviamo a rispondere a questa ed altre domande attraverso tecniche di social media analysis. Nello specifico, ho analizzato un workload di tweet prelevati mediante la libreria .net Tweetinvi, estrapolato parole chiave, entità e sentiment con l'aiuto della componente di Text Analysis dei Cognitive Services di Microsoft Azure. I risultati vengono mostrati in una dashboard realizzata con Angular e D3js.\n\nIl caso di studio in esame si riferisce al World Congress of Families XIII tenutosi a Verona tra il 29 ed il 31 Marzo 2019. Il nostro obiettivo è stato quello di analizzare le opinioni degli utenti Twitter circa le varie tematiche affrontate dal Congresso stesso."
  image: /assets/img/seminars/default.png
- date: 06/12/2019
  time: 15:00 - 16:00
