  title: 'Seminario: &#8220;Un&#8217;architettura multi-agente per l&#8217;IA affidabile in sanità&#8221; di Giorgio Zazzerini'
  speakers:
  - '9'
  description: " I LLM stanno dimostrando grandi capacità nell'automazione di compiti complessi nel mondo sanitario, tuttavia la loro natura intrinseca di \"black box\" è incompatibile con la rigidità e privacy clinica. Per superare questi limiti viene presentato un progetto con un sistema multi-agente deterministico orientato alla Trustworthy AI."
