  title: 'Seminario: &#8220;La voce come biomarcatore: definizione di un set di feature acustiche per l’identificazione di disturbi dell&#8217;umore&#8221; di Roberto Giuseppe Scarpa'
  speakers:
  - '9'
  description: " \"Individuare precocemente i disturbi dell’umore o gli stati depressivi è fondamentale perché permette di intervenire prima che i sintomi si aggravino e compromettano in modo significativo la qualità della vita della persona. Il riconoscimento tempestivo favorisce l’accesso a trattamenti efficaci, riduce il rischio di complicazioni come isolamento sociale o comportamenti a rischio e consente di attivare adeguate reti di supporto. Inoltre, promuove una maggiore consapevolezza del proprio stato emotivo, aiutando la persona a non minimizzare il disagio e a intraprendere percorsi di cura più mirati e tempestivi. Per questi motivi nasce l’esigenza di sviluppare meccanismi di rilevamento capaci di integrare la valutazione clinica con dati oggettivi. Diversi studi hanno dimostrato che la voce, intesa come pura sequenza di onde sonore, rappresenta un candidato particolarmente promettente, poiché gli stati depressivi tendono a modificare in modo sistematico e misurabile alcune caratteristiche fonetiche. È quindi possibile analizzare tali aspetti considerando il segnale vocale come un vero e proprio biomarcatore emotivo.\n\nIl presente lavoro nasce dall’esigenza di comprendere come l’analisi automatica del parlato possa consentire l’identificazione di indicatori vocali da cui ricavare parametri (feature) compatibili con stati depressivi. Il lavoro svolto include una rassegna della letteratura scientifica più recente, con particolare attenzione agli studi che investigano le caratteristiche acustiche misurabili associate ai disturbi dell’umore. Successivamente, viene sviluppato uno strumento per l’estrazione automatica di parametri vocali a partire da registrazioni audio.\n\nTutti i nuovi parametri identificati sono ricavati dai descrittori fondamentali del segnale e, insieme a essi, vengono analizzati e integrati anche parametri appartenenti a insiemi già standardizzati, al fine di ottenere un set mirato alla risoluzione del problema. La definizione del set è accompagnata da una fase di raffinamento delle registrazioni, che comprende operazioni di riduzione del rumore e stabilizzazione del tracciato vocale. L’elaborato pone le basi per futuri studi e sviluppi nel campo della classificazione automatica, nei quali tali parametri potranno essere impiegati per identificare possibili stati depressivi utilizzando unicamente l’analisi della voce.\""
