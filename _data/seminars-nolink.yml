  description: "\nQuesta presentazione introduce vm-lab, una piattaforma in Python per la gestione centralizzata dei collegamenti alle macchine virtuali del nostro laboratorio. Progettata per garantire manutenibilità e semplicità d’uso, vm-lab elimina la necessità di strumenti esterni, consentendo connessioni dirette alle VM tramite browser con protocolli SSH e SFTP. Verrà eseguita una live demo per mostrare il lavoro svolto nello sviluppo."
