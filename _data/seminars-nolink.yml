  description: "Secondo seminario su SailWatcher, un tool per smartphone, che senza l'ausilio di sensori esterni, permette in maniera automatica di recuperare i parametri sulle forme delle vele delle imbarcazioni. In questo seminario ci focalizzeremo sugli aggiornamenti della pipeline presentata qualche mese fa, sulla realizzazione dell'applicazione in Swift/SwiftUI e sulla parte di servizi web per la condivisione di informazioni tra gli utenti"
