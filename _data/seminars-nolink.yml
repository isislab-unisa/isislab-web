  title: 'Seminario: &#8220;Accelerazione di Java tramite Java Vector API&#8221; di Mattia Cernelli'
  speakers:
  - '9'
  description: "\nL'idea proposta in questo seminario è quella di accelerare le prestazioni di Java attraverso l'impiego di\nistruzioni vettoriali specializzate per hardware SIMD , architettura che consente di eseguire in parallelo la stessa istruzione su più dati.\nQueste istruzioni fanno parte delle API del Progetto Panama e ne compongono uno dei core principali.Analizzeremo quindi queste istruzioni e vedremo come aumentano (e quando invece no) le prestazioni di alcuni algoritmi\nconfrontandoli con la relativa implementazione scalare.Vedremo inoltre come il progetto Panama possa risolvere alcune problematiche tipiche\ndell'utilizzo della Java Native Interface (JNI) in applicazioni Java."
