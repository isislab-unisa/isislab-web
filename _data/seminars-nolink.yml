  title: 'Seminario: Groups Burning: Analyzing Spreading Processes in Community-based Networks di Gennaro Cordasco'
  speakers:
  - '9'
  description: "\nGraph burning is a deterministic, discrete-time process that can be used to model how influence or contagion spreads in a graph. In the graph burning process, each node starts as dormant, and becomes informed/burned over time; when a node is burned, it remains burned until the end of the process. In each round, one can burn a new node (source of fire) in the network. Once a node is burned in round $t$, in round $t+1$, each of its dormant neighbors becomes burned. The process ends when all nodes are burned; the goal is to minimize the number of rounds.\nWe study a variation of graph burning in order to model spreading processes in community-based networks. With respect to a specific piece of information, a community is {\\em satisfied} when this information reaches at least a prescribed number of its members. Specifically, we consider the problem of identifying a minimum length sequence of nodes that, according to a graph burning process, allows to satisfy all the communities of the network.\nWe investigate this NP-hard problem from an approximation point of view, showing both a lower bound and a matching upper bound. We also investigate the case when the number of communities is constant and show how to solve the problem with a constant approximation factor.\nMoreover, we consider the problem of maximizing the number of satisfied groups, given a budget $k$ on the number of rounds."
  image: /assets/img/seminars/13226-0c4ccbe509.jpg
- date: 24/03/2023
  time: 14:00 - 15:00
  venue: ''
  title: 'Seminario: &#8220;Combining Agent-based Model and Discrete Event Simulation: the approach of Hybrid Simulation Modeling&#8221; di Giuseppe D&#8217;Ambrosio'
  speakers:
  - '9'
  description: "Agent-Based Modeling (ABM) and Discrete Event Simulation (DES) are two of the most common simulation approaches, and are supported by many simulation tools. Recently, modelers have begun integrating these methods to simulate real-world situations which have some elements better represented by DES and others better represented by ABM. Hybrid ABM and DES simulation is a growing trend but there is a lack of simulation software supporting it, and effectively no open-source software at all. The seminar will introduce the concept of Hybrid Simulation, focusing on the combination of ABM and DES simulation methodologies to realize more accurate and powerful models."
  image: /assets/img/seminars/13220-3bd6a7b41e.png
- date: 17/03/2023
  time: 16:00 - 17:00
