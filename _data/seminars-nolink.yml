  title: 'Seminario: &#8220;Lexical Search Engine: REST API con interfaccia con ricerche lessicali basata su Knowledge Graph&#8221; di Crescenzo Mazzone'
  speakers:
  - '9'
  description: "\nSpesso ci ritroviamo a dover riflettere su modi alternativi per riferirci a una parola o abbiamo bisogno di eseguire ricerche lessicali più complesse, come analizzare le analogie di un termine, le gerarchie in cui è coinvolto. Ad esempio, durante una ricerca potremmo voler verificare se usando sinonimi di un termine riusciamo a recuperare più risultati rispetto alla ricerca iniziale. Per i bambini e scrittori, fantasticare sulle parole può essere di ispirazione per raccontare una storia.\nQuesti scenari hanno in comune l'esigenza di eseguire ricerche lessicali su una sorgente dati. Nel mio lavoro di tesi mi sono concentrato sull'impiego di Knowledge Graph (lessicali) per l'individuazione di sinonimi, analogie, gerarchie di termini, traduzioni partendo da una parola di interesse. In questo seminario vi presenterò il contesto in cui si posiziona il mio lavoro:la ricerca di knowledge graph adatti allo scopo, i problemi ad essi collegati, l'API progettata e un'interfaccia utile per l'ispezione e il confronto di sorgenti diverse e i possibili sviluppi futuri.\n\nIl collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale # seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:"
