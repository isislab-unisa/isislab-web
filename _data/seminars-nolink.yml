  description: "\"Type 3 self-driving cars are partially autonomous vehicles which can control themselves for most of the time and may ask the driver to take back control in case of specific situations. Currently, it is not safe to test this type of vehicle in a real environment, and a simulation must be used. The purpose of this seminar is to show my thesis work done in the field of autonomous vehicles. A prototype was designed, participants were collected and the results merged to assess how much the drivers believed the simulated situation to be risky.\"\n\nIl seminario si svolgerà in modalità telematica sul canale vocale #seminars di Discord .\n\nIl collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale # seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:\n\nISISLab Seminars in Discord"
