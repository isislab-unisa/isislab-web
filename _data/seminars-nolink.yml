  title: Seminario &#8220;Once Erasmus Always Erasmus &#8211; Storia di un avventura tra i ghiacci (o quasi)&#8221; di Simone Petrosino
  speakers:
  - '9'
  description: "\"In questo seminario parlerò della mia esperienza in Svezia durante la quale ho sviluppato la tesi in serious games \"About mood: How a negative mood in a videogame can influence our behavior\", nella quale esploro la reale possibiltà di utilizzare uno stato d'animo negativo (negative mood) per provocare un cambiamento di opinione e/o sensibilizzare riguardo ad un argomento attraverso il medium del videogame.\n\nPer raggiungere l'obiettivo prefissato è stato necessario approndire alcuni aspetti del campo della psicologia e, successivamente sviluppare un gioco attraverso il quale raccogliere i dati che sono poi stati analizzati. L'approccio utilizzato è stato doppio: qualitativo e quantitativo. In entrambi gli approcci sono stati utilizzati dei questionari sviluppati al fine di \"catturare\" il mood e le intenzioni del giocatore nel modo più preciso e veritiero possibile. I risultati ottenuti mostrano, in disaccordo con il credo comune, che un mood negativo indotto da un videogame può incrementare la consapevolezza e l' intenzione di cambiamento.\n\nInfine, dedicherò qualche attimo per raccontare quali sono i motivi per cui non bisogna rinunciare ad un esperienza Erasmus.\""
  image: /assets/img/seminars/default.png
- date: 29/11/2019
  time: 15:00 - 16:00
