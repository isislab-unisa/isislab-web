  description: "\n\nLe Decentralized Apps (dApps) sono applicazioni che offrono servizi e/o funzionalità basando la loro architettura su sistemi distribuiti in esecuzione su reti peer-to-peer, che spesso possono integrare sistemi di blockchain come Ethereum o Bitcoin.\nI motivi per i quali adoperare una simile tecnologia sono molteplici, come ad esempio la totale assenza di censura o l'impossibilità del controllo centralizzato. L'obiettivo di questo seminario è mostrare lo stato dell'arte delle tecnologie disponibili per lo sviluppo di tali tipologie di applicazioni.\n\nIl collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale # seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:\n\nISISLab Seminars in Discord"
