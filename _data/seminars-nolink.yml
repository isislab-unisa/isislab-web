  title: 'Seminario: &#8220;Trace Me Now: An open-source framework for indoor localization&#8221; of Mauro Borrazzo'
  speakers:
  - '9'
  description: "Location service is one of the primary services in smart automated systems of the Internet of Things. For various location-based services, accurate localization has become a key issue. Hence, an increasing number of real-world scenarios require such technologies and techniques, leading IoT-based indoor localization to become an all-too-real challenge. In fact, IoT-based localization and indoor localization are still under study, and the most recent literature proposes a large variety of technologies and techniques in order to achieve that. Nevertheless, there is no standard proposed yet, neither regarding technologies nor with regard to techniques for indoor localization. Trace Me Now tries to combine some of the most used technologies and techniques in a framework for letting developers easily exploit them to build their own location-based systems. This seminar will introduce what Trace Me Now is, how it is made, how it works, and which are the future developments and open issues.\n\nIl collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale # seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:\n\nISISLab Seminars in Discord"
