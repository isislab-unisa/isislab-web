  title: Le opportunità dell&#8217;ecosistema openstreetmap di Maurizio Napolitano,  coordinatore dell&#8217;unità Digital Commons Lab del centro ICT della Fondazione Bruno Kessler di Trento
  speakers:
  - '9'
  description: "\nOpenStreetMap è un progetto nato 15 anni fa con lo scopo di creare una\nbanca dati collaborativa georeferenziata dell'interno pianeta. Attualmente sono oltre 5 milioni le persone che hanno donato parte del loro tempo in questa attività. Questa banca dati è rilasciata con una licenza open data che ne permette di conseguenza il riuso in diversi scenari.Il progetto ha attratto nel tempo grandi aziende come Facebook, Apple e Microsoft, organizzazzione non governative, pubbliche amministrazioni, università e centro di ricerca.\nIl seminario avrà lo scopo di introdurre il progetto vedendolo da diversi punti di vista (tecnico, sociale, economico, legale …) facendo particolare attenzione a come il mondo della ricerca può farne uso attraverso i dati o analizzando la comunità."
