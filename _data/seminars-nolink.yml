  title: '&#8220;FLY Graph&#8221; di Simone Bisogno'
  speakers:
  - '9'
  description: "Home page di Simone Bisogno.\n\nAbstract : \"Nel calcolo scientifico, spesso si trattano problemi di formulazione semplice ma di taglia considerevole che non possono essere risolti facendo ricorso ad un singolo computer; in tali casi si può fare ricorso al cloud computing, dove il provider fornisce un sistema distribuito facilmente scalabile. Una particolare classe di problemi riguarda lo studio di reti: una rete è la rappresentazione di relazioni tra oggetti. Particolare rilevanza ricoprono i problemi basati su reti in cui le relazioni possono essere instaurate in maniera casuale con un certo grado di probabilità (reti \"sociali\"). In tutti questi problemi, le reti vengono modellate matematicamente tramite grafi. FLY è un linguaggio domain-specific per il calcolo scientifico in ambiente multi-cloud, basato sui linguaggi Java, Python e JavaScript; tramite la FLY Graph API, è possibile sfruttare le peculiarità di questo linguaggio per risolvere problemi su reti. In questo seminario sarà trattata la finalizzazione dell'integrazione della FLY Graph API all'interno di FLY e di com'è possibile impiegarla per la risoluzione di problemi su reti.\"\n\nIl seminario si svolgerà in modalità telematica sul canale vocale #seminars di Discord .\n\nIl collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale # seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:\n\nISISLab Seminars in Discord"
