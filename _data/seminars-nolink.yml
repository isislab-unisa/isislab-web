  title: 'Seminario: &#8220;Rust-AB: refactoring &#038; optimizations&#8221; di Pasquale Caramante e Francesco Foglia'
  speakers:
  - '9'
  description: "Rust-AB è un framework per lo sviluppo di simulazioni basate su agenti scritto in Rust e sviluppato dal nostro laboratorio ISISLab. Rust-AB ha subito profondi cambiamenti negli ultimi mesi per poter offrire una esperienza di sviluppo più semplice e completa. In questo seminario parleremo dell'attività di refactoring e ottimizzazione di varie componenti critiche di Rust-AB. Ad esempio il cambio del motore grafico da Amethyst a Bevy engine, nuove simulazioni, nuove funzionalità al sottosistema di visualizzazione, la gestione della schedulazione dinamica e cambiamenti trasversali come la creazione di una landing page ufficiale, assieme ad una analisi sulle performance delle varie componenti di Rust-AB.\n\nIl collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale # seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:\n\nISISLab Seminars in Discord"
