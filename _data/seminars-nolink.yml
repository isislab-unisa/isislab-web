  time: 13:00 - 14:00
  venue: ''
  title: '&#8220;A survey on open-source collaboration platforms&#8221; di Tiziano Citro'
  speakers:
  - '9'
  description: "\nCollaboration platforms empower teams to discuss, brainstorm and work together with immediate feedback regardless of location. The purpose of collaboration platforms is to integrate social networking capabilities into work processes, which can help raise productivity. We will present a survey on open-source modern collaboration platforms, discuss which one we picked among them and why, and provide a sample of how to extend the features of such a platform."
