  speakers:
  - '9'
  description: "Graphics Processing Units (GPUs) have rapidly evolved from fixed-function graphics engines to general-purpose parallel computing platforms, powering a broad spectrum of applications, from AI and scientific computing to embedded systems. Their high performance-per-watt has made them central to modern computing, including their adoption in 8 of the world’s top 10 supercomputers. Yet, GPUs continue to face challenges related to high power consumption and reduced energy efficiency under low utilization, critical hurdles on the path to sustainable and exascale computing.\n\nIn this talk, I will explore key architectural bottlenecks that limit GPU efficiency and briefly present architectural techniques (targeting the memory hierarchy) we have developed to address them. I will also highlight simulation and benchmarking tools from our group for modeling power and emerging features in NVIDIA Hopper and Blackwell architectures. The talk will conclude with an overview of our ongoing projects, such as LEAP (Locality-Driven High-Performance, Energy-Efficient GPUs) and ScaleHPC (Scalability Prediction for HPC Systems), both aimed at advancing sustainable GPU computing.\n\nShort Bio : Dr. Sohan Lal is a computer architecture researcher with a particular focus on GPU and heterogeneous architectures. He has led the Massively Parallel Systems (MPS) research group as a Junior Professor at TU Hamburg for four years and previously worked as a postdoctoral researcher at TU Berlin, where he also earned his Ph.D. in 2019.\n\nDr. Lal's research has been published in top-tier venues such as IPDPS, Euro-Par, DATE, HPEC, ICCD, and IJPP, including two papers that received Best Paper and Best Poster Awards. He has successfully secured competitive third-party funding from DFG, BMBF, and ECIU."
  image: /assets/img/seminars/50493-2c9805910e.png
- date: 24/07/2025
  time: 14:00 - 15:00
  venue: ''
  title: 'Seminars:&#8221;SYgraph: A Portable Heterogeneous Graph Analytics Framework for GPUs&#8221; by Antonio De Caro &#8211; &#8220;Phase-based Frequency Scaling for Energy-efficient Heterogeneous Computing by Lorenzo Carpentieri'
  speakers:
  - '9'
  description: "Speaker : Antonio De Caro\n\nTitle : SYgraph: A Portable Heterogeneous Graph Analytics Framework for GPUs\n\nAbstract: Graph analytics play a crucial role in a wide range of fields, including social network analysis, bioinformatics, and scientific computing, due to their ability to model and explore complex relationships. However, optimizing graph algorithms is inherently difficult due to their memory-bound constraints, often resulting in poor performance on modern massively parallel hardware. In addition, most state-of-the-art implementations are designed in CUDA for NVIDIA GPUs, and thus they can not run on supercomputers equipped with AMD and Intel GPUs.\nTo address these challenges, we propose SYgraph, a portable heterogeneous graph analytics framework written in SYCL.\nSYgraph provides an efficient two-layer bitmap data layout optimized for GPU memory, eliminates the need for pre- or post-processing steps, and abstracts the complexity of working with diverse target platforms.\nExperimental results demonstrate that SYgraph delivers competitive performance against state-of-the-art frameworks on datasets with up to 21 million nodes and 530 million edges on NVIDIA GPUs while being able to target any SYCL-supported device, such as AMD and Intel GPUs.\nSpeaker: Lorenzo Carpentieri\n\nTitle :\nPhase-based Frequency Scaling for Energy-efficient Heterogeneous Computing\n\nAbstract:\nEnergy efficiency has been a major challenge for exascale computing. Frequency scaling is a powerful technique to achieve energy savings in modern heterogeneous systems, and can be applied either at a coarse granularity, by application, or at a fine granularity, by setting the frequency for each computational kernel.\nThe chosen granularity significantly impacts the performance and energy consumption of applications due to frequency-change overhead.\n\nWe propose a novel phase-based method that minimizes the frequency-change overhead and improves performance and energy efficiency on heterogeneous multi-GPU systems.\nOur approach detects different phases through application profiling and DAG analysis, and sets an optimal frequency for each phase.\nOur methodology also considers MPI programs, where the overhead can be hidden by overlapping frequency-change with communication.\nExperimental results show up to 37% energy saving and 1.87x speedup for various benchmarks on a single GPU, and 68% energy saving and 3.63 x speedup on two multi-GPU applications."
  image: /assets/img/seminars/50474-fbe4341247.png
- date: 22/07/2025
  time: 12:00 - 13:00
  venue: Laboratorio ISISLaboratorio ISISLab, Dipartimento di Informatica, Università di Salerno (Edificio F, Stecca 7, Lab. 10, II piano) &#8211; Via Giovanni Paolo II, 132, 84084 Fisciano (SA)
  title: 'Seminario: Presentazioni dei lavori di Tesi di  Valerio Di Pasquale, Dario De MAio ed Angelo Alberico'
  speakers:
  - '9'
  description: "Hypergraph Discrete Denoising DIffusion Probabilistic Models for Real-World Network Generation di Valerio Di Pasquale\n\n• Abstract:\n\nGli ipergrafi sono una generalizzazione dei grafi che estendono il concetto di relazione binaria permettendo la definizione di relazioni che collegano un numero arbitrario di nodi, rendendo tale struttura particolarmente adatta a modellare sistemi complessi nei quali sono naturalmente presenti relazioni multiple. Così come per i grafi, l'uso di modelli generativi per ipergrafi, hanno lo scopo di sintetizzare sistemi reali, simulando i complessi meccanismi che regolano la formazione di nuove relazioni. Questi modelli generativi, abilitano la risoluzione di diversi task, come l'anomaly detection, la link prediction, la creazione di dati sintetici e la simulazione dell'evoluzione dei sistemi. Tuttavia, mentre gli approcci basati su deep learning rimangono ancora poco esplorati, la maggior parte dei metodi generativi esistenti si basa su metodi algoritmici che mirano a riprodurre determinate caratteristiche strtturali delle reti. Vista la recente crescita e rivoluzione di approcci generativi nel campo della generazione di testo e immagini, questo scenario offre una opportunità significativa di avanzamento anche della generazione di ipergrafi. In questo lavoro di tesi viene introdotto un modello generativo per ipergrafi basato su Discrete Denoising Diffusion Probabilistic Models.\n\nHyperlink Prediction in Hypergraphs with nodes and edges textual representation di Dario De Maio\n\n• Abstract:\n\nNegli ultimi anni, gli ipergrafi si sono affermati come uno strumento per modellare relazioni che coinvolgono un numero arbitrario di nodi, offrendo nuove opportunità per lo studio dei sistemi complessi. Uno dei problemi maggiormente affrontati in questo campo è stato quello della predizione di relazioni tra nodi (hyperlink prediction), tramite l'utilizzo delle loro rappresentazioni strutturali.\n\nInoltre, in letteratura sono stati proposti approcci che integrano informazioni aggiuntive oltre a quelle strutturali, come descrizioni testuali relative ai nodi, per migliorarne la rappresentazione e, di conseguenza, le capacità dei modelli di classificazione nel task di hyperlink prediction. Tali approcci, però, si concentrano esclusivamente sui nodi, trascurando eventuali informazioni testuali associate agli archi.\n\nIn questo lavoro di tesi si presenta un modello in grado di utilizzare sia informazioni testuali sui nodi che sugli iperarchi, al fine di costruire rappresentazioni più complete e potenziare la capacità predittiva nei task di hyperlink prediction.\nUn ulteriore ostacolo che limita l'utilizzo di un tale modello è rappresentato dalla scarsa disponibilità di dataset che contengano descrizioni testuali anche per gli archi; in letteratura, infatti, sono disponibili quasi esclusivamente dati relativi ai nodi. Un secondo contributo di questo lavoro è stato quindi quello di estendere alcuni dataset esistenti, arricchendoli con informazioni descrittive sugli archi. A tal fine, è stato utilizzato un nuovo approccio basato sull'impiego dei Large Language Model, che consentono di generare facilmente descrizioni testuali aggiuntive a partire dalle informazioni già presenti.\n\nInfine, per valutare l'impatto delle informazioni testuali, è stato condotto un ablation study mirato, che ha permesso di quantificare il contributo delle diverse tipologie di feature sulla qualità della predizione.\n\nMeteo su misura: una piattaforma Cloud-Native per l’esecuzione di modelli di previsione meteorologica locale ad alta risoluzione di Alberto Alberico\n\n• Abstract:\n\nIn questo seminario verrà presentato Meteo su Misura, un’infrastruttura che, integrando il Global Forecast System (GFS) e il modello Weather Research and Forecasting (WRF), automatizza l’intero flusso operativo necessario per ottenere modelli di previsioni meteorologiche locali ad alta risoluzione. La piattaforma consente la visualizzazione delle previsioni attraverso un’interfaccia web interattiva ed è stata utilizzata per generare una previsione ad alta risoluzione relativa al Golfo di Salerno"
