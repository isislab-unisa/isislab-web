  description: "L'obiettivo di questa tesi è la progettazione e l'implementazione di una libreria software per la manipolazione e l'analisi di ipergrafi, con particolare attenzione alla scalabilità e all'efficienza. Il lavoro presentato tenta di migliorare l'efficienza e le performance di HyperGraphX, una nota libreria per la manipolazione di ipergrafi, implementando un backend in Rust, un linguaggio noto per caratteristiche innovative, ad esempio la gestione sicura della memoria. L'interfaccia originaria di hypergraphx è stata mantenuta, consentendo agli utenti di continuare a utilizzare la libreria in Python senza modifiche significative al codice preesistente."
