  title: 'Seminario: &#8220;Architettura a microservizi per l’interfacciamento di assistenti virtuali con capacità di sintesi vocale declinate all&#8217;elaborazione del linguaggio naturale (NLP)&#8221; di Mario Offertucci e Antonio Donnarumma'
  speakers:
  - '9'
  description: "Abstract Il lavoro di tesi proposto è basato sullo studio di architetture a microservizi nell’ambito di chatbot (o assistente virtuale) incentrati sulla tematica del covid-19. Lo scopo di questo lavoro è quello di fornire rapidamente risposte a principali quesiti riguardanti il virus tramite l’utilizzo dell’intelligenza artificiale ( IA ) utile nella comprensione dell’intento (il contesto della domanda). Particolare attenzione è stata prestata ad utenti afflitti da disabilità visive attraverso l’implementazione di un ulteriore microservizio che, facendo uso di tecniche di text-to-speech e speech-to-text, permette la conversione di file audio in testo e viceversa. L’applicazione è inserita all’interno di un’architettura a microservizi e fa uso di servizi come API gateway (realizzato attraverso la libreria Netflix ZUUL), service discovery (con la libreria Netflix Eureka), chatbot open source (RASA), librerie text-to-speech e speech-to-text, si interfaccia con semplici WebChat, utilizza il protocollo OAuth2 per l’autenticazione ed è tollerante ai malfunzionamenti grazia alla libreria Netflix Hystrix. Il centro dell’applicazione è il microservizio Iside, il cui nome è ispirato alla divinità egizia della saggezza, che si occupa di interfacciarsi con l’intelligenza artificiale ed eventualmente effettuare la conversione in text-to-speech o in speech-to-text a seconda delle richieste ricevute, utilizzando un altro microservizio. Implementazioni future prevedono l’utilizzo di questa architettura in diversi contesti realizzando più intelligenze artificiali, motivo per cui l’architettura è pensata per essere successivamente adattabile in diversi ambiti aggiungendo altre IA aggiornando l’interfaccia di Iside.\n\nIl collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale # seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:\n\nISISLab Seminars in Discord"
