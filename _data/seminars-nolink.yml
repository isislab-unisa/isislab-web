  title: 'Seminario: &#8220;Analisi di segnali vocali per la classificazione di soggetti patologici tramite estrazione di feature acustiche e modelli di Machine Learning con openSMILE&#8221; di Roberto Giuseppe Scarpae Marco Renella'
  speakers:
  - '9'
  description: "Il presente lavoro di tirocinio si inserisce nell’ambito dell’analisi automatica del segnale vocale con l’obiettivo di individuare differenze acustiche significative tra soggetti appartenenti a gruppi di controllo e soggetti pazienti.\nA partire da registrazioni audio grezze, è stato sviluppato un flusso di elaborazione comprendente la pulizia dei segnali tramite audiocleaner.ai, l’estrazione delle feature acustiche mediante OpenSMILE (set eGeMAPS) e la definizione di feature personalizzate derivate da parametri di fonazione, pause e variazioni spettrali.\nI dataset risultanti sono stati integrati e bilanciati mediante la tecnica SMOTE, per mitigare lo squilibrio tra le classi prima della fase di addestramento. Il modello di classificazione scelto è un Random Forest Classifier, selezionato per la sua robustezza, interpretabilità e capacità di gestire feature eterogenee.\nLe valutazioni sperimentali, effettuate tramite balanced accuracy e metriche derivate dal classification report, hanno evidenziato una capacità del modello di distinguere le due classi con un’accuratezza bilanciata pari al 72%.\nIl sistema proposto costituisce una base solida per ulteriori sviluppi orientati al miglioramento delle prestazioni predittive e all’identificazione di marcatori vocali potenzialmente utili per il supporto alla diagnosi e al monitoraggio clinico."
