  title: 'Seminar by Giovanni De Pierro: &#8220;SYrtos: Extending SYCL for Real-Time Programming&#8221;'
  speakers:
  - '9'
  description: "\nReal-time systems often execute workloads with quite different timing requirements, from highly reactive events to tasks with looser constraints. Addressing this heterogeneity within modern heterogeneous programming models remains challenging. This work presents SYrtos, an extension of the SYCL standard designed to support real-time applications. SYrtos enhances the SYCL execution model by allowing developers to assign priorities to queues and kernels and to specify explicit deadlines for individual kernel executions. Combined with support for task preemption, these features enable multiple applications to be co-scheduled on the same hardware while still meeting temporal constraints. The SYrtos specification is designed to be portable across a wide range of platforms. It can be implemented on resource-constrained microcontrollers running real-time operating systems, as well as on more powerful Linux-based systems, thus enabling true application portability across the entire embedded computing spectrum."
