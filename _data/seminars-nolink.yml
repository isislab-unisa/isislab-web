  venue: Laboratorio ISISLab, Dipartimento di Informatica, Università di Salerno (Edificio F, Lab. 10, II piano), Via Giovanni Paolo II, 132, 84084 Fisciano SA, Fisciano
  title: 'Seminario: &#8220;DBaaS in FLY &#8211; Integrazione di sorgenti dati esterne&#8221; di Giuseppe D&#8217;Ambrosio'
  speakers:
  - '9'
  description: "\"Il cloud computing è ampiamente riconosciuto come un paradigma per il calcolo distribuito su cui si baseranno la prossima generazione di applicazioni che necessitano un'alta scalabilità. L'introduzione del modello di servizio Function as a Service (FaaS) da parte dei vari cloud provider, permette di gestire la logica delle applicazioni con funzioni indipendenti consentendo di sfruttare a pieno la potenza computazionale offerta dall'infrastruttura cloud.La maggior parte delle applicazioni necessita di lavorare con sorgenti dati esterne, solitamente database, verrà quindi introdotto il modello di servizio su Cloud Database As a Service (DBaaS) che permette di gestire e utilizzare database eliminando la necessità di configurare e gestire l'infrastruttura necessaria ad eseguirlo. Introdurremo FLY, un Domain Specific Language (DSL) per la progettazione, lo sviluppo e l'esecuzione di applicazioni di calcolo scientifico che sfrutta il modello FaaS su diverse infrastrutture cloud, in particolare ci concentreremo sull'introduzione al suo interno della possibilità di interagire con sorgenti dati esterne sfruttando file dati o database sia locali che in esecuzione con servizi di tipo DBaaS.\"\n\nPagina web di Guseppe D'Ambrosio"
  image: /assets/img/seminars/default.png
- date: 06/02/2020
  time: 12:00 - 13:00
  venue: Laboratorio ISISLab, Via Giovanni Paolo II, 132, Fisciano (Salerno), 84084
  title: Seminario &#8220;Personal assistant per l&#8217;interrogazione di Wikidata&#8221; di Mario Santoro
  speakers:
  - '9'
  description: "Pagina Web di Mario Santoro\n\nAbstract :\n\nI Knowledge Graph (KG) contengono grandi volumi di informazioni interconnesse. Per interrogare i KG sono necessari linguaggi come SPARQL che si rivelano essere non alla portata di tutti. Nasce così la necessità di rendere accessibili questi dati anche per persone senza competenze tecniche in query language, in generale, e SPARQL, in particolare.\n\nTra i diversi approcci che semplificano l’interazione utente ci sono gli assistenti vocali (in particolare poniamo il focus su Alexa), molto popolari negli ultimi anni, che rappresentano un modo facile e intuitivo per l’interazione in linguaggio naturale e per l’erogazione di servizi di un’applicazione.\n\nIn questo seminario analizzeremo la versione finale dell' assistente personale, basato su alexa, per interrogare Wikidata.\n\nAnalizzeremo i pattern attualmente implementati, ponendo il focus sulla loro verbalizzazione.\n\nInoltre riporteremo la valutazione della skill effettuata stimando la copertura delle domande d un dataset per question-aswering su wikidata (QALD-9, contente 100 domande)."
  image: /assets/img/seminars/default.png
- date: 17/01/2020
  time: 16:00 - 17:00
  venue: Laboratorio ISISLab, Dipartimento di Informatica, Università di Salerno (Edificio F, Lab. 10, II piano), Via Giovanni Paolo II, 132, 84084 Fisciano SA, Fisciano
  title: 'Seminario: &#8220;Location based users interests profiling: Instagram social network case study&#8221; di Antonio Addeo'
  speakers:
  - '9'
  description: "Pagina web di Antonio Addeo\n\nAbstract : Il rapido sviluppo tecnologico degli anni recenti nell'ambito dei dispositivi mobile e delle telecomunicazioni ha comportato un passaggio di tendenza dello sviluppo di app dall'ambiente desktop a quello mobile. Con le app mobile gli utenti sono maggiormente propensi ad interagire con il mondo esterno; alla possibilità di scambiare messaggi con i propri amici e condividere foto si aggiunge quella di creare ed utilizzare informazioni geografiche. Oggigiorno agli utenti dei social network è consentito condividere la locazione corrente, opinioni riguardo luoghi ed eventi e altro ancora. L'analisi di dati contenenti informazioni spaziali, temporali e semantiche riguardo le attività degli utenti trova applicazione in campi quali i sistemi di raccomandazione context-aware e gli annunci group-oriented. Lo scopo di questo lavoro è quello di effettuare uno studio sulle preferenze e le attività degli utenti del social network Instagram. In questo seminario verrà illustrata la prima la parte del lavoro, inerente alla raccolta e all'analisi dei dati dalla piattaforma."
  image: /assets/img/seminars/default.png
- date: 14/01/2020
  time: 14:30 - 16:30
  venue: ''
  title: '&#8220;Systematic Literature Review: introduction, methods and tools&#8221; di V.Scarano'
  speakers:
  - '9'
  description: "A Systematic Literature Review (SLR) is “a means of evaluating and interpreting all available research relevant to a particular research or topic area or phenomenon of interest”, by the definition of Barbara Kitchenham. It offers the possibility to leverage on previous research in a structured way, with a clearly defined process, to obtain a clear drawing of the current \"state of the art\".\nThe method is useful in very different areas and fields, and in Computer Science (with all the subfields included) is particularly helpful, given the impressive speed of research in ICT.\nIn this quick course (2 hours) we will present, first, the objectives and the steps for an effective SLR (with particular emphasis on Computer Science) and present some tools that can be useful in managing bibliographies and support SLRs.\n\nNote : the seminar is meant for PhD students, or for master students working toward a research thesis that requires literature review, with a basic knowledge of academic publishing mechanisms, and LaTeX, but, of course, the seminar is open to everybody.\nThe seminar will be held in English, if foreign students are present, otherwise, in italian. Slides (in english) will be available for download"
