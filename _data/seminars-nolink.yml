  title: 'Seminario: &#8220;GraphQL nel Web Semantico&#8221; di Simone Auriemma'
  speakers:
  - '9'
  description: "SPARQL è il principale linguaggio di interrogazione per dati più noto nel web semantico e il suo utilizzo è chiave poichè consente di estrarre informazioni dai KG. Il principale svantaggio di questo linguaggio è la difficoltà di scrittura delle query unito, molto spesso, a response di grandi dimensioni rendendone l'utilizzo molto ostico per chi si affaccia per la prima volta su questo argomento. Così ci siamo chiesti: esistono alternative? Una possibilità potrebbe essere GraphQL, linguaggio di interrogazione dei grafi. In questo seminario vedremo come GraphQL è utilizzato nel web semantico."
  image: /assets/img/seminars/12743-0ac90a2b05.jpg
- date: 30/09/2022
  time: 13:00 - 14:00
  venue: Aula P6 (Edificio F3) &#8211; Dipartimento Informatica,  Via Giovanni Paolo II, 132, 84084 Fisciano SA
  title: 'Seminari di Kubernetes: un mondo da scoprire di Simone Auriemma e Sviluppo di un&#8217;applicazione web per il monitoraggio di simulazioni basate su agenti di Salvatore Sirica'
  speakers:
  - '9'
  description: "Kubernetes: un mondo da scoprire di Simone Auriemma\n\nAbstract -> Kubernetes, noto anche come K8s, è un sistema open source per automatizzare la distribuzione, il ridimensionamento e la gestione delle applicazioni containerizzate. In questo seminario parlerò della mia esperienza di tirocinio con Gate42 nel quale ho imparato a sviluppare un microservices su questa piattaforma utilizzando NodeJs, Docker, Typescript e Kubernetes.\n\nᐧ\n\nSviluppo di un'applicazione web per il monitoraggio di simulazioni basate su agenti di Salvatore Sirica\n\nAbstract : Le simulazioni basate su agenti sono uno degli strumenti più utilizzati per lo studio dei fenomeni del mondo reale. Esse consentono di modellare il comportamento e le dinamiche di sistemi complessi permettendo così di indagare sui vari aspetti che li caratterizzano. krABMaga è un framework per lo sviluppo di simulazioni basate su agenti scritto in Rust che garantisce alte prestazioni ed affidabilità. L'utilizzo delle caratteristiche peculiari del linguaggio di programmazione Rust permette a krABMaga di fornire alta efficienza senza rinunciare ad una buona usabilità. Il framework, infatti, offre varie funzionalità che permettono non solo di modellare ed eseguire una simulazione ad agenti ma anche di visualizzarla mediante un motore grafico e di raccoglierne i risultati in formati facili da analizzare. Tuttavia, il risultato finale di una simulazione spesso non è sufficiente a comprendere le dinamiche che caratterizzano il fenomeno sotto osservazione ma è necessario osservare durante l’esecuzione l’evoluzione del modello. In questo seminario verrà presentato un sistema di monitoraggio di simulazioni basate su agenti integrato in krABMaga. Il sistema consente di visualizzare in modo semplice ed efficace i dati della simulazione mediante un’applicazione web sviluppata con le più moderne tecnologie permettendo al modellatore di comprendere l’evoluzione del sistema e di effettuarne un’analisi più approfondita."
  image: /assets/img/seminars/12669-885c419a5b.png
- date: 23/09/2022
  time: 13:00 - 13:00
  venue: Aula P6 (Edificio F3) &#8211; Dipartimento Informatica,  Via Giovanni Paolo II, 132, 84084 Fisciano SA
  title: '&#8220;Dal monolite ai microservizi, l&#8217;evoluzione di Decanto&#8221; di Giovanni Prisco e Presentazioni per seduta di laurea di Lorenzo Fasolino e Mario Egidio'
  speakers:
  - '9'
  description: "Seminario: \"Dal monolite ai microservizi, l'evoluzione di Decanto\" di Giovanni Prisco\n\nAbstract : Le applicazioni che ogni giorno usiamo, comunicano con dei servizi web per ottenere dati e per manipolarli, sviluppare questi servizi non è per niente un compito complesso con tutti i framework e le tecnologie che si hanno a disposizione, cosa succede però nel momento in cui un'applicazione comincia a essere utilizzata da sempre più persone? Cosa bisogna fare per gestire questi carichi di richieste? Verrà mostrata l'evoluzione di Decanto, un'applicazione iOS per abbinare cibo e vino, si migliorerà la sua architettura affinché possa essere scalata orizzontalmente per poter meglio rispondere alle richieste dei suoi utenti e verranno valutati diversi approcci e tecnologie nel farlo.\n\nPresentazioni per la seduta di laurea\n\nCompanyAssistant: gestione della persistenza con un approccio multi-cloud di Mario Egidio\n\nAbstract : Il cloud computing è ormai un paradigma fondamentale e tra i modelli di servizi offerti è presente l’Infrastructure as a Service (IaaS) che può essere sfruttato per fornire servizi come il calcolo e lo storage senza la necessità di possedere l’infrastruttura fisica richiesta. Da questo nasce la piattaforma CompanyAssistant, uno strumento di supporto allo smart working capace di sfruttare il modello IaaS in maniera ottimale, garantendo facilità di utilizzo e integrazione con diversi cloud provider. Uno degli obiettivi di CompanyAssistant è offrire supporto al lavoro di gruppo, dove è fondamentale la condivisione delle informazioni in maniera rapida e semplice e altrettanto importante la messa in sicurezza di informazioni importanti garantendone la ridondanza.\n\nCompanyAssistant: gestione della computazione con un approccio multi-cloud di Lorenzo Fasolino\n\nAbstract : Oggi il cloud computing è un paradigma ampiamente utilizzato per le diverse attività che coinvolgono le Information Technologies, come la creazione di un’infrastruttura di calcolo, il deployment di un’applicazione o la creazione di un modello di intelligenza artificiale. CompanyAssistant è uno strumento che permette di sfruttare i servizi del cloud computing offerti come Infrastructure as a Service in maniera ottimale, garantendo facilità di utilizzo, flessibilità e integrazione con diversi cloud provider sfruttando il paradigma multicloud. Tra gli obiettivi di CompanyAssistant rientra la possibilità di creare macchine virtuali in cloud per agevolare il lavoro da remoto e fornire strumenti avanzati per la gestione degli utenti."
  image: /assets/img/seminars/12662-a5d95dd65b.png
- date: 16/09/2022
  time: 13:00 - 14:00
  venue: Aula P6 (Edificio F3) &#8211; Dipartimento Informatica,  Via Giovanni Paolo II, 132, 84084 Fisciano SA
  title: Seminari di Gabriele Tuozzo e Vincenzo Offertucci
  speakers:
  - '9'
  description: 'Analisi della qualità dei Knowledge Graph di Gabriele Tuozzo Abstract: Il crescente aumento della pubblicazione in rete dei Knowledge Graph ha fatto emergere la necessità di valutarli dal punto di vista della loro qualità, in modo che all’utente possa essere chiaro quale…'
  image: /assets/img/seminars/12644-86f335eb0c.png
- date: 09/09/2022
  time: 13:00 - 14:00
  venue: ''
  title: 'Seminario: &#8220;Valutazione della qualità dei Knowledge Graph&#8221; di Gabriele Tuozzo'
  speakers:
  - '9'
  description: "Data l’enorme quantità e eterogeneità di Knowledge Graph disponibili, è fondamentale analizzarne la qualità. È diventato quindi sempre più importante capire quale Knowledge Graph sia qualitativamente migliore di un altro ed il fitness for use dei dati nell’applicazione che li utilizza. In particolare, in questo seminario si parlerà dell’introduzione del calcolo del quality score all’interno dell’applicazione proposta, che permette di dare all’utente una percezione immediata della qualità del dataset attraverso la valutazione di un unico valore. Inoltre, sarà esplorata l’interfaccia web-based creata per la visualizzazione dei dati di qualità calcolati. Come caso d’uso, viene proposto l’analisi e il confronto di diverse versioni linguistiche di DBpedia. Infine, viene presentata un’analisi della qualità di tutti i 1.870 Knowledge Graph recuperati da LOD Cloud e DataHub. Infine, saranno presentati i diversi meccanismi di fruizione del servizio di analisi di qualità."
  image: /assets/img/seminars/12637-61bf19317f.png
- date: 28/07/2022
  time: 12:30 - 13:30
  venue: Aula F1, Edificio F2 &#8211;  Dipartimento di Informatica, Università di Salerno, Via Giovanni Paolo II, 132, Fisciano (Salerno), 84084
  title: Sviluppo di un&#8217;estensione di Snap! per l&#8217;interrogazione di Knowledge Graphs di Vincenzo Offertucci
  speakers:
  - '9'
  description: "\n\nUna delle limitazioni della diffusione dei Knowledge Graphs è il linguaggio SPARQL che risulta essere un po' complicato.\n\nPer tale motivo abbiamo deciso di sviluppare un’interfaccia Block-Based per l'interrogazione di Knowledge Graphs.\n\nIn questo seminario, dunque, vedremo quali sono gli obiettivi che ci hanno guidato nel suo sviluppo e quali funzionalità sono state individuate tramite un'analisi dei sistemi esistenti che abbiamo utilizzato come riferimento.\n\nInoltre faremo una breve panoramica di Snap!, che cos'è e come può essere esteso.\n\nInfine esamineremo lo stato del progetto, vedremo a che punto ci troviamo con l'implementazione delle funzionalità e ne analizzeremo le limitazioni."
  image: /assets/img/seminars/12631-1cf29f6630.png
- date: 21/07/2022
  time: 12:30 - 13:30
  venue: Aula F1, Edificio F2 &#8211;  Dipartimento di Informatica, Università di Salerno, Via Giovanni Paolo II, 132, Fisciano (Salerno), 84084
  title: 'Seminario: &#8220;ROUTE-TO-KUBERNETES: migrating ROUTE-TO-PA&#8217;s services to a highly-available and scalable cluster&#8221; di Davide Acanfora'
  speakers:
  - '9'
  description: "La containerizzazione è una nuova tecnica di virtualizzazione che consente di raggruppare un'applicazione e tutte le sue dipendenze in container efficienti, portatili e rapidi nel deploy. A differenza della virtualizzazione tradizionale, dove le macchine virtuali astraggono l'hardware fisico sottostante, la containerizzazione lavora a livelli superiori dello stack astraendo il sistema operativo. Tuttavia, specialmente in un'architettura basata su microservizi, si è soliti schierare numerosi container, anche su diversi nodi, aumentando di conseguenza la difficoltà di gestione dell'intero sistema. Nasce, così, la container orchestration che consente di automatizzare molte delle operazioni previste nel ciclo di vita dei container, quali: il deployment, lo scaling e il load balancing. In questo seminario analizzeremo Kubernetes, una delle piattaforme open source di container orchestration più utilizzate, con l'obiettivo principale di migrare i servizi del progetto ROUTE-TO-PA in un cluster altamente affidabile e scalabile."
  image: /assets/img/seminars/12622-e6ea3c7e1b.png
- date: 14/07/2022
  time: 12:45 - 13:45
  venue: Aula F1, Edificio F2 &#8211;  Dipartimento di Informatica, Università di Salerno, Via Giovanni Paolo II, 132, Fisciano (Salerno), 84084
  title: '&#8220;Using ontologies for multi-cloud applications: a literature review&#8221; di Davide Cosimo Riccio e &#8220;Log timeline: sviluppo di un componente web per la visualizzazione interattiva di event logs&#8221; di Nicola Franco'
  speakers:
  - '9'
  description: "Titolo : \"Using ontologies for multi-cloud applications: a literature review\" di Davide Cosimo Riccio\n\nAbstract: \"Il Cloud Computing è un paradigma ampiamente utilizzato che fornisce risorse virtualmente illimitate ad un prezzo vantaggioso. Tuttavia, uno dei grandi svantaggi del Cloud Computing è il così detto vendor lock-in: un'applicazione basata sui servizi di uno specifico Cloud provider difficilmente può essere migrata su un altro provider senza un notevole sforzo. Il Multi-Cloud nasce come paradigma volto a superare il vendor lock-in componendo nella stessa architettura servizi di Cloud provider differenti. L'utilizzo del Multi-Cloud introduce però una maggiore complessità di sviluppo dovuta alla mancanza di uniformità tra le funzionalità fornite dai servizi di Cloud Computing. Tale problematica può essere affrontata mediante l'utilizzo delle ontologie. In questo seminario, verrà descritta e analizzata la letteratura riguardante la descrizione dei servizi Cloud tramite ontologie, con particolare interesse alle soluzioni che abilitano all'interoperabilità in contesti Multi-Cloud.\"\n\npresentazione per la seduta di laurea\n\nTitolo : \"Log timeline: sviluppo di un componente web per la visualizzazione interattiva di event logs\" di Nicola Franco\n\nAbstract :\n\nNell’ambito delle reti e delle telecomunicazioni, gli event logs costituiscono una risorsa di base, in quanto racchiudono un record di eventi che aiutano a fornire le informazioni sul traffico e l’utilizzo della rete. Gli eventi possono includere tentativi di stabilire una comunicazione, una corretta o mancata creazione di una sessione, problemi di configurazione, risposte da sistemi remoti, errori di comunicazione e così via. Un event log archivia questi dati per il recupero da parte di esperti di sicurezza o sistemi automatizzati.\n\nIl mio lavoro di tesi ha contribuito alla realizzazione di un componente web denominato Log timeline che supporta la visualizzazione di event logs all’interno di una linea temporale in modalità interattiva. Si tratta di una datalet, un web component client-side per la rappresentazione di datasets, all’interno di un framework sviluppato nel laboratorio di ricerca ISISLab (Dip. Informatica) nell’ambito di ROUTE-TO-PA (Raising Open and User-friendly Transparency - Enabling Technologies fOr Public Administrations), un progetto europeo Horizon 2020 focalizzato sugli Open Data.\n\nLa Log timeline può essere utilizzata, così come tutte le altre datalet, all’interno della piattaforma sociale “SPOD” realizzata nel progetto sopracitato. In particolare, essa si aggiungerà all'insieme degli strumenti che saranno da supporto agli esperti di cybersecurity nel progetto ERASMUS+, COLTRANE(Collaborative Cybersecurity Awareness Learning) il quale mira a migliorare l'educazione alla sicurezza informatica introducendo concetti innovativi nel contesto dell'educazione alla consapevolezza e dell’apprendimento cooperativo supportato dalla tecnologia. Nell’ambito di questo progetto, la Log timeline potrà supportare i team della cybersecurity nella creazione di datasets in modalità cooperativa con osservazioni, annotazioni e la possibilità di aggiungere dei link per la risoluzione di problematiche analizzando i dati degli eventi."
  image: /assets/img/seminars/12616-12e758f098.png
- date: 07/07/2022
  time: 12:30 - 13:30
  venue: Aula F1, Edificio F2 &#8211;  Dipartimento di Informatica, Università di Salerno, Via Giovanni Paolo II, 132, Fisciano (Salerno), 84084
  title: '&#8220;Ubiquitous Serverless Computing Platform&#8221; di  Lucia Gaeta  e Gerardo Donnarumma'
  speakers:
  - '9'
  description: "-Abstract:\n\nL'edge computing è un approccio progettuale per ambienti IoT, che fornisce risorse IT come capacità di memorizzazione e potenza di calcolo il più vicino possibile ai dispositivi IoT per migliorarne latenza e prestazioni. Presenta però alcuni problemi come scarsa affidabilità e scalabilità, e risorse computazionali limitate. Questi problemi possono essere risolti con il Serverless Computing. L'idea proposta in questo seminario è quella di introdurre gli smartphone come risorsa di calcolo all'interno di un'architettura Edge basata su Serverless Computing, sfruttandone le capacità computazionali. L'obiettivo è di poter eseguire le funzioni Serverless compatibilmente su dispositivi IoT, classici server e gli smartphone mediante la tecnologia Web Assembly. In questo seminario tratteremo dello stato dell’arte riguardo l'utilizzo del Serverless Computing in architetture Edge, le soluzioni e le limitazioni esistenti. Verrà inoltre proposta la nostra soluzione basata sull'introduzione degli smartphone e l'esecuzione su WebAssembly."
  image: /assets/img/seminars/12610-b5caee7e19.png
- date: 23/06/2022
  time: 12:30 - 13:30
  venue: Aula F1, Edificio F2 &#8211;  Dipartimento di Informatica, Università di Salerno, Via Giovanni Paolo II, 132, Fisciano (Salerno), 84084
  title: 'Seminario: &#8220;Implementazione del paradigma di calcolo distribuito in krABMaga&#8221; di Andrea Tranquillo'
  speakers:
  - '9'
  description: "Abstract\n\nLe simulazioni basate su agenti sono uno degli strumenti più potenti per studiare i fenomeni del mondo reale. Esse permettono di creare modelli che replicano sistemi complessi e comprenderne i meccanismi alla base. krABMaga è un framework per lo sviluppo di simulazioni basati su agenti scritto in Rust che garantisce alte prestazioni e affidabilità. Le prestazioni sono una delle caratteristiche più importanti nel campo delle simulazioni, in quanto esse sono spesso particolarmente onerose, richiedendo una elevata quantità di tempo per essere eseguite. Il calcolo distribuito è uno dei paradigmi di computazione più utilizzati per ottenere maggiori prestazioni, garantendo al sistema alta scalabilità. In questo seminario presenteremo l'implementazione del paradigma di calcolo distribuito all'interno di krABMaga, partendo dalla gestione dell'ambiente di simulazione mediante la struttura K-D tree. Verranno analizzate le scelte progettuali fatte, la fase implementativa e le relative problematiche, concludendo con le idee attualmente in sviluppo."
  image: /assets/img/seminars/12589-b4666c7b7d.png
- date: 16/06/2022
  time: 12:30 - 13:30
  venue: Aula F1, Edificio F2 &#8211;  Dipartimento di Informatica, Università di Salerno, Via Giovanni Paolo II, 132, Fisciano (Salerno), 84084
  title: CompanyAssistant&#8221; di Lorenzo Fasolino e Mario Egidio
  speakers:
  - '9'
  description: "\"Abstract: CompanyAssistant è uno strumento che permette di sfruttare i servizi del cloud computing offerti come Infrastructure as a Service(IaaS) in maniera ottimale, garantendo facilità di utilizzo, flessibilità e integrazione con diversi Cloud provider sfruttando il paradigma multi-cloud. Questo strumento risulta particolarmente vantaggioso nell'ambito dello smart working in quanto evita che gli utenti di un'organizzazione debbano possedere computer performanti per poter lavorare da casa, permettendo la creazione di macchine virtuali adatte a diversi tipi di compiti. Uno degli obiettivi di CompanyAssistant è offrire supporto al lavoro di gruppo, dove è fondamentale la condivisione delle informazioni in maniera rapida e semplice e altrettanto importante la messa in sicurezza di informazioni importanti garantendone la ridondanza. In questo seminario verrà discussa l'integrazione con Google Cloud Platform delle funzionalità relative alla creazione di macchine virtuali, storage condiviso e la gestione dei dati in maniera persistente, inoltre verranno mostrate quali sono le principali differenze relative ai Cloud Provider supportati.\""
  image: /assets/img/seminars/12580-82aef9c29c.png
- date: 09/06/2022
  time: 12:30 - 13:30
  venue: Aula F1, Edificio F2 &#8211;  Dipartimento di Informatica, Università di Salerno, Via Giovanni Paolo II, 132, Fisciano (Salerno), 84084
  title: 'Seminario: &#8220;A Knowledge Graph Chatbot Generator&#8221; di Giovanni De Giorgio'
  speakers:
  - '9'
  description: "\n\nWeb Semantico, Linked Open Data e Knowledge Graph vengono frequentemente impiegati per consentire di modellare qualsiasi informazione in maniera tale che possa essere letta ed elaborata sia dall'uomo che dalla macchina senza alcun tipo di ambiguità.\n\nProprio questo rapporto uomo/macchina spinge ad integrare questi concetti all'interno dello sviluppo di chatbot, in cui l'utente fornisce una domanda e la macchina elabora la richiesta e ne fornisce una risposta.\n\nLo scopo del lavoro è quello di progettare un generatore di chatbot multipiattaforma che, interagendo con i Knowledge Graph attraverso query generate con tecniche di Natural Language Processing, cerchi di fornire una risposta quanto più corretta possibile all'utente.\n\nFocus di questo seminario sarà mostrare la seconda fase del progetto e introdurre lo sviluppo della terza."
  image: /assets/img/seminars/12574-6c36f46ffc.png
- date: 26/05/2022
  time: 13:00 - 14:00
  venue: Aula F1, Edificio F2 &#8211;  Dipartimento di Informatica, Università di Salerno, Via Giovanni Paolo II, 132, Fisciano (Salerno), 84084
  title: 'Seminario: &#8220;Analisi della qualità dei Knowledge Graph&#8221; di Gabriele Tuozzo'
  speakers:
  - '9'
  description: "\"Abstract: L’ampia diffusione dei Knowledge Graph degli ultimi anni ha\n\nfatto emergere la necessità di capire la qualità di questi ultimi per\n\npoter meglio comprendere qual è migliore di un altro o qual è quello\n\nche soddisfa le nostre esigenze. Sono state stabilite quindi delle\n\nmetriche standard per misurarne la qualità. Questo ha mostrato che nel\n\nweb dei dati la qualità dei Knowledge Graph è molto variabile a causa\n\ndella loro eterogeneità, sia in termini di dimensioni che in termini\n\ndi dati contenuti al loro interno. L’applicazione proposta permette di\n\neseguire in automatico il calcolo di queste metriche standard,\n\nriducendo al minimo l’iterazione con l’utente e utilizzando come base\n\ndi partenza per l’analisi i metadati associati al Knowledge Graph.\n\nFornisce poi in output il risultato dell’analisi, che ci permette di\n\navere una percezione immediata della loro qualità, con la possibilità\n\ndi poterli confrontare fra loro per capire quale può soddisfare le\n\nnostre esigenze.\""
  image: /assets/img/seminars/12561-d0f1a61c26.png
- date: 20/05/2022
  time: 15:00 - 16:00
  venue: Aula F1, Edificio F2 &#8211;  Dipartimento di Informatica, Università di Salerno, Via Giovanni Paolo II, 132, Fisciano (Salerno), 84084
  title: 'Seminario: “Log timeline: Versione 2.0” di Nicola Fernando Franco'
  speakers:
  - '9'
  description: "La log timeline è un componente web client-side che supporta gli esperti di cybersecurity favorendo lo scambio di informazioni in merito a una successione temporale di eventi contenuti nei dataset di log. Per un migliore utilizzo, sono stati aggiunti nuovi parametri e nuove funzionalità alla datalet e sono stati affrontati i problemi emersi dalla versione 1.0. Inoltre, la nuova versione della datalet sarà presentata con uno studio dei differenti formati di timestamps suddivisi in categorie."
  image: /assets/img/seminars/12549-025e05ae71.png
- date: 26/04/2022
  time: 14:30 - 15:30
  venue: ''
  title: '&#8220;Lexical Search Engine: ricerche lessicali basate su Knowledge Graph&#8221; di Crescenzo Mazzone'
  speakers:
  - '9'
  description: "I knowledge graph sono nati con lo scopo di modellare le informazioni presenti sul web secondo una struttura a grafo.\nVengono utilizzati negli ambiti più svariati, dalla ricerca nei motori di ricerca come Google o negli assistenti virtuali come Alexa, per modellare domini di interesse, per istruire modelli di machine learning e intelligenza artificiale.\nI knowledge graph possono essere utilizzati anche per effettuare ricerche lessicali e diversi knowledge graph sono stati definiti per questo preciso scopo. Quali sono i migliori? Questa è la domanda alla quale cercheremo di rispondere in questo seminario. Vedremo le risorse che possono essere interrogate per abilitare una ricerca lessicale, come le abbiamo valutate e confrontate sia da un punto di vista qualitativo che da un punto di vista di performance in termini di tempi di risposta, riportando sfide riscontrate e soluzioni adottate.\n\nIl collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale # seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:"
  image: /assets/img/seminars/12522-0528479ca6.png
- date: 08/04/2022
  time: 15:15 - 16:15
  venue: ''
  title: 'Seminario: &#8220;Logtimeline-datalet: timeline a supporto dell’analisi dei file di log&#8221; di Nicola Fernando Franco'
  speakers:
  - '9'
  description: "\"L’Analisi dei file di log può fornire snapshot sullo stato degli host e dei servizi, dando evidenza di eventuali comportamenti insoliti che potrebbero rivelarsi indizi di pericolo. La logtimeline-datalet è un componente web che supporta la log analysis e visualizza gli eventi che si verificano all’interno di una rete, registrati in event logs. Si tratta di una revisione e ottimizzazione della timeline-datalet, da introdurre nella piattaforma SPOD e riutilizzabile in qualsiasi altra web app. La logtimeline-datalet sarà di supporto agli esperti della cyberseurity del progetto Eramsus+, COLTRANE (Collaborative Cybersecurity Awareness Learning). Lo scopo del progetto COLTRANE è di migliorare l'educazione alla cybersecurity introducendo concetti innovativi nel contesto dell'educazione alla consapevolezza e all' apprendimento cooperativo supportato dalla tecnologia. Il collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale # seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:"
  image: /assets/img/seminars/12473-11c093c02e.png
- date: 18/03/2022
  time: 16:30 - 17:30
  venue: ''
  title: Seminari di  Daniele De Vinco e  Nicola De Cristofaro
  speakers:
  - '9'
  description: "Seminario 1) \"Esplorazione dei parametri in ambiente distribuito per simulazioni basate su agenti\" di Daniele De Vinco Abstract : La complessità delle simulazioni basate su agenti deriva dal fatto che anche piccoli cambiamenti dei parametri possono stravolgere il risultato finale. Il processo di esplorazione dei parametri consente di trovare le variabili di input del modello che permettono di ottenere il comportamento desiderato. Considerato che l’esplorazione dei parametri puo' richiedere tempi di esecuzione particolarmente elevati a causa del numero di combinazioni possibili da valutare, è stato utilizzato il paradigma della programmazione distribuita per ridurre tali tempi. In questo seminario verrà presentata l’esplorazione dei parametri di un modello di simulazione in ambiente distribuito all’interno di Rust-AB, framework per lo sviluppo di simulazioni basate su agenti che permette al modellatore di implementare in modo semplice ed efficace modelli di simulazione utilizzando il linguaggio Rust.\n\nSeminario 2) \"Introduzione dell'ambiente di esecuzione basato su cluster di macchine virtuali e integrazione delle strutture dati in FLY\" di Nicola De Cristofaro Abstract : Al fine di semplificare lo sviluppo di applicazioni di calcolo scientifico sfruttando un ambiente multi-cloud nasce il linguaggio FLY, un Domain-Specific Language che astrae l’utente dall’interazione con il provider, permettendo l’utilizzo dei servizi Cloud senza dover conoscere librerie e strumenti proprietari. Il principale ambiente di esecuzione sfruttato da FLY segue il modello Function-as-a-Service. Tuttavia, tale paradigma comprende una serie di svantaggi intriseci tra cui limiti nel tempo di esecuzione e nella memoria. Questo seminario presenterà il lavoro svolto al fine di superare questi limiti introducendo nel linguaggio FLY un ambiente di esecuzione basato sul modello Infrastructure-as-a-Service che sfrutta un cluster di macchine virtuali in esecuzione su Cloud. Verrà inoltre mostrato un caso d’uso per dimostrare la facilità di utilizzo di FLY e l’integrazione al suo interno delle strutture dati per matrici e vettori.\"\n\nIl collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale # seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:"
  image: /assets/img/seminars/default.png
- date: 25/02/2022
  time: 15:00 - 16:00
  venue: ''
  title: 'Seminario: Simulazioni ABM per Unity3D: Un framework collaborativo per l’adattabilità&#8221; di  Gerardo Barone, Lucio Grimaldi, Pietro Russo'
  speakers:
  - '9'
  description: "\n\"Le simulazioni Agent-based rappresentano uno strumento per la risoluzione di problemi in svariati contesti, dal design alla pianificazione e progettazione. In un contesto simile, la condivisione di queste simulazioni, in un ambiente collaborativo e interattivo, risulta essere particolarmente interessante. Il progetto consiste nel realizzare un ambiente con queste caratteristiche, sfruttando la libreria MASON e l'engine grafico Unity3D.\nIn questo seminario verrà esposto il lavoro realizzato durante il progetto, verranno motivate e discusse le soluzioni adottate per il suo sviluppo e i risultati ottenuti.\"\n\nIl collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale # seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:"
  image: /assets/img/seminars/12425-16f1fb8312.png
- date: 18/02/2022
  time: 15:00 - 16:00
  venue: ''
  title: Seminari di Luigi Gallo e Nicola De Cristofaro
  speakers:
  - '9'
  description: "Seminario 1) :\"Ottimizzazione di simulazioni basate ad agenti: Un caso d’uso su simulazioni epidemiche in linguaggio Julia\" di Luigi Gallo\n\nAbstract :\nLe simulazioni ci permettono di studiare il comportamento dinamico di sistemi complessi sotto varie ipotesi e di progettare le strutture, l’organizzazione e le procedure atte alla risoluzione del problema. Tuttavia, simulare un sistema complesso può essere computazionalmente costoso quindi una soluzione fattibile per ottenere tempi di simulazione migliori è sfruttare il calcolo para\nllelo e/o distribuito.\nIn particolare, in questo lavoro, vedremo come parallelizzazione una simulazione tramite il caso d’uso HGEpidemics.jl un framework che ci consente di effettuare simulazioni di diffusione epidemica basate ad agenti. Dopo il procedimento di parallelizzazione sono stati effettuati quattro esperimenti su quattro data set differenti e per ognuno di essi è stata effettuata sia una validazione dell’esperimento (per verificarne la corretta computazione), sia una valutazione in termini di performance. In particolare, il processo di validazione è avvenuto sia in maniera visiva sia in modo formale. Per la validazione formale è stata usata la metrica RMSD (root-mean-square deviation), mentre per quella visiva sono stati sfruttati i grafici dati in output dalla simulazione. Infine, per verificare l’efficacia dell’implementazione parallela, è stato preso come riferimento lo speedup (metrica che indica il l’aumento della velocità di esecuzione di un’attività eseguita su un numero differente di processori).\n\nSeminario 2) :\n\"Introduzione dell'ambiente di esecuzione basato su cluster di macchine virtuali e integrazione delle strutture dati in FLY\" di Nicola De Cristofaro\n\nAbstract:\nAl fine di semplificare lo sviluppo di applicazioni di calcolo scientifico sfruttando un ambiente multi-cloud nasce il linguaggio FLY, un Domain-Specific Language che astrae l’utente dall’interazione con il provider, permettendo l’utilizzo dei servizi Cloud senza dover conoscere librerie e strumenti proprietari.Il principale ambiente di esecuzione sfruttato da FLY segue il modello Function-as-a-Service. Tuttavia, tale paradigma comprende una serie di svantaggi intriseci tra cui limiti nel tempo di esecuzione e nella memoria.\nQuesto seminario presenterà il lavoro svolto al fine di superare questi limiti introducendo nel linguaggio FLY un ambiente di esecuzione basato sul modello Infrastructure-as-a-Service che sfrutta un cluster di macchine virtuali in esecuzione su Cloud. Verrà inoltre mostrato un caso d’uso per dimostrare la facilità di utilizzo di FLY e l’integrazione al suo interno delle strutture dati per matrici e vettori\n\nIl collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale # seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:"
  image: /assets/img/seminars/12421-13873bfe87.png
- date: 11/02/2022
  time: 15:00 - 16:00
  venue: ''
  title: 'Seminario: &#8220;Esplorazione dei parametri in ambiente distribuito per simulazione basate su agenti&#8221; di Daniele  De Vinco'
  speakers:
  - '9'
  description: "Un aspetto critico delle simulazione basate su agenti è che piccoli cambiamenti dei parametri possono causare stravolgimenti nel risultato finale. Di conseguenza, è necessario trovare i valori più efficaci che permettano di ottimizzare il comportamento del sistema. Ciò è possibile mediante tecniche di esplorazione di parametri. L'esplorazione dei parametri, tuttavia, può richiedere tempi di esecuzione molto elevati a causa della crescita esponenziale delle combinazioni di parametri. La programmazione distribuita è uno dei metodi più efficaci per ridurre tali tempi.\nRust-AB è un framework per lo sviluppo di simulazioni basate su agenti che vuole garantire alte prestazioni e affidabilità. In questo seminario verrà presentata l'implementazione dell'esplorazione di parametri in ambiente distribuito all'interno di Rust-AB utilizzando gli algoritmi genetici.\n\nIl collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale # seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:"
  image: /assets/img/seminars/12416-98e149c383.png
- date: 04/02/2022
  time: 08:00 - 17:00
  venue: ''
  title: 'Seminario:&#8221;Fly on the Web: usare un DSL tramite Web-IDE&#8221; di Antonio De Caro'
  speakers:
  - '9'
  description: "Fly è un Domain-Specific Language per il calcolo scientifico su multi-cloud con l'obbiettivo di permettere all'utente di sfruttare le risorse del cloud computing in modo semplice ed efficiente. Uno dei principali obiettivi di FLY è la facilità d'uso soprattutto per utenti con poca esperienza nell'ambito della programmazione software. Allo stato attuale però, Fly richiede una serie di diversi complessi passaggi per poter essere installato ed utilizzato. L'obbiettivo di questo seminario è quello di presentare il lavoro che ci ha permesso di rendere Fly utilizzabile ovunque con estrema semplicità, sfruttando le potenzialità di uno degli IDE più in voga come Visual Studio Code. Il collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale # seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:"
