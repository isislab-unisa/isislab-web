  title: '&#8220;Simulazione Basata su Agenti in Julia&#8221; di Nicola Amoriello'
  speakers:
  - '9'
  description: "a breve seguiranno dettagli del seminario.\n\nAbstract : In questo seminario verrà presentata la libreria ABM.jl scritta in Julia, la quale offre strumenti utili per l'implementazione di simulazioni basate su agenti. Inizialmente ci saranno cenni sulla disciplina della simulazione basata su agenti e sul linguaggio di programmazione Julia: a cosa servono; perché studiarli;quali sono i vantaggi, etc. Si proseguirà con l'esposizione della struttura e del codice del progetto ABM.jl, soffermandoci sui moduli chiave di questo. A seguire la presentazione verterà sul mio contributo al progetto: le simulazioni Ant Foraging e Boids da me sviluppate. In questa sezione parlerò della fase di sviluppo, mostrando parti significative del codice e di come sono stati strutturati i moduli, per poi passare allo studio delle prestazioni e al confronto di queste con i risultati dati da lavori analoghi. Per concludere verranno fatte eseguire le simulazioni a scopo dimostrativo e si discuterà su cosa ha funzionato e cosa no in questo lavoro e su come migliorarlo in futuro."
  image: /assets/img/seminars/default.png
- date: 11/09/2019
  time: 12:00 - 13:00
  venue: Laboratorio ISISLab, Dipartimento di Informatica, Università di Salerno (Edificio F, Lab. 10, II piano), Via Giovanni Paolo II, 132, 84084 Fisciano SA, Fisciano
  title: '&#8220;Outlier Detection&#8221; di Salvatore Santelia e &#8220;Syntactical errors detection and correction&#8221; Luca Postiglione'
  speakers:
  - '9'
  description: "Abstract del Seminario \"Syntactical errors detection and correction\" di Luca Postiglione:\n\nIl mio lavoro si occupa di progettare e implementare una libreria per individuare e correggere errori sintattici all'interno di collezioni di stringhe omogenee (es. Regioni, Province o Comuni) utilizzando tecniche di clustering.\n//Sono state portati avanti altre funzionalità, test e implementazioni rispetto allo scorso seminario, in base agli obiettivi individuati.\nAl fine di verificare l'indipendenza dell'approccio proposto dalla lingua italiana, sono stati condotti dei test su dataset europei di diverse nazioni (es. Francia e Paesi Bassi). In questo seminario riporterò i risultati ottenuti e le difficoltà riscontrate.\nAl fine di estendere la soluzione proposta di \"Error Detection\" presentata nello scorso seminario, presenterò la versione estesa del mio approccio, al fine di correggere errori sintattici.\nDa un punto di vista implementativo, discuterò dell'implementazione della libreria in Javascript/NodeJs e della progettazione in Fly.\n\nAbstract del Seminario \"Outlier Detection\" di Salvatore Santelia :\n\nNegli ultimi anni stiamo osservando una crescita vertiginosa degli open data. Ciò nonostante, non sempre la correttezza dei dati è garantita e\noffrire delle tecniche automatiche di individuazione di errori è di fondamentale importanza.\nIl mio lavoro si basa sull' outlier detection (o anomaly detection), ovvero l'individuazione di dati che divergono dal modello generale, soffermandomi\nnello specifico, sullo studio dell' outlier detection su numeri e date.\nDa un punto di vista tecnico, ho sfruttato tecniche di clustering e approcci statistici.\nIn questo seminario riporterò i risultati dei diversi approcci applicati a Open Data di diversa natura, ad esempio Views di YouTube, Inspection Scores, Altezza Onde.\nPer quanto concerne le date presenterò un possibile processo per distinguere outlier (intesi come valori erroneamente divergenti dagli altri) e natural outlier (valori divergenti dagli altri per loro natura) riportando un esempio di applicazione di questo processo sfruttando DBpedia."
  image: /assets/img/seminars/default.png
- date: 06/09/2019
  time: 15:00 - 16:00
  venue: Laboratorio ISISLab, Dipartimento di Informatica, Università di Salerno (Edificio F, Lab. 10, II piano), Via Giovanni Paolo II, 132, 84084 Fisciano SA, Fisciano
  title: '&#8220;Modelli di simulazione basati su agenti con Rust&#8221; di Daniele de Vinco e &#8220;Progettazione e implementazione del supporto a Microsoft Azure per il compilatore del linguaggio FLY&#8221; di Giuseppe Grieco'
  speakers:
  - '9'
  description: "\"Modelli di simulazione basati su agenti con Rust\" di Daniele de Vinco\n\nAbstract :\n\"Rust è un linguaggio di programmazione giovane, pensato per creare sistemi complessi affidabili, sicuri e ad alte prestazioni, combinando astrazioni di alto livello con funzionalità di basso livello, come il controllo della memoria.\nVerrà illustrata l’implementazione di un modello di simulazione basato su agenti con Rust, evidenziandone i punti di forza e le caratteristiche che lo differenziano da altri linguaggi e da altri modelli di simulazione come MASON.\"\n\nProgettazione e implementazione del supporto a Microsoft Azure per il compilatore del linguaggio FLY\" di Giuseppe Grieco\n\nAbstract :\n\nFLY è un Domain specific language per il calcolo scientifico che sfrutta il service model Function as a Service per fornire come ambiente di runtime un'infrastruttura cloud. Il lavoro di tesi esposto ha avuto come obiettivo quello d'integrare il supporto a Microsoft Azure per il compilatore del linguaggio FLY."
  image: /assets/img/seminars/default.png
- date: 04/09/2019
  time: 12:00 - 13:00
  venue: Laboratorio ISISLab, Dipartimento di Informatica, Università di Salerno (Edificio F, Lab. 10, II piano), Via Giovanni Paolo II, 132, 84084 Fisciano SA, Fisciano
  title: '&#8220;Design ed implementazione di una libreria JavaScript per la visualizzazione di ipergrafi&#8221; di Massimo Giordano e Vittorio Baldi'
  speakers:
  - '9'
  description: "Oggigiorno, molti sistemi complessi possono essere rappresentati attraverso l'utilizzo di ipergrafi, ad esempio: social networks, reti stradali ed email. L'obiettivo del nostro lavoro di tesi è quello di progettare ed implementare una libreria JavaScript per la visuaizzazione efficiente ed efficace di ipergrafi. In particolare, abbiamo sviluppato tre tipi di visualizzazioni: SetBased, GraphBased e Radal. Ognuna delle quali presenta aspetti positivi e negativi che verranno discussi ed approfonditi nel corso del seminario."
  image: /assets/img/seminars/default.png
- date: 22/07/2019
  time: 11:00 - 12:00
  venue: Laboratorio ISISLab, Dipartimento di Informatica, Università di Salerno (Edificio F, Lab. 10, II piano), Via Giovanni Paolo II, 132, 84084 Fisciano SA, Fisciano
  title: 'Seminario: &#8220;3rd ACM Summer School on Data Science&#8221; by Alessia Antelmi e Maria Angela Pellegrino'
  speakers:
  - '9'
  description: "Cosa mette insieme Mr Data Mining, esperti di gender e data bias, guru di data analysis e visualization? La ACM summer school ci è riuscita alla grande.\nIn questo seminario vi racconteremo la nostra esperienza durante la 3rd ACM European summer school on data science. Ci focalizzeremo sugli speaker conosciuti e sui temi trattati. Passeremo dall'analisi di reti a tecniche di data mining, analysis e visualization, toccando temi più che mai attuali come gender bias, privacy ed etica."
  image: /assets/img/seminars/default.png
- date: 19/07/2019
  time: 11:00 - 12:00
  venue: Sala Seminari del Dipartimento, II Piano, Edificio F, Dipartimento di Informatica, Università di Salerno
  title: 'Seminario: &#8220;Urban Data Science: from big data to models&#8221; di Luca Pappalardo, Università di Pisa'
  speakers:
  - '9'
  description: "The availability of big geo-spatial mobility data in the urban environment (e.g., GPS traces, mobile phone records, geo-tagged social media posts) is a trend that will grow in the near future. In particular, this will happen when the shift from traditional vehicles to autonomous, self-driving, vehicles, will transform our society, the economy and the environment. For this reason, understanding and modeling urban mobility is of paramount importance for many present and future applications such as traffic forecasting and urban planning, epidemic modeling, and the design of new generation wireless mobile networks. During the talk I will present both the fundamental modeling principles of human mobility and artificial intelligence models applicable to specific mobility-related problems. In particular, starting from the \"physical\" laws that govern human mobility, we see how they can be exploited to address fascinating problems in urban data science, such as the generation of realistic synthetic mobility trajectories, and the prediction of the future locations visited by individuals."
  image: /assets/img/seminars/default.png
- date: 17/07/2019
  time: 12:30 - 13:30
  venue: Laboratorio ISISLab, Dipartimento di Informatica, Università di Salerno (Edificio F, Lab. 10, II piano), Via Giovanni Paolo II, 132, 84084 Fisciano SA, Fisciano
  title: 'Seminario: &#8220;Debug mode on FLY using Localstack&#8221; di Giuseppe D&#8217;Ambrosio'
  speakers:
  - '9'
  description: "\"FLY è un Domain Specific Language per il calcolo scientifico su multi-cloud che fornisce un ambiente totalmente trasparente rispetto al provider fornitore dei servizi. Sviluppare un’applicazione è un processo che richiede diversi tentativi di esecuzione per riuscire a rendere il tutto funzionante. Quando si lavora in cloud ciò può risultare particolarmente costoso, vi è quindi la necessità di poter testare le proprie funzioni in un ambiente totalmente locale, che non dipenda dei servizi del cloud, ma che allo stesso tempo ne simuli fedelmente l’esecuzione.\nLo scopo di questo seminario è presentare un ambiente di test, per il linguaggio FLY, in cui è possibile eseguire funzioni simulando l'ambiente AWS su macchina locale, senza alcuna dipendenza dai servizi in cloud e senza nessun costo.\""
  image: /assets/img/seminars/default.png
- date: 12/07/2019
  time: 15:30 - 16:00
  venue: Laboratorio ISISLab, Dipartimento di Informatica, Università di Salerno (Edificio F, Lab. 10, II piano), Via Giovanni Paolo II, 132, 84084 Fisciano SA, Fisciano
  title: Seminario &#8221; Fly, un ambiente multicloud&#8221; di Giuseppe Grieco
  speakers:
  - '9'
  description: "Fly è un Domain Specific Language per il calcolo scientifico su multi-cloud. Nella sua versione \"iniziale\", prima del mio lavoro di tesi, FLY sfruttava perfettamente l'ambiente cloud AWS. Durante il mio tirocinio è stato integrato l'ambiente cloud Microsoft Azure in FLY al fine di mostrare le sue potenzialità multi-cloud.\nLo scopo di questo seminario è di analizzare le fasi di integrazione di Azure e valutare le performance delle singole piattaforme cloud (Azure vs AWS) e verificare i vantaggi derivanti dall'uso congiunto dei due ambienti cloud."
  image: /assets/img/seminars/default.png
- date: 12/07/2019
  time: 15:00 - 15:30
  venue: Laboratorio ISISLab, Dipartimento di Informatica, Università di Salerno (Edificio F,  Lab. 10, II piano), Via Giovanni Paolo II, 132, 84084 Fisciano SA Fisciano, Italy Italy, Fisciano, Salerno, 84084
  title: 'Seminario: &#8220;Agent Based Model Simulations in RUST&#8221; di Daniele De Vinco'
  speakers:
  - '9'
  description: "Descrivere il funzionamento o l’evoluzione di sistemi complessi è una sfida attuale che si sta affrontando in molti campi di ricerca. I modelli di simulazione basati su agenti mirano a simulare il comportamento di molteplici agenti, sotto determinate condizioni, relazioni ed interazioni, al fine di emulare o predire un determinato fenomeno. In questo seminario verrà mostrata AB-Rust, la libreria ispirata a MASON implementata con Rust."
  image: /assets/img/seminars/default.png
- date: 02/07/2019
  time: 10:00 - 11:00
  venue: Sala Seminari del Dipartimento, II Piano, Edificio F, Dipartimento di Informatica, Università di Salerno
  title: Human-AI Cognitive Symbiosis di Dr. Alessandra Sala, Analytics Research at Nokia Bell Labs
  speakers:
  - '9'
  description: "The era of a new definition of AI has arrived and it calls for a synergetic alliance of technologists, regulators and social-psychological scientists. Bell Labs is studying the limits of human cognition to define a new paradigm of Human-AI cognitive symbiosis which would amplify human intelligence at biological and cognitive levels. Exiting AI systems are still unable to amplify human capabilities into new cognitive levels. Our Augmented Human Cognition research program leverages the latest discoveries in physiological, neurological and psychological sciences along with our algorithmic AI knowledge to deeply inter-connect intelligent systems and human cognition to embark the ultimate human cognitive revolution. This talk will describe how new AI models for knowledge organization and presentation can improve critical decisions making, people general knowledge and more informed business strategies.\n\nShort Bio: Alessandra Sala is the Head of Analytics Research at Nokia Bell Labs, the Technology Advisory Board Member at CeADAR and the Irish Ambassador of Women in AI. She has more than 10 years of experience in research and innovation, both in academia and industry, specifically on advanced analytics, customer experience, AI-based automation of cloud applications and machine learning for networks orchestration. Her track record of transferring innovation from research into business units was awarded in 2017 as ITP Innovator of the Year. She has strong experience with a wide range of telco products and systems while managing diverse teams in multiple locations. Her research focus lies on distributed algorithms, data analytics and complexity analysis with an emphasis on graph algorithms and recently AI, machine learning and deep learning"
  image: /assets/img/seminars/2095-ff635c2ebe.png
- date: 01/07/2019
  time: 11:00 - 12:00
  venue: Sala Seminari del Dipartimento, II Piano, Edificio F, Dipartimento di Informatica, Università di Salerno
  title: '&#8220;Data Parallel Frameworks for Accelerating Machine Learning Algorithms&#8221;, Prof. Lixin Gao, University of Massachusetts at Amherst (USA)'
  speakers:
  - '9'
  description: "The advances in sensing, storage, and networking technology have created huge collections of high-volume, high-dimensional data. Making sense of these data is critical for companies and organizations to make better business decisions, and brings convenience to our daily life. Recent advances in data mining, machine learning, and applied statistics have led to a flurry of data analytic techniques that typically require an iterative refinement process. However, the massive amount of data involved and potentially numerous iterations required make performing data analytics in a timely manner challenging. In this talk, we present a series of data parallel frameworks that accelerate iterative machine learning algorithms for massive data.\n\nShort Bio: Lixin Gao is a University Distinguished Professor of Electrical and Computer Engineering at the University of Massachusetts at Amherst. She received a Ph.D. degree in Computer Science from the University of Massachusetts at Amherst. Her research interests include online social networks, and Internet routing, network virtualization and cloud computing. Between May 1999 and January 2000, she was a visiting researcher at AT&T Research Labs and DIMACS. She was an Alfred P. Sloan Fellow between 2003-2005 and received an NSF CAREER Award in 1999. She won the best paper award from IEEE INFOCOM 2010, and the test-of-time award in ACM SIGMETRICS 2010. Her paper in ACM Cloud Computing 2011 was honored with “Paper of Distinction”. She received the Chancellor’s Award for Outstanding Accomplishment in Research and Creative Activity in 2010, College of Engineering Outstanding Senior Faculty Award in 2013, and Outstanding Achievement in Research Award by College of Information and Computer Sciences at the University of Massachusetts in 2015. She is a fellow of IEEE and ACM."
  image: /assets/img/seminars/2089-93589cf3ac.png
