  title: 'Privacy literacy: studio e strumenti  di Luisa Cauteruccio'
  speakers:
  - '9'
  description: "\n\nIn questo seminario verrà affrontato il tema della privacy literacy. Verranno innanzitutto trattati il tema della privacy nel mondo attuale e la privacy dei dati che comunichiamo online o che vengono trattati dai dispositivi che utilizziamo quotidianamente o dagli accessi ai siti web o applicazioni. Verrà evidenziata l’importanza di proteggere tali informazioni ed i rischi che un individuo potrebbe subire in caso di una mancata protezione, con una relativa analisi per fasce di età. Sarà presentata una panoramica dei sistemi attualmente esistenti che si occupano della protezione dei dati, e di quelli che si occupano di insegnare come proteggere tali dati e tutelare gli utenti. Sarà infine proposta una idea di progettazione di una soluzione tecnologica volta a fornire strumenti per la privacy literacy."
