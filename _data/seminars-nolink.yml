  time: 12:00 - 13:00
  venue: Laboratorio ISISLab, Dipartimento di Informatica, Università di Salerno (Edificio F,  Lab. 10, II piano), Via Giovanni Paolo II, 132, 84084 Fisciano SA Fisciano, Italy Italy, Fisciano, Salerno, 84084
  title: '&#8220;Studio e Analisi di Ipergrafi in Julia&#8221; di Gilberto Recupito'
  speakers:
  - '9'
  description: "Gli ipergrafi permettono di modellare relazioni più complesse rispetto ai grafi, dei quali ne costituiscono una generalizzazione. Infatti, mentre un grafo è in grado di modellare relazioni binarie, un ipergrafo è capace di modellare relazioni tra un numero arbitrario di oggetti.\nData la crescente importanza di tali strutture per modellare sistemi complessi reali, nasce la necessità per la comunità scientifica di avere un dataset comune, per avere un benchmark accurato e corretto tra i risultati di vari studi o di algoritmi.\nIn tale contesto si inserisce questo lavoro di tesi: il primo obiettivo è stata l’implementazione di una libreria che permette la trasformazione dei grafi che sono rappresentati sulla base di dati e metadati in ipergrafi, scritta in linguaggio Julia. Secondo obiettivo è il design ed implementazione di un repository di benchmark e analisi di network tramite ipergrafi.\nQuesto seminario presenterà gli ipergrafi, le applicazioni in vari contesti reali e infine verterà sul mio contributo al progetto, mostrando le componenti principali della nostra libreria."
  image: /assets/img/seminars/default.png
