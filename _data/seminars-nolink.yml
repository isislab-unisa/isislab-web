  title: 'Seminario: &#8220;Bloomy Decision&#8217;s Dashboard: riorganizzazione automatica degli ordini&#8221; di Martina Casalnuovo'
  speakers:
  - '9'
  description: "L’obiettivo della tesi è quello di realizzare una dashboard di gestione e riordino relativa alla riorganizzazione automatica degli ordini presenti in memoria di una grande azienda. La dashboard, oltre ad essere l’oggetto della tesi, rappresenta un reporting contenente dati e informazioni specifici a determinati ordini, precedentemente salvati in memoria. Per lo sviluppo e per la modalità di visualizzazione della dashboard è stata creata una pagina web. Il progetto è realizzato in modo tale da permette il riuso della dashboard in diversi contesti e in diverse applicazioni che abbiano la necessità di possedere e visualizzare un pannello di controllo e di gestione dei dati presenti in memoria. Il lavoro che ho svolto è stato quello di creare una pagina web da aggiungere all’interno di un progetto già esistente, denominato “BloomyDecision” , rendendola però indipendente e disaccoppiandola dalle altre già presenti. La pagina web è suddivisa in più sezioni: barra di navigazione, una box laterale contenente diverse voci che rappresentano i nomi delle tabelle presenti in memoria, ed un box centrale a comparsa dove viene effettivamente visualizzata la tabella con tutti i suoi dati. In conclusione, tale pagina, quindi, permette all’amministratore dell’azienda, dopo aver effettuato il login, di scegliere una tra le diverse tabelle presenti in lista, per poi visualizzare e gestire i dati e le informazioni relative alla tabella selezionata.\n\nIl collegamento alla ISISLab community della piattaforma Discord è disponibile qui o anche utilizzando il seguente QR Code:\n\nISISLab Community\n\nIl seminario si terrà sul canale vocale # seminars della piattaforma Discord è disponibile qui o utilizzando il seguente QR Code:\n\nISISLab Seminars in Discord"
