  speakers:
  - '9'
  description: "Da pochi anni a questa parte ci troviamo spesso ad interagire con i Bot online, dei veri e propri assistenti virtuali in grado di aiutarci a svolgere velocemente e in maniera molto semplice compiti più o meno complessi. Nel corso degli anni, sono stati sviluppati una quantità incredibilmente ampia di assistenti virtuali che consentono di eseguire efficacemente operazioni ricorrenti tramite conversazioni naturali che permettono di capire il linguaggio umano così da comprendere le loro esigenze ed esporre loro delle soluzioni che si adattano al contesto nel quale il Bot lavora. Un notevole aiuto allo sviluppo di questo genere di software è fornito dall'avvento del Cloud Computing e dalla sempre più rapida espansione e miglioramento degli algoritmi di Intelligenza Artificiale.\nDa queste premesse nasce ISISLab HelpDesk , un assistente virtuale in grado di offrire supporto al laboratorio di ricerca ISISLab . ISISLab HelpDesk permette di sollevare gli amministratori del laboratorio da una serie di compiti che sono automatizzati grazie all'aiuto di tale assistente virtuale. Qualsiasi utente può facilmente utilizzare ISISLab HelpDesk grazie agli algoritmi di Intelligenza Artificiale che sono stati implementati. Tali algoritmi permettono all'utente di comunicare con il bot mediante linguaggio naturale. In aggiunta, ISISLab HelpDesk continua ad apprendere e a migliorare nel tempo in modo autonomo. L'architettura del bot sfrutta la tecnologia dei container per ottimizzare le fasi di installazione e di esecuzione, realizzando un'architettura snella e facile da manutenere."
  image: /assets/img/seminars/12994-0dc2d6965a.png
- date: 02/12/2022
  time: 13:00 - 14:00
  venue: Aula P6 (Edificio F3) &#8211; Dipartimento Informatica,  Via Giovanni Paolo II, 132, 84084 Fisciano SA
  title: '&#8220;At School of Open Data: a Literature  Review&#8221;   di   A. Antelmi e  M.A. Pellegrino'
  speakers:
  - '9'
  description: "\nOpen Data are published to let interested stakeholders exploit data and create value out of them, but limited technical skills are a crucial barrier. To overcome this limitation, learners are invited to develop data and information literacy according to 21st-century skills and become aware of open data sources and what they can do with the data.\n\nIn this seminar, we present a systematic literature review of initiatives to let K-12 learners familiarise themselves with Open Data. This review encompasses a total of 21 papers, organised in taxonomies according to the used data format, the adopted approach, and the expected learning outcome. We then compare the included initiatives and discuss challenges that should be overcome to advance the dialogue around Open Data at school."
  image: /assets/img/seminars/12984-cd2b8c667d.png
- date: 30/11/2022
  time: 02:30 - 03:30
  venue: ''
  title: OpenScienceUnisa
  speakers:
  - '9'
  description: "OpenScienceUnisa è un ciclo di seminari e workshop sui temi della #ScienzaAperta e della #ScienzaPubblica , organizzato presso l' Università degli Studi di Salerno dal Centro FiTMU e dal laboratorio ISISLab di Vittorio Scarano con il patrocinio della AISA Associazione Italiana per la promozione della Scienza Aperta .\n\nIn ogni appuntamento, un approfondimento sui temi della scienza aperta e pubblica e un laboratorio pratico.\n\nMercoledì 30 novembre cominciamo a lavorare sulle voci di Wikipedia , la più grande e consultata enciclopedia della storia, per promuovere la produzione di voci di qualità da parte di studiosi e specialisti.\n\nLa partecipazione è libera e gratuita; basta iscriversi! https://bit.ly/openscienceunisa\n\nÈ possibile partecipare in presenza o online. L'aula e la piattaforma verranno comunicate agli iscritti."
