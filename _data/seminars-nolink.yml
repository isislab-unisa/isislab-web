  title: 'Seminario: &#8220;Sviluppo di un microservizio per la gestione delle performance delle applicazioni cloud-native&#8221; di Francesco Scala'
  speakers:
  - '9'
  description: "Studio di un microservizio sviluppato in Golang in grado di supportare recupero, analisi, memorizzazione ed esposizione di metriche di applicazioni cloud-native su cluster Kubernetes. Si analizzerà il ruolo di questa soluzione nella gestione delle performance degli applicativi in cloud, in particolare come supporto alla scalabilità di Kubernetes. Al fine di introdurre al contesto del microservizio, si presenteranno Docker per la containerizzazione, Prometheus come soluzione di monitoring in cloud e InfluxDB in quanto database di serie temporali (TSDB)."
