  title: 'Seminario: &#8220;XR-PaestumGate: un serious game per l&#8217;esplorazione di Paestum in VR&#8221; di Francesco Pio Covino'
  speakers:
  - '9'
  description: "XR-PaestumGate esplora il potenziale delle tecnologie immersive quali la Realtà Virtuale (VR) nell’ambito della valorizzazione del patrimonio culturale.\nIl progetto estende la ricostruzione virtuale del sito archeologico di Paestum mediante la progettazione e l'implementazione della sua versione in VR integrando meccaniche di gioco progettate per aumentare il coinvolgimento e l’interesse dell’utente. Lo sviluppo ha integrato strumenti di modellazione 3D, Game Engine Unity e tecnologie XR per la creazione di un serious game immersivo. L'esperienza si compone di varie attività, dall'esplorazione dell'ambiente per scoprirne i luoghi chiave alla possibilità di condurre una biga romana. L'esperienza è stata sviluppata in due versioni: Desktop e VR. Mentre questo seminario si concentrerà sulla parte di implementazione, durante l'ultima fase del mio percorso di tesi mi concentrerò sulla valutazione, tramite questionario, per analizzare l’impatto dell’esperienza in termini di coinvolgimento, apprendimento e percezione del valore culturale di Paestum."
