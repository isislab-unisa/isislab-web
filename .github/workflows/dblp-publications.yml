name: Update dblp publications and deploy Jekyll

on:
  # Adjust 'main' if your default branch has another name.
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'  # Daily at 04:23 UTC, subject to GitHub scheduling delays

permissions:
  contents: write  # Save generated JSON back to the repository
  pages: write     # Deploy the Jekyll site
  id-token: write  # Required for the GitHub Pages deployment

concurrency:
  group: dblp-jekyll-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download, merge and deduplicate dblp data
        run: python scripts/update_dblp.py

      - name: Commit refreshed JSON only if it changed
        shell: bash
        run: |
          if ! git diff --quiet -- assets/data/dblp-publications.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/data/dblp-publications.json
            git commit -m "chore: update dblp publications [skip ci]"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          else
            echo "The publication list has not changed."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Uses GitHub's Jekyll build action; no custom Gemfile is required.
      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
