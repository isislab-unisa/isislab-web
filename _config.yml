title: ISISLab
description: Laboratorio ISISLab — Dipartimento di Informatica, Università degli Studi di Salerno
url: "https://www.isislab.it"
#url: "https://isislab-unisa.github.io"
baseurl: "" # GitHub Pages project site (https://isislab-unisa.github.io/isislab-web/)
#baseurl: "/isislab-web"
lang: it-IT
markdown: kramdown
permalink: pretty

collections:
  projects:
    output: true
    permalink: /progetti/:name/

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - Dockerfile
  - compose.yaml
  - scripts
  - start.sh
  - preview.html
  - preview-en.html
  - reference
  - LICENSE
  - vendor
  - .gitignore
  - desktop.ini
  - reference/
  - _projects/template-progetto.it.md
  - _projects/template-progetto.en.md
  
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page

  - scope:
      path: ""
      type: projects
    values:
        layout: project
