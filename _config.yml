title: ISISLab
description: Laboratorio ISISLab — Dipartimento di Informatica, Università degli Studi di Salerno
url: "https://isislab-unisa.github.io"
baseurl: "/isislab-web" # GitHub Pages project site (https://isislab-unisa.github.io/isislab-web/)
lang: it-IT
markdown: kramdown
permalink: pretty
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - Dockerfile
  - compose.yaml
  - scripts
  - start.sh
  - preview.html
  - preview-en.html
  - reference
  - LICENSE
  - vendor
  - .gitignore
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page
