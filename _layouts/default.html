<!doctype html>
<html lang="{{ page.lang | default: 'it' }}">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light"><meta name="theme-color" content="#f6f8fb">
  <title>{% if page.title and page.title != '' %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
  <link rel="icon" href="{{ '/assets/img/isislab-mascot.png' | relative_url }}" type="image/png">
  <link rel="alternate" hreflang="{{ page.lang | default: 'it' }}" href="{{ page.url | absolute_url }}">
  {% if page.alt_url %}<link rel="alternate" hreflang="{% if page.lang == 'en' %}it{% else %}en{% endif %}" href="{{ page.alt_url | absolute_url }}">{% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/elegant.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/reference-fidelity.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/refinements-v10.css' | relative_url }}">
  <script>/* Browser preference chooses EN on first Italian-language visit; manual choice wins. */
  (function(){try{var saved=localStorage.getItem('isislab-language'),lang=(navigator.languages&&navigator.languages[0]||navigator.language||'it').toLowerCase(),english=saved==='en'||(!saved&&!lang.startsWith('it'));if(document.documentElement.lang==='it'&&english){var target={{ page.alt_url | default: '/en/' | relative_url | jsonify }};location.replace(target+location.search+location.hash);}}catch(e){}})();
  </script>
</head>
<body class="{% if page.url == '/' or page.url == '/en/' %}home{% else %}interior{% endif %}" data-locale="{{ page.lang | default: 'it' }}">
  {% include header.html %}
  {{ content }}
  {% include footer.html %}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/physics-balls.js' | relative_url }}?v=7.1" defer></script>
</body></html>
